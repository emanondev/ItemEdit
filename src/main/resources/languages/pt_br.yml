generic:
  help:
    player-only: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <red>Comando apenas para jogadores'
    no-item-on-hand: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <red>Você precisa segurar um item na mão'
    lack-permission: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <red>Você não tem permissão %permission%'
    lack-permission-generic: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <red>Você não tem permissão para usar este comando'
    blocked-by-censure: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <red>Você não pode usar este texto, ele contém palavras bloqueadas'
    blocked-by-type-restriction: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <red>Você não pode renomear este item'
    blocked-by-type-restriction-lore: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <red>Você não pode editar a descrição deste item'
    blocked-by-lore-line-limit: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <red>Você não pode adicionar mais linhas à descrição deste item'
    blocked-by-lore-length-limit: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <red>Você não pode definir linhas maiores que %limit% caracteres'
    blocked-by-rename-length-limit: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <red>Você não pode definir nomes com mais de %limit% caracteres'

    prefix: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray>'
    header-format: '<gradient:#54acff:#A78BFA><bold>%header%</bold></gradient> <dark_gray>»</dark_gray> <#A78BFA><bold>Ajuda</bold></#A78BFA>'
    header-sub-format: '<gradient:#54acff:#A78BFA><bold>%header%</bold></gradient> <dark_gray>»</dark_gray> <gradient:#A78BFA:#54acff><bold>%sub%</bold></gradient> <dark_gray>»</dark_gray> <#55d6ff><bold>Ajuda</#55d6ff>'
    command-format: '<gray>/%command%</gray> <#bad1ff>%sub%</#bad1ff> <#d7bbff>%params%</#d7bbff>'
    footer-format: '%prev_clickable% <#7E9CFD><b>Ajuda</b> [%page%/%max_page%]</#7E9CFD> %next_clickable%'
    next_text: '<light_purple><b>><st>> ></st>'
    prev_text: '<light_purple><b><st>< <</st><'
    next_void: '<dark_gray><b>><st>> ></st>'
    prev_void: '<dark_gray><b><st>< <</st><'
    next_hover: '<gold><b>Vá para a página %target%'
    prev_hover: '<gold><b>Vá para a página %target%'
  wrong-material:
    axolotl_bucket: '%prefix% <red>O item deve ser um balde de axolote'
    banner: '%prefix% <red>O item deve ser um banner'
    damageable: '%prefix% <red>O item deve ter durabilidade como ferramentas e armaduras'
    player_head: '%prefix% <red>O item deve ser a cabeça de um jogador'
    rgb_colorable: '%prefix% <red>O item deve ser do tipo colorido, como armaduras de couro, estrelas de fogos de artifício, poções ou flechas com ponta'
    written_book: '%prefix% <red>O item deve ser um livro escrito'
    potion_effect_applicable: '%prefix% <red>O item deve ser uma poção ou uma flecha com ponta ou um ensopado suspeito'
    firework: '%prefix% <red>O item deve ser fogos de artifício'
    spawner_egg: '%prefix% <red>O item deve ser um ovo gerador'
    tropical_fish_bucket: '%prefix% <red>O item deve ser um balde de peixes tropicais'
    writable_book: '%prefix% <red>O item deve ser um livro escrito ou livro e pena'
    compass: '%prefix% <red>O item deve ser uma bússola'
    music_instrument: '%prefix% <red>O item deve ser um chifre de cabra'
    armor: '%prefix% <red>O item deve ser uma armadura'
    enchantment_storage: '%prefix% <red>O item deve ser um livro ou livro encantado'
  wrong-alias:
    axolotl_variant: '%prefix% <red>Valor de Axolotl errado! <dark_red>[<gold>passe o mouse aqui<dark_red>]'
    potion_effect: '%prefix% <red>Valor do efeito errado! <dark_red>[<gold>passe o mouse aqui<dark_red>]'
    animations: '%prefix% <red>Valor de animação errado! <dark_red>[<gold>passe o mouse aqui<dark_red>]'
    sound: '%prefix% <red>Valor de som errado! <dark_red>[<gold>passe o mouse aqui<dark_red>]'
    enchant: '%prefix% <red>Valor de encantamento errado! <dark_red>[<gold>passe o mouse aqui<dark_red>]'
    flag_type: '%prefix% <red>Valor do indicador inválido! <dark_red>[<gold>passe o mouse aqui<dark_red>]'
    book_type: '%prefix% <red>Valor do tipo de livro errado! <dark_red>[<gold>passe o mouse aqui<dark_red>]'
    equip_slot: '%prefix% <red>Valor errado do slot do equipamento! <dark_red>[<gold>passe o mouse aqui<dark_red>]'
    banner_pattern: '%prefix% <red>Valor do padrão errado! <dark_red>[<gold>passe o mouse aqui<dark_red>]'
    color: '%prefix% <red>Valor de cor errado! <dark_red>[<gold>passe o mouse aqui<dark_red>]'
    mob_type: '%prefix% <red>Valor do tipo de ovo errado! <dark_red>[<gold>passe o mouse aqui<dark_red>]'
    trim_material: '%prefix% <red>Valor do material de acabamento errado! <dark_red>[<gold>passe o mouse aqui<dark_red>]'
    tropical_fish_pattern: '%prefix% <red>Valor do padrão errado! <dark_red>[<gold>passe o mouse aqui<dark_red>]'
    trim_pattern: '%prefix% <red>Valor do padrão de corte errado! <dark_red>[<gold>passe o mouse aqui<dark_red>]'
    boolean: '%prefix% <red>Valor booleano errado! <dark_red>[<gold>passe o mouse aqui<dark_red>]'
    attribute: '%prefix% <red>Valor de atributo errado! <dark_red>[<gold>passe o mouse aqui<dark_red>]'
    operation: '%prefix% <red>Valor de operação errado! <dark_red>[<gold>passe o mouse aqui<dark_red>]'
    itemrarity: '%prefix% <red>Valor de raridade errado! <dark_red>[<gold>passe o mouse aqui<dark_red>]'
    entitytype: '%prefix% <red>Valor EntityType errado! <dark_red>[<gold>passe o mouse aqui<dark_red>]'
    entitygroups: '%prefix% <red>Valor de grupo de entidades errado! <dark_red>[<gold>passe o mouse aqui<dark_red>]'
    consumable_effect: '%prefix% <red>Valor de efeito consumível errado! <dark_red>[<gold>passe o mouse aqui<dark_red>]'
    goat_horn_sound: '%prefix% <red>Valor sonoro de chifre de cabra errado! <dark_red>[<gold>passe o mouse aqui<dark_red>]'
    error-pre-hover: '<gradient:#A78BFA:gold><b>Alias:</b></gradient>'
    first_color: '<aqua>'
    second_color: '<yellow>'
itemedit:
  amount:
    description:
      - '<gradient:#A78BFA:gold><b>Definir valor</b></gradient>'
      - ''
      - '<gray><yellow><amount> </yellow>quantidade a definir (até 127)'
      - '<gold><b>Dica</b></gold> <gray>Valores negativos são subtraídos'
      - '<gray> do valor atual do item'
    params: '<amount>'
    feedback: '%prefix% <green>Valor do item definido como <yellow>%amount%'
    feedback-decrease: '%prefix% <green>Valor do item reduzido em <yellow>%amount%'
  attribute:
    description:
      - '<gradient:#A78BFA:gold><b>Editar modificadores de atributos</b></gradient>'
      - ''
      - '<gray><yellow>Add <attribute> <amount> [operation] [slot] </yellow><dark_gray>»</dark_gray> adicionar novos modificadores'
      - '<gray><yellow>Remove <attribute/slot> </yellow><dark_gray>»</dark_gray> remove alguns modificadores'
    params: '<add/remove> [...]'
    add:
      params: '<attribute> <amount> [operation] [slot]'
      description:
        - '<gradient:#A78BFA:gold><b>Adicionar modificador de atributo</b></gradient>'
        - ''
        - '<gray><yellow><attribute> </yellow>tipo de atributo'
        - '<gray><yellow><amount> </yellow>quantidade a definir'
        - '<gray><yellow>[operation] </yellow>como o modificador é adicionado, por padrão somas'
        - '<gray><yellow>[slot] </yellow>aplica este modificador somente quando o item estiver selecionado'
        - '<gray> slot de equipamento ou qualquer slot de equipamento se não for selecionado'
      feedback: '%prefix% <green>Modificador adicionado'
    remove:
      params: '<attribute/slot>'
      description:
        - '<gradient:#A78BFA:gold><b>Remover modificadores</b></gradient>'
        - ''
        - '<gray><yellow><attribute/slot> </yellow>digite para remover, quaisquer modificadores com'
        - '<gray> o valor selecionado é removido'
      feedback-attribute: '%prefix% <green>Modificadores de atributo removidos'
      feedback-equipment: '%prefix% <green>Modificadores de slot de equipamento removidos'
  axolotlvariant:
    description:
      - '<gradient:#A78BFA:gold><b>Editar variante do Axolotl no balde Axolotl</b></gradient>'
      - '<white><sprite:items:item/axolotl_bucket>'
      - '<gray><yellow><type> </yellow>o tipo de axolote'
    params: '<type>'
    feedback: '%prefix% <green>Variante Axolotl alterada para <yellow>%variant%'
  banner:
    description:
      - '<gradient:#A78BFA:gold><b>Editar banner</b></gradient>'
    params: '<add/set/remove/color> [...]'
    set:
      params: '<type> <color> <line>'
      description:
        - '<gradient:#A78BFA:gold><b>Substitua o padrão na linha selecionada</b></gradient>'
      feedback: '%prefix% <green>Conjunto de padrões'
    add:
      params: '<type> <color>'
      description:
        - '<gradient:#A78BFA:gold><b>Adicionar um padrão</b></gradient>'
      feedback: '%prefix% <green>Padrão adicionado'
    remove:
      params: '<line>'
      description:
        - '<gradient:#A78BFA:gold><b>Remover padrão na linha selecionada</b></gradient>'
      feedback: '%prefix% <green>Padrão removido'
    color:
      params: '<line> <color>'
      description:
        - '<gradient:#A78BFA:gold><b>Alterar cor do padrão na linha selecionada</b></gradient>'
      feedback: '%prefix% <green>Padrão recolorido'
  bookauthor:
    description:
      - '<gradient:#A78BFA:gold><b>Definir autor</b></gradient>'
      - '<white><sprite:items:item/written_book>'
      - '<gray>O nome do autor pode conter espaços e também ser colorido'
      - '<gray>Funciona apenas em livros escritos'
    params: '<name>'
    feedback: '%prefix% <green>Autor do livro atualizado'
    feedback-reset: '%prefix% <green>Redefinir autor do livro'
  bookenchant:
    description:
      - '<gradient:#A78BFA:gold><b>Defina encantamentos no livro</b></gradient>'
      - '<white><sprite:items:item/enchanted_book> <sprite:items:item/book>'
      - '<gray>A diferença entre enchant e bookenchant é que'
      - '<gray>um livro com enchant aspecto de fogo coloca alvos em chamas'
      - '<gray>enquanto um livro com bookenchant não'
      - ''
      - '<gray><yellow><enchant> </yellow>enchant tipo'
      - '<gray><yellow>[level] </yellow>nível do enchant, por padrão <yellow>1'
      - ''
      - '<gold><b>Dica</b></gold> <gray>Defina <yellow>[level] </yellow>para <yellow>0 </yellow>para remover um enchant'
    params: '<enchant> [level]'
    feedback-removed: '%prefix% <green>Encantamento de livro removido <yellow>%enchant%'
    feedback: '%prefix% <green>Encantamento de livro aplicado <yellow>%enchant% <green>lv <yellow>%lv%'
  booktype:
    description:
      - '<gradient:#A78BFA:gold><b>Definir tipo de livro</b></gradient>'
      - '<white><sprite:items:item/written_book>'
      - '<gray>Funciona apenas em livros escritos'
    params: '<booktype>'
    feedback: '%prefix% <green>Geração de livro atualizada para <yellow>%generation%'
    feedback-reset: '%prefix% <green>Redefinir geração de livro'
  color:
    description:
      - '<gradient:#A78BFA:gold><b>Definir cor</b></gradient>'
      - '<white><sprite:items:item/potion> <sprite:items:item/tipped_arrow_base> <sprite:items:item/firework_star> <sprite:items:item/leather_chestplate>'
      - '<gray>Funciona em armaduras de couro e estrelas de fogos de artifício, poções e flechas com pontas também!'
      - '<gray><yellow>[red] [green] [blue] </yellow>são a quantidade de cada cor para combinar'
      - '<gray>Cada cor é um valor interno entre 0 e 255'
      - '<gray>Se você está confuso, google "<yellow>Seletor de cores RGB</yellow>"'
    params: '[red] [green] [blue]'
    feedback: '%prefix% <green>Cor atualizada'
  compass:
    description:
      - '<gradient:#A78BFA:gold><b>Definir local de destino da bússola</b></gradient>'
      - '<white><sprite:items:item/compass_00>'
      - '<gray><yellow>Set </yellow><dark_gray>»</dark_gray> definir sua localização como alvo da bússola'
      - '<gray><yellow>Clear </yellow><dark_gray>»</dark_gray> Limpar alvo da bússola'
    params: '<set/clear>'
    set:
      feedback: '%prefix% <green>Bússola agora aponta para <yellow>%world% %x% %y% %z%'
    clear:
      feedback: '%prefix% <green>Alvo da bússola limpo'
  custommodeldata:
    description:
      - '<gradient:#A78BFA:gold><b>Editar dados do modelo personalizado</b></gradient>'
      - ''
      - '<gray>Usado para pacotes de textura'
      - '<gray><yellow>[value] </yellow>int positivo do modelo de dados de destino'
      - '<gray>Nota: servidores modernos usam itemmodel em vez de custommodeldata'
      - '<gray> para texturas, este comando é para clientes legados'
    params: '<value>'
    feedback: '%prefix% <green>Dados do modelo personalizado atualizados'
    feedback-reset: '%prefix% <green>Redefinição de dados do modelo personalizado'
  damage:
    description:
      - '<gradient:#A78BFA:gold><b>Editar durabilidade</b></gradient>'
      - ''
      - '<gray><yellow><durability> </yellow>dano a ser aplicado'
      - '<gray><gold>N.B.</gold> <yellow>0 </yellow>significa nenhum dano, durabilidade total'
    params: '<durability>'
    feedback-reset: '%prefix% <green>Durabilidade restaurada'
    feedback: '%prefix% <green>Durabilidade atualizada'
  equipment:
    description:
      - '<gradient:#A78BFA:gold><b>Define a propriedade Equipamento do item</b></gradient>'
      - ''
      - '<gray><gold><b>Dica</b></gold> Use /itemequip ou /iee'
      - '<gray><gold>N.B.</gold> seus itens bebíveis não podem ser comidos'
    params: ''
  enchant:
    description:
      - '<gradient:#A78BFA:gold><b>Definir encantamentos</b></gradient>'
      - ''
      - '<gray><yellow><enchant> </yellow>enchant tipo'
      - '<gray><yellow>[level] </yellow>nível do enchant, por padrão <yellow>1'
      - ''
      - '<gold><b>Dica</b></gold> <gray>Defina <yellow>[level] </yellow>para <yellow>0 </yellow>para remover um enchant'
    params: '<enchant> [level]'
    feedback-removed: '%prefix% <green>Encantamento removido <yellow>%enchant%'
    feedback: '%prefix% <green>Encantamento aplicado <yellow>%enchant% <green>lv <yellow>%lv%'
  fireresistent:
    description:
      - '<gradient:#A78BFA:gold><b>Defina a resistência do item para fogo/lava</b></gradient>'
      - ''
      - '<gray><yellow>[true/false] </yellow>defina o valor, alterne por padrão'
      - ''
      - '<gray>Um item com resistência ao fogo não será destruído'
      - '<gray> ao cair no fogo e flutuar sobre a lava'
    params: '[true/false]'
    feedback: '%prefix% <green>Resistência ao fogo definida como <yellow>%value%'
  fireworkpower:
    description:
      - '<gradient:#A78BFA:gold><b>Definir poder de fogos de artifício</b></gradient>'
      - '<white><sprite:items:item/firework_rocket>'
      - '<gray><yellow><power> </yellow>poder dos fogos de artifício, um valor entre <yellow>0 </yellow>e <yellow>5'
    params: '<power>'
    feedback: '%prefix% <green>Poder de fogos de artifício atualizado'
  firework:
    description:
      - '<gradient:#A78BFA:gold><b>Edite fogos de artifício com uma GUI</b></gradient>'
      - '<white><sprite:items:item/firework_rocket>'
    params: ''
  food:
    description:
      - '<gradient:#A78BFA:gold><b>Define a propriedade alimentar do item</b></gradient>'
      - ''
      - '<gray><gold><b>Dica</b></gold> Use /itemfood ou /if'
      - '<gray><gold>N.B.</gold> seus itens bebíveis não podem ser comidos'
    params: ''
  glider:
    description:
      - '<gradient:#A78BFA:gold><b>Definir estado do planador</b></gradient>'
      - ''
      - '<gray>O item planador deve permitir planar como nos élitros'
      - '<gray><yellow>[true/false] </yellow>definir valor do planador, por padrão alternar'
    params: '[true/false]'
    feedback: '%prefix% <green>Deslizante atualizado definido como <yellow>%value%'
  glow:
    description:
      - '<gradient:#A78BFA:gold><b>Substituir efeito de brilho de encantamento</b></gradient>'
      - ''
      - '<gray><yellow>[true/false] </yellow>defina o valor, por padrão redefinido'
      - ''
      - '<gold><b>Dica</b></gold> <gray><yellow>nenhum valor especificado </yellow>restaurar comportamento vanilla'
    params: '[true/false/default]'
    feedback: '%prefix% <green>Brilho definido como <yellow>%value%'
    feedback-reset: '%prefix% <green>Redefinir valor de brilho para o padrão'
  goathornsound:
    description:
      - '<gradient:#A78BFA:gold><b>Definir som de buzina de cabra</b></gradient>'
      - '<white><sprite:items:item/goat_horn>'
      - '<gray><yellow><type> </yellow>o tipo de som'
    params: '<type>'
    feedback: '%prefix% <green>Som atualizado'
  hide:
    description:
      - '<gradient:#A78BFA:gold><b>Ocultar ou mostrar componentes</b></gradient>'
      - ''
      - '<gray><yellow><flag> </yellow>indicador de item para editar'
      - '<gray><yellow>[true/false] </yellow>defina o valor do indicador; se omitido, alterna o valor atual'
      - ''
      - '<gold><b>Dica</b></gold> <gray>ocultar padrões de banner com indicador potion_effects'
      - '<gold><b>Dica</b></gold> <gray>ocultar todos os indicadores de uma só vez com <yellow>/itemedit hideall'
    params: '<flag> [true/false]'
    feedback: '%prefix% <green>O indicador agora está definido como <yellow>%value%'
  hidetooltip:
    description:
      - '<gradient:#A78BFA:gold><b>Ocultar ou mostrar dicas de ferramentas</b></gradient>'
      - ''
      - '<gray><yellow>[true/false] </yellow>defina o valor do indicador; se omitido, alterna o valor atual'
    params: '[true/false]'
    feedback: '%prefix% <green>O status oculto da dica de ferramenta agora é <yellow>%value%'
  hideall:
    description:
      - '<gradient:#A78BFA:gold><b>Ocultar todos os componentes</b></gradient>'
      - ''
      - '<gray>Ocultos: encantamentos, efeitos de poções, camadas de banner, atributos...'
      - ''
      - '<gold><b>Dica</b></gold> <gray>ocultar componentes únicos com <yellow>/itemedit hide <flag> true'
    params: ''
    feedback: '%prefix% <green>Todas os indicadores escondidas'
  itemmodel:
    description:
      - '<gradient:#A78BFA:gold><b>Editar modelo do item</b></gradient>'
      - ''
      - '<gray><yellow><namespaced key> </yellow>key para definir para referência de textura'
      - '<gray>Exemplo: /ie itemmodel <yellow>iron_sword'
      - '<gray>Exemplo: /ie itemmodel <yellow>minecraft:iron_sword'
      - ''
      - '<gray><yellow><namespace></yellow>:<yellow><id></yellow> fará referência ao modelo:'
      - '/assets/<yellow><namespace></yellow>/models/item/<yellow><id>'
    params: '<namespaced key>'
    feedback: '%prefix% <green>Modelo de item atualizado'
    feedback-reset: '%prefix% <green>Redefinir modelo de item'
  kinetic:
    description:
      - '<gradient:#A78BFA:gold><b>Define a propriedade cinética do item</b></gradient>'
      - '<white><sprite:items:item/iron_spear>'
      - '<gray><gold><b>Dica</b></gold> Use /itemkinetic ou /iek'
    params: ''
  maxdurability:
    description:
      - '<gradient:#A78BFA:gold><b>Define a durabilidade máxima do item</b></gradient>'
      - ''
      - '<gray><yellow><max durability> </yellow>item novo valor de durabilidade,'
      - '<gray> deve ser maior que 1'
    params: '<max durability>'
    feedback: '%prefix% <green>Durabilidade máxima atualizada para <yellow>%value%'
  maxstacksize:
    description:
      - '<gradient:#A78BFA:gold><b>Define o tamanho máximo da pilha do item</b></gradient>'
      - ''
      - '<gray><yellow>[1-99] </yellow>defina o valor do indicador'
      - ''
      - '<gray><yellow>nenhum valor </yellow>irá restaurar o tamanho da pilha comum que é <yellow>64'
      - '<gray> para a maioria dos itens, <yellow>1</yellow> para armaduras e ferramentas e outros'
      - '<gray> valores para alguns itens'
    params: '[1-99]'
    feedback: '%prefix% <green>Atualizado o tamanho máximo da pilha para <yellow>%value%'
    feedback-reset: '%prefix% <green>Redefinir tamanho máximo da pilha'
  pierce:
    description:
      - '<gradient:#A78BFA:gold><b>Define a propriedade de perfuração do item</b></gradient>'
      - '<white><sprite:items:item/iron_spear>'
      - '<gold><b>Dica</b></gold><gray> Use /itempiercing ou /iep'
    params: ''
  potioneffect:
    itemtag-tip: '%prefix% <gray>Você precisa adicionar efeitos de poção a itens comuns? tente >ItemTag<'
    itemtag-tip-hover:
      - '<gradient:#A78BFA:gold>Clique em mim</gradient>'
    description:
      - '<gradient:#A78BFA:gold><b>Editar efeitos da poção</b></gradient>'
      - '<white><sprite:items:item/potion> <sprite:items:item/suspicious_stew> <sprite:items:item/tipped_arrow_base>'
      - '<gray>Funciona com qualquer Poção, Flechas com Ponta e Ensopado Suspeito!'
      - '<gray><yellow>Add <effect> <duration> [level] </yellow><dark_gray>»</dark_gray> adicionar efeito'
      - '<gray><yellow>Remove <effect> </yellow><dark_gray>»</dark_gray> remove o efeito selecionado'
      - '<gray><yellow>Reset </yellow><dark_gray>»</dark_gray> remover todos os efeitos'
    params: '<add/remove/reset> [...]'
    add:
      params: '<effect> <duration> [level] [particles] [ambient] [icon]'
      description:
        - '<gradient:#A78BFA:gold><b>Adiciona/substitui efeito selecionado</b></gradient>'
        - ''
        - '<gray><yellow><effect> </yellow>tipo de efeito'
        - '<gray><yellow><duration> </yellow>duração em segundos'
        - '<gray><yellow>[level] </yellow>Até 127, por padrão <yellow>1'
        - '<gray><yellow>[particles] </yellow>Deve mostrar partículas? <yellow>true</yellow>/<yellow>false'
        - '<gray><yellow>[ambient] </yellow>As partículas devem ter o indicador de ambiente ativado? <yellow>true</yellow>/<yellow>false'
        - '<gray><yellow>[icon] </yellow>Mostrar ícone no canto superior direito? <yellow>true</yellow>/<yellow>false'
      feedback: '%prefix% <green>Adicionado efeito de poção'
    remove:
      params: '<effect>'
      description:
