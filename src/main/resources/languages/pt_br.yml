    success: '%prefix% <green>Item <yellow>%id% <green>registrado'
    #Holders: %limit%
    limit-reached: '%prefix% <red>Você atingiu o número máximo de itens salváveis (%limit%)'
    description:
      - '<gradient:#A78BFA:gold><b>Registre o item em sua mão</b></gradient>'
      - ''
      - '<gray><yellow><id> </yellow>identifique seu item, não diferencia maiúsculas de minúsculas e não consegue'
      - '<gray> contém espaços ou pontos e você não pode selecionar'
      - '<gray> qualquer ID já usado'
      - ''
      - '<gold><b>Dica</b></gold> <gray>use <yellow>/itemstorage update <id></yellow>, para alterar um item existente'
      - '<gold><b>Dica</b></gold> <gray>recupere seus itens salvos com <yellow>/itemstorage get <id>'
    params: '<id>'
  delete:
    #Holders: %id%
    success: '%prefix% <green>Item <yellow>%id% <green>não registrado'
    description:
      - '<gradient:#A78BFA:gold><b>Excluir item selecionado</b></gradient>'
      - ''
      - '<gray><yellow><id> </yellow>Id do item'
    params: '<id>'
  update:
    #Holders: %id%
    success: '%prefix% <green>Item <yellow>%id% <green>foi atualizado'
    description:
      - '<gradient:#A78BFA:gold><b>Atualizar item selecionado</b></gradient>'
      - ''
      - '<gray>Altere o item associado ao id com seu item de mão'
      - '<gray><yellow><id> </yellow>Id do item'
      - ''
      - '<gray><gold><b>Dica</b></gold> use <yellow>/itemstorage save <id></yellow>, para criar um novo item'
      - '<gray><gold><b>Dica</b></gold> use <yellow>/itemstorage delete <id></yellow>, para excluir um item'
    params: '<id>'
  show:
    description:
      - '<gradient:#A78BFA:gold><b>Abra uma GUI com seus itens salvos</b></gradient>'
      - ''
      - '<gray><yellow>[página] <gray>página da interface gráfica, por padrão 1'
    params: '[page]'
itemeditimport:
  help:
    - '<green>/itemeditimport ItemEditor <dark_green>- importar itens do plugin ItemEditor'
  itemeditor:
    unable-to-get-item:
      - '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <red>Não foi possível carregar o item <gold>%id%'
    already-used-id:
      - '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <gold>%id% <red>já está em uso, talvez você já tenha feito este comando antes, caso contrário você pode renomear o arquivo ItemEditor/items/%id%.yml'
    invalid-id:
      - '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <gold>%id% <red>não é um ID aceitável, você pode renomear o arquivo ItemEditor/items/%id%.yml para um nome alfanumérico'
    import-unsuccess:
      - '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <red>Nenhum dos <gold>%max% <red>itens foi importado, talvez você já tenha feito este comando antes(?)'
    import-success:
      - '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <green>Importado <yellow>%done% <green>de <yellow>%max% <green>itens do ItemEditor'
      - '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <green>Itens importados: <yellow>%ids%'
    import-empty:
      - '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <red>ItemEditor não tem itens para importar'
itemeditreload:
  success: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <green>Recarregado'
