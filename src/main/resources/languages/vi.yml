itemedit:
  amount:
    description:
      - '<gradient:#A78BFA:gold><b>Đặt số tiền</b></gradient>'
      - ''
      - '<gray><yellow><amount> </yellow>số tiền cần đặt (tối đa 127)'
      - '<gold><b>Mẹo</b></gold> <gray>Số âm sẽ bị trừ'
      - '<gray> từ số tiền hiện tại của vật phẩm'
    params: '<amount>'
    feedback: '%prefix% <green>Số lượng vật phẩm được đặt thành <yellow>%amount%'
    feedback-decrease: '%prefix% <green>Số lượng vật phẩm giảm <yellow>%amount%'
  attribute:
    description:
      - '<gradient:#A78BFA:gold><b>Chỉnh sửa công cụ sửa đổi thuộc tính</b></gradient>'
      - ''
      - '<gray><yellow>Add <attribute> <amount> [operation] [slot] </yellow><dark_gray>»</dark_gray> thêm công cụ sửa đổi mới'
      - '<gray><yellow>Remove <attribute/slot> </yellow><dark_gray>»</dark_gray> xóa một số sửa đổi'
    params: '<add/remove> [...]'
    add:
      params: '<attribute> <amount> [operation] [slot]'
      description:
        - '<gradient:#A78BFA:gold><b>Thêm công cụ sửa đổi thuộc tính</b></gradient>'
        - ''
        - '<gray><yellow><attribute> </yellow>loại thuộc tính'
        - '<gray><yellow><amount> </yellow>số tiền cần đặt'
        - '<gray><yellow>[operation] </yellow>cách thêm công cụ sửa đổi, theo tổng mặc định'
        - '<gray><yellow>[slot] </yellow>chỉ áp dụng công cụ sửa đổi này khi mục được chọn'
        - '<gray> ô trang bị hoặc bất kỳ ô trang bị nào nếu không được chọn'
      feedback: '%prefix% <green>Đã thêm công cụ sửa đổi'
    remove:
      params: '<attribute/slot>'
      description:
        - '<gradient:#A78BFA:gold><b>Xóa phần sửa đổi</b></gradient>'
        - ''
        - '<gray><yellow><attribute/slot> </yellow>loại để xóa, bất kỳ công cụ sửa đổi nào có'
        - '<gray> giá trị đã chọn sẽ bị xóa'
      feedback-attribute: '%prefix% <green>Đã xóa phần sửa đổi thuộc tính'
      feedback-equipment: '%prefix% <green>Đã loại bỏ các sửa đổi của ô trang bị'
  axolotlvariant:
    description:
      - '<gradient:#A78BFA:gold><b>Chỉnh sửa Biến thể Axolotl trên thùng Axolotl</b></gradient>'
      - '<white><sprite:items:item/axolotl_bucket>'
      - '<gray><yellow><type> </yellow>loại axolotl'
    params: '<type>'
    feedback: '%prefix% <green>Đã thay đổi biến thể Axolotl thành <yellow>%variant%'
  banner:
    description:
      - '<gradient:#A78BFA:gold><b>Chỉnh sửa banner</b></gradient>'
    params: '<add/set/remove/color> [...]'
    set:
      params: '<type> <color> <line>'
      description:
        - '<gradient:#A78BFA:gold><b>Thay thế mẫu trên dòng đã chọn</b></gradient>'
      feedback: '%prefix% <green>Bộ họa tiết'
    add:
      params: '<type> <color>'
      description:
        - '<gradient:#A78BFA:gold><b>Thêm mẫu</b></gradient>'
      feedback: '%prefix% <green>Đã thêm mẫu'
    remove:
      params: '<line>'
      description:
        - '<gradient:#A78BFA:gold><b>Xóa mẫu trên dòng đã chọn</b></gradient>'
      feedback: '%prefix% <green>Đã xóa mẫu'
    color:
      params: '<line> <color>'
      description:
        - '<gradient:#A78BFA:gold><b>Thay đổi màu mẫu trên dòng đã chọn</b></gradient>'
      feedback: '%prefix% <green>Đổi màu hoa văn'
  bookauthor:
    description:
      - '<gradient:#A78BFA:gold><b>Đặt tác giả</b></gradient>'
      - '<white><sprite:items:item/written_book>'
      - '<gray>Tên tác giả có thể chứa dấu cách và bị tô màu'
      - '<gray>Chỉ hoạt động trên sách Viết'
    params: '<name>'
    feedback: '%prefix% <green>Tác giả sách cập nhật'
    feedback-reset: '%prefix% <green>Đặt lại tác giả sách'
  bookenchant:
    description:
      - '<gradient:#A78BFA:gold><b>Đặt bùa chú vào cuốn sách</b></gradient>'
      - '<white><sprite:items:item/enchanted_book> <sprite:items:item/book>'
      - '<gray>Sự khác biệt giữa enchant và bookenchant là ở chỗ'
      - '<gray>a cuốn sách có khía cạnh lửa enchant khiến mục tiêu bốc cháy khi bị bắn trúng'
      - '<gray>trong khi một cuốn sách có bookenchant thì không'
      - ''
      - '<gray><yellow><enchant> </yellow>loại bùa mê'
      - '<gray><yellow>[level] </yellow>mức độ phù phép, theo mặc định <yellow>1'
      - ''
      - '<gold><b>Mẹo</b></gold> <gray>Đặt <yellow>[level] </yellow>to <yellow>0 </yellow>để loại bỏ bùa mê'
    params: '<enchant> [level]'
    feedback-removed: '%prefix% <green>Bùa mê sách đã bị xóa <yellow>%enchant%'
    feedback: '%prefix% <green>Bùa mê sách ứng dụng <yellow>%enchant% <green>lv <yellow>%lv%'
  booktype:
    description:
      - '<gradient:#A78BFA:gold><b>Đặt loại sách</b></gradient>'
      - '<white><sprite:items:item/written_book>'
      - '<gray>Chỉ hoạt động trên sách Viết'
    params: '<booktype>'
    feedback: '%prefix% <green>Đã cập nhật thế hệ sách lên <yellow>%generation%'
    feedback-reset: '%prefix% <green>Đặt lại thế hệ sách'
  color:
    description:
      - '<gradient:#A78BFA:gold><b>Đặt màu</b></gradient>'
      - '<white><sprite:items:item/potion> <sprite:items:item/tipped_arrow_base> <sprite:items:item/firework_star> <sprite:items:item/leather_chestplate>'
      - '<gray>Hoạt động trên áo giáp da và các ngôi sao pháo hoa, bình thuốc và mũi tên có hiệu ứng thuốc!'
      - '<gray><yellow>[red] [green] [blue] </yellow>là số lượng mỗi màu cần kết hợp'
      - '<gray>Mỗi màu là một giá trị int trong khoảng từ 0 đến 255'
      - '<gray>Nếu bạn bối rối hãy google "<yellow>Bộ chọn màu RGB</yellow>"'
    params: '[red] [green] [blue]'
    feedback: '%prefix% <green>Đã cập nhật màu'
  compass:
    description:
      - '<gradient:#A78BFA:gold><b>Đặt vị trí mục tiêu của la bàn</b></gradient>'
      - '<white><sprite:items:item/compass_00>'
      - '<gray><yellow>Set </yellow><dark_gray>»</dark_gray> đặt vị trí của bạn làm mục tiêu la bàn'
      - '<gray><yellow>Clear </yellow><dark_gray>»</dark_gray> mục tiêu la bàn rõ ràng'
    params: '<set/clear>'
    set:
      feedback: '%prefix% <green>La bàn hiện trỏ tới <yellow>%world% %x% %y% %z%'
    clear:
      feedback: '%prefix% <green>Đã xóa mục tiêu la bàn'
  custommodeldata:
    description:
      - '<gradient:#A78BFA:gold><b>Chỉnh sửa dữ liệu mô hình tùy chỉnh</b></gradient>'
      - ''
      - '<gray>Dùng cho gói họa tiết'
      - '<gray><yellow>[value] </yellow>int dương của mô hình dữ liệu đích'
      - '<gray>Lưu ý: máy chủ hiện đại sử dụng itemmodel thay vì custommodeldata'
      - '<gray> đối với họa tiết, lệnh này dành cho khách hàng cũ'
    params: '<value>'
    feedback: '%prefix% <green>Dữ liệu mô hình tùy chỉnh được cập nhật'
    feedback-reset: '%prefix% <green>Đặt lại dữ liệu mô hình tùy chỉnh'
  damage:
    description:
      - '<gradient:#A78BFA:gold><b>Chỉnh sửa độ bền</b></gradient>'
      - ''
      - '<gray><yellow><durability> </yellow>thiệt hại áp dụng'
      - '<gray><gold>N.B.</gold> <yellow>0 </yellow>có nghĩa là không hư hỏng, hoàn toàn bền bỉ'
    params: '<durability>'
    feedback-reset: '%prefix% <green>Độ bền được phục hồi'
    feedback: '%prefix% <green>Độ bền được cập nhật'
  equipment:
    description:
      - '<gradient:#A78BFA:gold><b>Đặt thuộc tính Trang bị của vật phẩm</b></gradient>'
      - ''
      - '<gray><gold><b>Mẹo</b></gold> Sử dụng /itemequip or /iee'
      - '<gray><gold>N.B.</gold> đồ uống của bạn không thể ăn được'
    params: ''
  enchant:
    description:
      - '<gradient:#A78BFA:gold><b>Đặt bùa chú</b></gradient>'
      - ''
      - '<gray><yellow><enchant> </yellow>loại bùa mê'
      - '<gray><yellow>[level] </yellow>mức độ phù phép, theo mặc định <yellow>1'
      - ''
      - '<gold><b>Mẹo</b></gold> <gray>Đặt <yellow>[level] </yellow>to <yellow>0 </yellow>để loại bỏ bùa mê'
    params: '<enchant> [level]'
    feedback-removed: '%prefix% <green>Bùa mê đã bị loại bỏ <yellow>%enchant%'
    feedback: '%prefix% <green>Bùa mê áp dụng <yellow>%enchant% <green>lv <yellow>%lv%'
  fireresistent:
    description:
      - '<gradient:#A78BFA:gold><b>Đặt vật phẩm có khả năng kháng lửa/dung nham</b></gradient>'
      - ''
      - '<gray><yellow>[true/false] </yellow>đặt giá trị, chuyển đổi theo mặc định'
      - ''
      - '<gray>Một vật phẩm có khả năng chống cháy sẽ không bị phá hủy'
      - '<gray> khi rơi vào lửa và sẽ nổi trên dung nham'
    params: '[true/false]'
    feedback: '%prefix% <green>Khả năng chống cháy được đặt thành <yellow>%value%'
  fireworkpower:
    description:
      - '<gradient:#A78BFA:gold><b>Đặt sức mạnh pháo hoa</b></gradient>'
      - '<white><sprite:items:item/firework_rocket>'
      - '<gray><yellow><power> </yellow>sức mạnh của pháo hoa, giá trị trong khoảng <yellow>0 </yellow>và <yellow>5'
    params: '<power>'
    feedback: '%prefix% <green>Cập nhật sức mạnh pháo hoa'
  firework:
    description:
      - '<gradient:#A78BFA:gold><b>Chỉnh sửa pháo hoa bằng GUI</b></gradient>'
      - '<white><sprite:items:item/firework_rocket>'
    params: ''
  food:
    description:
      - '<gradient:#A78BFA:gold><b>Đặt thuộc tính thực phẩm của vật phẩm</b></gradient>'
      - ''
      - '<gray><gold><b>Mẹo</b></gold> Sử dụng /itemfood or /if'
      - '<gray><gold>N.B.</gold> đồ uống của bạn không thể ăn được'
    params: ''
  glider:
    description:
      - '<gradient:#A78BFA:gold><b>Đặt trạng thái Tàu lượn</b></gradient>'
      - ''
      - '<gray>Vật phẩm tàu lượn sẽ cho phép lướt như trên elytras'
      - '<gray><yellow>[true/false] </yellow>đặt giá trị tàu lượn, chuyển đổi theo mặc định'
    params: '[true/false]'
    feedback: '%prefix% <green>Đã cập nhật Trượt được đặt thành <yellow>%value%'
  glow:
    description:
      - '<gradient:#A78BFA:gold><b>Ghi đè hiệu ứng ánh sáng bùa mê</b></gradient>'
      - ''
      - '<gray><yellow>[true/false] </yellow>đặt giá trị, đặt lại theo mặc định'
      - ''
      - '<gold><b>Mẹo</b></gold> <gray><yellow>không có giá trị nào được chỉ định </yellow>khôi phục hành vi vanilla'
    params: '[true/false/default]'
    feedback: '%prefix% <green>Ánh sáng được đặt thành <yellow>%value%'
    feedback-reset: '%prefix% <green>Đặt lại giá trị phát sáng về mặc định'
  goathornsound:
    description:
      - '<gradient:#A78BFA:gold><b>Đặt âm thanh Sừng Dê</b></gradient>'
      - '<white><sprite:items:item/goat_horn>'
      - '<gray><yellow><type> </yellow>loại âm thanh'
    params: '<type>'
    feedback: '%prefix% <green>Âm thanh được cập nhật'
  hide:
    description:
      - '<gradient:#A78BFA:gold><b>Ẩn hoặc hiển thị các thành phần</b></gradient>'
      - ''
      - '<gray><yellow><flag> </yellow>cờ mục cần chỉnh sửa'
