generic:
  help:
    player-only: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <red>僅限玩家指令'
    no-item-on-hand: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <red>你需要手裡拿著一個物品'
    lack-permission: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <red>您沒有權限%permission%'
    lack-permission-generic: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <red>您沒有權限使用此指令'
    blocked-by-censure: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <red>您不能使用此文本，它包含被阻止的單字'
    blocked-by-type-restriction: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <red>您無法重新命名該物品'
    blocked-by-type-restriction-lore: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <red>您無法編輯該商品的商品描述'
    blocked-by-lore-line-limit: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <red>您無法在此物品上新增更多物品描述行'
    blocked-by-lore-length-limit: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <red>設定的行長度不能超過 %limit% 個字符'
    blocked-by-rename-length-limit: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <red>您設定的名稱不能超過 %limit% 個字符'

    prefix: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray>'
    header-format: '<gradient:#54acff:#A78BFA><bold>%header%</bold></gradient> <dark_gray>»</dark_gray> <#A78BFA><bold>幫助</bold></#A78BFA>'
    header-sub-format: '<gradient:#54acff:#A78BFA><bold>%header%</bold></gradient> <dark_gray>»</dark_gray> <gradient:#A78BFA:#54acff><bold>%sub%</bold></gradient> <dark_gray>»</dark_gray> <#55d6ff><bold>幫助</#55d6ff>'
    command-format: '<gray>/%command%</gray> <#bad1ff>%sub%</#bad1ff> <#d7bbff>%params%</#d7bbff>'
    footer-format: '%prev_clickable% <#7E9CFD><b>幫助</b> [%page%/%max_page%]</#7E9CFD> %next_clickable%'
    next_text: ' <light_purple><b>><st>> ></st> '
    prev_text: ' <light_purple><b><st>< <</st>< '
    next_void: ' <dark_gray><b>><st>> ></st> '
    prev_void: ' <dark_gray><b><st>< <</st>< '
    next_hover: '<gold><b>轉到第%target%頁'
    prev_hover: '<gold><b>轉到第%target%頁'
  wrong-material:
    axolotl_bucket: '%prefix% <red>物品必須是蠑螈桶'
    banner: '%prefix% <red>商品必須是橫幅'
    damageable: '%prefix% <red>物品必須像工具和盔甲一樣具有耐用性'
    player_head: '%prefix% <red>物品必須是玩家頭像'
    rgb_colorable: '%prefix% <red>物品必須是可著色類型，如皮甲、煙火星星、藥水或具有藥水效果的箭頭'
    written_book: '%prefix% <red>物品必須是書面書籍'
    potion_effect_applicable: '%prefix% <red>物品必須是藥水或具有藥水效果的箭或可疑的燉湯'
    firework: '%prefix% <red>物品必須是煙火'
    spawner_egg: '%prefix% <red>物品必須是刷怪蛋'
    tropical_fish_bucket: '%prefix% <red>物品必須是熱帶魚桶'
    writable_book: '%prefix% <red>物品必須是書面書籍或書籍和羽毛筆'
    compass: '%prefix% <red>物品必須是指南針'
    music_instrument: '%prefix% <red>物品必須是山羊角'
    armor: '%prefix% <red>物品必須是盔甲'
    enchantment_storage: '%prefix% <red>物品必須是書或附魔書'
  wrong-alias:
    axolotl_variant: '%prefix% <red>蠑螈價值錯誤！ <dark_red>[<gold>懸停在此處<dark_red>]'
    potion_effect: '%prefix% <red>效果值錯誤！ <dark_red>[<gold>懸停在此處<dark_red>]'
    animations: '%prefix% <red>動畫值錯誤！ <dark_red>[<gold>懸停在此處<dark_red>]'
    sound: '%prefix% <red>聲音值錯誤！ <dark_red>[<gold>懸停在此處<dark_red>]'
    enchant: '%prefix% <red>附魔值錯誤！ <dark_red>[<gold>懸停在此處<dark_red>]'
    flag_type: '%prefix% <red>錯誤的標誌值！ <dark_red>[<gold>懸停在此處<dark_red>]'
    book_type: '%prefix% <red>書籍類型值錯誤！ <dark_red>[<gold>懸停在此處<dark_red>]'
    equip_slot: '%prefix% <red>裝備欄值錯誤！ <dark_red>[<gold>懸停在此處<dark_red>]'
    banner_pattern: '%prefix% <red>圖案值錯誤！ <dark_red>[<gold>懸停在此處<dark_red>]'
    color: '%prefix% <red>顏色值錯誤！ <dark_red>[<gold>懸停在此處<dark_red>]'
    mob_type: '%prefix% <red>雞蛋型值錯誤！ <dark_red>[<gold>懸停在此處<dark_red>]'
    trim_material: '%prefix% <red>装甲装饰材质值错误！ <dark_red>[<gold>懸停在此處<dark_red>]'
    tropical_fish_pattern: '%prefix% <red>圖案值錯誤！ <dark_red>[<gold>懸停在此處<dark_red>]'
    trim_pattern: '%prefix% <red>错误的装甲装饰图案值！ <dark_red>[<gold>懸停在此處<dark_red>]'
    boolean: '%prefix% <red>布爾值錯誤！ <dark_red>[<gold>懸停在此處<dark_red>]'
    attribute: '%prefix% <red>屬性值錯誤！ <dark_red>[<gold>懸停在此處<dark_red>]'
    operation: '%prefix% <red>運算值錯誤！ <dark_red>[<gold>懸停在此處<dark_red>]'
    itemrarity: '%prefix% <red>稀有度值錯誤！ <dark_red>[<gold>懸停在此處<dark_red>]'
    entitytype: '%prefix% <red>實體類型值錯誤！ <dark_red>[<gold>懸停在此處<dark_red>]'
    entitygroups: '%prefix% <red>實體群組值錯誤！ <dark_red>[<gold>懸停在此處<dark_red>]'
    consumable_effect: '%prefix% <red>消耗品效果值錯誤！ <dark_red>[<gold>懸停在此處<dark_red>]'
    goat_horn_sound: '%prefix% <red>羊角聲音值錯誤！ <dark_red>[<gold>懸停在此處<dark_red>]'
    error-pre-hover: '<gradient:#A78BFA:gold><b>別名：</b></gradient>'
    first_color: '<aqua>'
    second_color: '<yellow>'
itemedit:
  amount:
    description:
      - '<gradient:#A78BFA:gold><b>設定金額</b></gradient>'
      - ''
      - '<gray><yellow><amount> </yellow>設定數量（最多127個）'
      - '<gold><b>提示</b></gold> <gray>減去負數'
      - '<gray> 來自專案當前金額'
    params: '<amount>'
    feedback: '%prefix% <green>物品數量設定為<yellow>%amount%'
    feedback-decrease: '%prefix% <green>物品數量減少<yellow>%amount%'
  attribute:
    description:
      - '<gradient:#A78BFA:gold><b>編輯屬性修飾符</b></gradient>'
      - ''
      - '<gray><yellow>Add <attribute> <amount> [operation] [slot] </yellow><dark_gray>»</dark_gray>新增修飾符'
      - '<gray><yellow>Remove <attribute/slot> </yellow><dark_gray>»</dark_gray> 刪除一些修飾符'
    params: '<add/remove> [...]'
    add:
      params: '<attribute> <amount> [operation] [slot]'
      description:
        - '<gradient:#A78BFA:gold><b>新增屬性修飾符</b></gradient>'
        - ''
        - '<gray><yellow><attribute> </yellow>屬性類型'
        - '<gray><yellow><amount> </yellow>設定數量'
        - '<gray><yellow>[operation] </yellow>如何加入修飾符，預設求和'
        - '<gray><yellow>[slot] </yellow>僅當物品處於選取狀態時套用此修飾符'
        - '<gray> 設備槽位或任意設備槽位（如果未選擇）'
      feedback: '%prefix% <green>新增修改器'
    remove:
      params: '<attribute/slot>'
      description:
        - '<gradient:#A78BFA:gold><b>刪除修飾符</b></gradient>'
        - ''
        - '<gray><yellow><attribute/slot> </yellow>要刪除的類型，任何帶有的修飾符'
        - '<gray> 所選值被刪除'
      feedback-attribute: '%prefix% <green>刪除屬性修飾符'
      feedback-equipment: '%prefix% <green>刪除了裝備槽的修飾語'
  axolotlvariant:
    description:
      - '<gradient:#A78BFA:gold><b>在蠑螈桶上編輯蠑螈變體</b></gradient>'
      - '<white><sprite:items:item/axolotl_bucket>'
      - '<gray><yellow><type> </yellow>蠑螈的種類'
    params: '<type>'
    feedback: '%prefix% <green>將蠑螈變種改為<yellow>%variant%'
  banner:
    description:
      - '<gradient:#A78BFA:gold><b>編輯橫幅</b></gradient>'
    params: '<add/set/remove/color> [...]'
    set:
      params: '<type> <color> <line>'
      description:
        - '<gradient:#A78BFA:gold><b>替換所選行上的圖案</b></gradient>'
      feedback: '%prefix% <green>圖案組'
    add:
      params: '<type> <color>'
      description:
        - '<gradient:#A78BFA:gold><b>添加圖案</b></gradient>'
      feedback: '%prefix% <green>添加圖案'
    remove:
      params: '<line>'
      description:
        - '<gradient:#A78BFA:gold><b>刪除所選行上的圖案</b></gradient>'
      feedback: '%prefix% <green>圖案已移除'
    color:
      params: '<line> <color>'
      description:
        - '<gradient:#A78BFA:gold><b>更改所選行上的圖案顏色</b></gradient>'
      feedback: '%prefix% <green>圖案重新著色'
  bookauthor:
    description:
      - '<gradient:#A78BFA:gold><b>設定作者</b></gradient>'
      - '<white><sprite:items:item/written_book>'
      - '<gray>作者姓名可能包含空格且也可能帶有顏色'
      - '<gray>僅適用於書面書籍'
    params: '<name>'
    feedback: '%prefix% <green>更新書籍作者'
    feedback-reset: '%prefix% <green>重設書籍作者'
  bookenchant:
    description:
      - '<gradient:#A78BFA:gold><b>在書本上設定魔咒</b></gradient>'
      - '<white><sprite:items:item/enchanted_book> <sprite:items:item/book>'
      - '<gray>enchant和bookenchant的差別在於'
      - '<gray>一本具有enchant火屬性的書在擊中時會使目標著火'
      - '<gray>而一本有bookenchant的書則沒有'
      - ''
      - '<gray><yellow><enchant> </yellow>結界型'
      - '<gray><yellow>[level] </yellow>附魔等級，預設<yellow>1'
      - ''
      - '<gold><b>提示</b></gold> <gray>將<yellow>[level] </yellow>設定為<yellow>0</yellow>以移除附魔'
    params: '<enchant> [level]'
    feedback-removed: '%prefix% <green>移除書籍附魔<yellow>%enchant%'
    feedback: '%prefix% <green>應用書籍附魔<yellow>%enchant% <green>lv<yellow>%lv%'
  booktype:
    description:
      - '<gradient:#A78BFA:gold><b>設定書籍類型</b></gradient>'
      - '<white><sprite:items:item/written_book>'
      - '<gray>僅適用於書面書籍'
    params: '<booktype>'
    feedback: '%prefix% <green>將書籍生成更新為<yellow>%generation%'
    feedback-reset: '%prefix% <green>重置書籍生成'
  color:
    description:
      - '<gradient:#A78BFA:gold><b>設定顏色</b></gradient>'
      - '<white><sprite:items:item/potion> <sprite:items:item/tipped_arrow_base> <sprite:items:item/firework_star> <sprite:items:item/leather_chestplate>'
      - '<gray>也適用於皮甲和煙火星、藥水和具有藥水效果的箭！'
      - '<gray><yellow>[red] [green] [blue] </yellow>是每種顏色要組合的數量'
      - '<gray>每種顏色都是 0 到 255 之間的 int 值'
      - '<gray>如果你感到困惑谷歌“<yellow>RGB顏色選擇器</yellow>”'
    params: '[red] [green] [blue]'
    feedback: '%prefix% <green>顏色已更新'
  compass:
    description:
      - '<gradient:#A78BFA:gold><b>設定羅盤目標位置</b></gradient>'
      - '<white><sprite:items:item/compass_00>'
      - '<gray><yellow>Set </yellow><dark_gray>»</dark_gray> 將您的位置設定為羅盤目標'
      - '<gray><yellow>Clear </yellow><dark_gray>»</dark_gray> 清晰指南針目標'
    params: '<set/clear>'
    set:
      feedback: '%prefix% <green>羅盤現在指向<yellow>%world% %x% %y% %z%'
    clear:
      feedback: '%prefix% <green>羅盤目標已清除'
  custommodeldata:
    description:
      - '<gradient:#A78BFA:gold><b>編輯自訂模型資料</b></gradient>'
      - ''
      - '<gray>用於材質包'
      - '<gray><yellow>[value] </yellow>目標資料模型的正整數'
      - '<gray>注意：現代伺服器使用itemmodel而不是custommodeldata'
      - '<gray> 對於紋理，此指令適用於舊版用戶端'
    params: '<value>'
    feedback: '%prefix% <green>更新自訂模型數據'
    feedback-reset: '%prefix% <green>自訂模型資料重置'
  damage:
    description:
      - '<gradient:#A78BFA:gold><b>編輯耐久度</b></gradient>'
      - ''
      - '<gray><yellow><durability> </yellow>適用傷害'
      - '<gray><gold>N.B.</gold> <yellow>0 </yellow>表示無損壞，完全耐久'
    params: '<durability>'
    feedback-reset: '%prefix% <green>恢復耐久度'
    feedback: '%prefix% <green>耐久性更新'
  equipment:
    description:
      - '<gradient:#A78BFA:gold><b>設定物品的裝備屬性</b></gradient>'
      - ''
      - '<gray><gold><b>提示</b></gold>使用/itemequip or /iee'
      - '<gray><gold>NB.</gold> 您的飲用水不能食用'
    params: ''
  enchant:
    description:
      - '<gradient:#A78BFA:gold><b>設定魔咒</b></gradient>'
      - ''
      - '<gray><yellow><enchant> </yellow>結界型'
      - '<gray><yellow>[level] </yellow>附魔等級，預設<yellow>1'
      - ''
      - '<gold><b>提示</b></gold> <gray>將<yellow>[level] </yellow>設定為<yellow>0</yellow>以移除附魔'
    params: '<enchant> [level]'
    feedback-removed: '%prefix% <green>移除附魔<yellow>%enchant%'
    feedback: '%prefix% <green>已應用附魔<yellow>%enchant% <green>lv<yellow>%lv%'
  fireresistent:
    description:
      - '<gradient:#A78BFA:gold><b>設定物品對火/熔岩的抵抗力</b></gradient>'
      - ''
      - '<gray><yellow>[true/false] </yellow>設定值，預設切換'
      - ''
      - '<gray>具有耐火性的物品不會被摧毀'
      - '<gray> 落入火中時會漂浮在熔岩上'
    params: '[true/false]'
    feedback: '%prefix% <green>防火設定為<yellow>%value%'
  fireworkpower:
    description:
      - '<gradient:#A78BFA:gold><b>設定煙火威力</b></gradient>'
      - '<white><sprite:items:item/firework_rocket>'
      - '<gray><yellow><power> </yellow>煙火威力，介於<yellow>0 </yellow>和<yellow>5之間的數值'
    params: '<power>'
    feedback: '%prefix% <green>更新煙火威力'
  firework:
    description:
      - '<gradient:#A78BFA:gold><b>使用 GUI 編輯煙火</b></gradient>'
      - '<white><sprite:items:item/firework_rocket>'
    params: ''
  food:
    description:
      - '<gradient:#A78BFA:gold><b>設定物品的食物屬性</b></gradient>'
      - ''
      - '<gray><gold><b>提示</b></gold>使用/itemfood or /if'
      - '<gray><gold>NB.</gold> 您的飲用水不能食用'
    params: ''
  glider:
    description:
      - '<gradient:#A78BFA:gold><b>設定滑翔機狀態</b></gradient>'
      - ''
      - '<gray>滑翔機物品應該允許像鞘翅一樣滑翔'
      - '<gray><yellow>[true/false] </yellow>設定滑翔機值，預設切換'
    params: '[true/false]'
    feedback: '%prefix% <green>更新滑翔設定為<yellow>%value%'
  glow:
    description:
      - '<gradient:#A78BFA:gold><b>覆蓋附魔發光效果</b></gradient>'
      - ''
      - '<gray><yellow>[true/false] </yellow>設定值，預設重設'
      - ''
      - '<gold><b>提示</b></gold> <gray><yellow>未指定值</yellow>恢復原版行為'
    params: '[true/false/default]'
    feedback: '%prefix% <green>發光設定為 <yellow>%value%'
    feedback-reset: '%prefix% <green>將發光值重設為預設值'
  goathornsound:
    description:
      - '<gradient:#A78BFA:gold><b>設定山羊角聲音</b></gradient>'
      - '<white><sprite:items:item/goat_horn>'
      - '<gray><yellow><type> </yellow>聲音類型'
    params: '<type>'
    feedback: '%prefix% <green>更新聲音'
  hide:
    description:
      - '<gradient:#A78BFA:gold><b>隱藏或顯示組件</b></gradient>'
      - ''
      - '<gray><yellow><flag> </yellow>要編輯的專案標誌'
      - '<gray><yellow>[true/false] </yellow>設定flag值，預設切換'
      - ''
      - '<gold><b>提示</b></gold> <gray>隱藏帶有potion_effects標誌的橫幅圖案'
      - '<gold><b>提示</b></gold> <gray>使用<yellow>/itemedit hideall一次隱藏所有標誌'
    params: '<flag> [true/false]'
    feedback: '%prefix% <green>標記現在是<yellow>%value%'
  hidetooltip:
    description:
      - '<gradient:#A78BFA:gold><b>隱藏或顯示工具提示</b></gradient>'
      - ''
      - '<gray><yellow>[true/false] </yellow>設定flag值，預設切換'
    params: '[true/false]'
    feedback: '%prefix% <green>工具提示隱藏狀態現在為<yellow>%value%'
  hideall:
    description:
      - '<gradient:#A78BFA:gold><b>隱藏所有組件</b></gradient>'
      - ''
      - '<gray>隱藏：附魔、藥水效果、橫幅層、屬性......'
      - ''
      - '<gold><b>提示</b></gold> <gray>使用<yellow>/itemedit hide <flag> true隱藏單一組件'
    params: ''
    feedback: '%prefix% <green>隱藏所有標記'
  itemmodel:
    description:
      - '<gradient:#A78BFA:gold><b>編輯物品模型</b></gradient>'
      - ''
      - '<gray><yellow><namespaced key> </yellow>設定紋理參考的鍵'
      - '<gray>範例：/ie itemmodel <yellow>iron_sword'
      - '<gray>範例：/ie itemmodel <yellow>minecraft:iron_sword'
      - ''
      - '<gray><yellow><namespace></yellow>:<yellow><id></yellow> 將參考模型：'
      - '  /assets/<yellow><namespace></yellow>/models/item/<yellow><id>'
    params: '<namespaced key>'
    feedback: '%prefix% <green>更新了物品模型'
    feedback-reset: '%prefix% <green>重設物品模型'
  kinetic:
    description:
      - '<gradient:#A78BFA:gold><b>設定物品的動力屬性</b></gradient>'
      - '<white><sprite:items:item/iron_spear>'
      - '<gray><gold><b>提示</b></gold>使用/itemkinetic or /iek'
    params: ''
  maxdurability:
    description:
      - '<gradient:#A78BFA:gold><b>設定物品最大耐久度</b></gradient>'
      - ''
      - '<gray><yellow><max durability> </yellow>物品新的耐久值，'
      - '<gray> 必須大於 1'
    params: '<max durability>'
    feedback: '%prefix% <green>更新最大耐久度至<yellow>%value%'
  maxstacksize:
    description:
      - '<gradient:#A78BFA:gold><b>設定物品最大堆疊大小</b></gradient>'
      - ''
      - '<gray><yellow>[1-99] </yellow>設定標誌值'
      - ''
      - '<gray><yellow>無值</yellow>將恢復公共堆疊大小，即<yellow>64'
      - '<gray>適用於大多數物品，<yellow>1</yellow>適用於盔甲和工具，以及其他'
      - '<gray> 一些物品的值'
    params: '[1-99]'
    feedback: '%prefix% <green>將最大堆疊大小更新為<yellow>%value%'
    feedback-reset: '%prefix% <green>重設最大堆疊大小'
  pierce:
    description:
      - '<gradient:#A78BFA:gold><b>設定物品的穿刺武器屬性</b></gradient>'
      - '<white><sprite:items:item/iron_spear>'
      - '<gold><b>提示</b></gold><gray>使用/itempiercing or /iep'
    params: ''
