generic:
  help:
    player-only: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <red>Comando disponibile solo ai giocatori'
    no-item-on-hand: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <red>Devi tenere un oggetto in mano'
    lack-permission: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <red>Non hai il permesso %permission%'
    lack-permission-generic: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <red>Non hai il permesso di usare questo comando'
    blocked-by-censure: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <red>Non puoi usare questo testo: contiene parole vietate'
    blocked-by-type-restriction: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <red>Non puoi rinominare questo oggetto'
    blocked-by-type-restriction-lore: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <red>Non puoi modificare la descrizione di questo oggetto'
    blocked-by-lore-line-limit: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <red>Non puoi aggiungere altre righe alla descrizione'
    blocked-by-lore-length-limit: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <red>Non puoi impostare righe più lunghe di %limit% caratteri'
    blocked-by-rename-length-limit: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <red>Non puoi impostare nomi più lunghi di %limit% caratteri'

    prefix: "<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray>"
    header-format: "<gradient:#54acff:#A78BFA><bold>%header%</bold></gradient> <dark_gray>»</dark_gray> <#A78BFA><bold>Aiuto</bold></#A78BFA>"
    header-sub-format: "<gradient:#54acff:#A78BFA><bold>%header%</bold></gradient> <dark_gray>»</dark_gray> <gradient:#A78BFA:#54acff><bold>%sub%</bold></gradient> <dark_gray>»</dark_gray> <#55d6ff><bold>Aiuto</#55d6ff>"
    command-format: "<gray>/%command%</gray> <#bad1ff>%sub%</#bad1ff> <#d7bbff>%params%</#d7bbff>"
    footer-format: "%prev_clickable% <#7E9CFD><b>Aiuto</b> [%page%/%max_page%]</#7E9CFD> %next_clickable%"
    next_text: " <light_purple><b>><st>> ></st> "
    prev_text: " <light_purple><b><st>< <</st>< "
    next_void: " <dark_gray><b>><st>> ></st> "
    prev_void: " <dark_gray><b><st>< <</st>< "
    next_hover: "<gold><b>Vai alla pagina %target%"
    prev_hover: "<gold><b>Vai alla pagina %target%"
  wrong-material:
    axolotl_bucket: '%prefix% <red>L''oggetto deve essere un secchio di assolotti'
    banner: '%prefix% <red>L''oggetto deve essere uno stendardo'
    damageable: '%prefix% <red>L''oggetto deve avere durabilità, come strumenti e armature'
    player_head: '%prefix% <red>L''oggetto deve essere una testa di giocatore'
    rgb_colorable: '%prefix% <red>L''oggetto deve essere colorabile, come armature di cuoio, stelle pirotecniche, pozioni o frecce imbevute'
    written_book: '%prefix% <red>L''oggetto deve essere un libro scritto'
    potion_effect_applicable: '%prefix% <red>L''oggetto deve essere una pozione, una freccia imbevuta o uno stufato sospetto'
    firework: '%prefix% <red>L''oggetto deve essere un fuoco d''artificio'
    spawner_egg: '%prefix% <red>L''oggetto deve essere un uovo generatore'
    tropical_fish_bucket: '%prefix% <red>L''oggetto deve essere un secchio di pesci tropicali'
    writable_book: '%prefix% <red>L''oggetto deve essere un libro scritto or book e quill'
    compass: '%prefix% <red>L''oggetto deve essere una bussola'
    music_instrument: '%prefix% <red>L''oggetto deve essere un corno di capra'
    armor: '%prefix% <red>L''oggetto deve essere un''armatura'
    enchantment_storage: '%prefix% <red>L''oggetto deve essere un libro o un libro incantato'
  wrong-alias:
    axolotl_variant: '%prefix% <red>Variante dell''assolotto non valida! <dark_red>[<gold>passa qui sopra<dark_red>]'
    potion_effect: '%prefix% <red>Effetto non valido! <dark_red>[<gold>passa qui sopra<dark_red>]'
    animations: '%prefix% <red>Animazione non valida! <dark_red>[<gold>passa qui sopra<dark_red>]'
    sound: '%prefix% <red>Suono non valido! <dark_red>[<gold>passa qui sopra<dark_red>]'
    enchant: '%prefix% <red>Incantesimo non valido! <dark_red>[<gold>passa qui sopra<dark_red>]'
    flag_type: '%prefix% <red>Flag non valido! <dark_red>[<gold>passa qui sopra<dark_red>]'
    book_type: '%prefix% <red>Tipo di libro non valido! <dark_red>[<gold>passa qui sopra<dark_red>]'
    equip_slot: '%prefix% <red>Slot equipaggiamento non valido! <dark_red>[<gold>passa qui sopra<dark_red>]'
    banner_pattern: '%prefix% <red>Motivo non valido! <dark_red>[<gold>passa qui sopra<dark_red>]'
    color: '%prefix% <red>Colore non valido! <dark_red>[<gold>passa qui sopra<dark_red>]'
    mob_type: '%prefix% <red>Tipo di uovo non valido! <dark_red>[<gold>passa qui sopra<dark_red>]'
    trim_material: '%prefix% <red>Materiale decorativo non valido! <dark_red>[<gold>passa qui sopra<dark_red>]'
    tropical_fish_pattern: '%prefix% <red>Motivo non valido! <dark_red>[<gold>passa qui sopra<dark_red>]'
    trim_pattern: '%prefix% <red>Motivo decorativo non valido! <dark_red>[<gold>passa qui sopra<dark_red>]'
    boolean: '%prefix% <red>Valore booleano non valido! <dark_red>[<gold>passa qui sopra<dark_red>]'
    attribute: '%prefix% <red>Attributo non valido! <dark_red>[<gold>passa qui sopra<dark_red>]'
    operation: '%prefix% <red>Operazione non valida! <dark_red>[<gold>passa qui sopra<dark_red>]'
    itemrarity: '%prefix% <red>Rarità non valida! <dark_red>[<gold>passa qui sopra<dark_red>]'
    entitytype: '%prefix% <red>Tipo di entità non valido! <dark_red>[<gold>passa qui sopra<dark_red>]'
    entitygroups: '%prefix% <red>Gruppo di entità non valido! <dark_red>[<gold>passa qui sopra<dark_red>]'
    consumable_effect: '%prefix% <red>Effetto consumabile non valido! <dark_red>[<gold>passa qui sopra<dark_red>]'
    goat_horn_sound: '%prefix% <red>Suono del corno di capra non valido! <dark_red>[<gold>passa qui sopra<dark_red>]'
    error-pre-hover: '<gradient:#A78BFA:gold><b>Alias:</b></gradient>'
    first_color: '<aqua>'
    second_color: '<yellow>'
itemedit:
  amount:
    description:
      - '<gradient:#A78BFA:gold><b>Imposta quantità</b></gradient>'
      - ''
      - '<gray><yellow><amount> </yellow>quantità da impostare (fino a 127)'
      - '<gold><b>Suggerimento</b></gold> <gray>Le quantità negative vengono sottratte'
      - '<gray> dalla quantità attuale dell''oggetto'
    params: '<amount>'
    feedback: '%prefix% <green>Quantità dell''oggetto impostata su <yellow>%amount%'
    feedback-decrease: '%prefix% <green>Quantità dell''oggetto ridotta di <yellow>%amount%'
  attribute:
    description:
      - '<gradient:#A78BFA:gold><b>Modifica i modificatori degli attributi</b></gradient>'
      - ''
      - '<gray><yellow>Add <attribute> <amount> [operation] [slot] </yellow><dark_gray>»</dark_gray> aggiunge nuovi modificatori'
      - '<gray><yellow>Remove <attribute/slot> </yellow><dark_gray>»</dark_gray> rimuove alcuni modificatori'
    params: '<add/remove> [...]'
    add:
      params: '<attribute> <amount> [operation] [slot]'
      description:
        - '<gradient:#A78BFA:gold><b>Aggiungi modificatore attributo</b></gradient>'
        - ''
        - '<gray><yellow><attribute> </yellow>tipo di attributo'
        - '<gray><yellow><amount> </yellow>quantità da impostare'
        - '<gray><yellow>[operation] </yellow>modalità di applicazione del modificatore; per impostazione predefinita somma'
        - '<gray><yellow>[slot] </yellow>applica il modificatore solo quando l''oggetto si trova nello slot'
        - '<gray>       di equipaggiamento scelto, oppure in qualsiasi slot se non specificato'
      feedback: '%prefix% <green>Modificatore aggiunto'
    remove:
      params: '<attribute/slot>'
      description:
        - '<gradient:#A78BFA:gold><b>Rimuovi modificatori</b></gradient>'
        - ''
        - '<gray><yellow><attribute/slot> </yellow>tipo da rimuovere: verranno rimossi tutti i modificatori con'
        - '<gray>                 il valore selezionato'
      feedback-attribute: '%prefix% <green>Modificatori dell''attributo rimossi'
      feedback-equipment: '%prefix% <green>Modificatori dello slot di equipaggiamento rimossi'
  axolotlvariant:
    description:
      - '<gradient:#A78BFA:gold><b>Modifica la variante dell''assolotto nel secchio</b></gradient>'
      - '<white><sprite:items:item/axolotl_bucket>'
      - '<gray><yellow><type> </yellow>tipo di assolotto'
    params: '<type>'
    feedback: '%prefix% <green>Variante dell''assolotto impostata su <yellow>%variant%'
  banner:
    description:
      - '<gradient:#A78BFA:gold><b>Modifica lo stendardo</b></gradient>'
    params: '<add/set/remove/color> [...]'
    set:
      params: '<type> <color> <line>'
      description:
        - '<gradient:#A78BFA:gold><b>Sostituisci il motivo nella riga selezionata</b></gradient>'
      feedback: '%prefix% <green>Motivo impostato'
    add:
      params: '<type> <color>'
      description:
        - '<gradient:#A78BFA:gold><b>Aggiungi un motivo</b></gradient>'
      feedback: '%prefix% <green>Motivo aggiunto'
    remove:
      params: '<line>'
      description:
        - '<gradient:#A78BFA:gold><b>Rimuovi il motivo dalla riga selezionata</b></gradient>'
      feedback: '%prefix% <green>Motivo rimosso'
    color:
      params: '<line> <color>'
      description:
        - '<gradient:#A78BFA:gold><b>Cambia il colore del motivo nella riga selezionata</b></gradient>'
      feedback: '%prefix% <green>Colore del motivo cambiato'
  bookauthor:
    description:
      - '<gradient:#A78BFA:gold><b>Imposta autore</b></gradient>'
      - '<white><sprite:items:item/written_book>'
      - '<gray>Il nome dell''autore può contenere spazi e può anche essere colorato'
      - '<gray>Funziona solo con i libri scritti'
    params: '<name>'
    feedback: '%prefix% <green>Autore del libro aggiornato'
    feedback-reset: '%prefix% <green>Autore del libro ripristinato'
  bookenchant:
    description:
      - '<gradient:#A78BFA:gold><b>Imposta gli incantesimi sul libro</b></gradient>'
      - '<white><sprite:items:item/enchanted_book> <sprite:items:item/book>'
      - '<gray>La differenza tra enchant e bookenchant è che'
      - '<gray>un libro con Aspetto di fuoco incendia i bersagli colpiti'
      - '<gray>mentre un libro con bookenchant non lo fa'
      - ''
      - '<gray><yellow><enchant> </yellow>tipo di incantesimo'
      - '<gray><yellow>[level] </yellow>livello dell''incantesimo; per impostazione predefinita <yellow>1'
      - ''
      - '<gold><b>Suggerimento</b></gold> <gray>Imposta <yellow>[level] </yellow>su <yellow>0 </yellow>per rimuovere un incantesimo'
    params: '<enchant> [level]'
    feedback-removed: '%prefix% <green>Incantesimo del libro rimosso: <yellow>%enchant%'
    feedback: '%prefix% <green>Incantesimo del libro applicato: <yellow>%enchant% <green>lv <yellow>%lv%'
  booktype:
    description:
      - '<gradient:#A78BFA:gold><b>Imposta il tipo di libro</b></gradient>'
      - '<white><sprite:items:item/written_book>'
      - '<gray>Funziona solo con i libri scritti'
    params: '<booktype>'
    feedback: '%prefix% <green>Generazione del libro aggiornata a <yellow>%generation%'
    feedback-reset: '%prefix% <green>Generazione del libro ripristinata'
  color:
    description:
      - '<gradient:#A78BFA:gold><b>Imposta colore</b></gradient>'
      - '<white><sprite:items:item/potion> <sprite:items:item/tipped_arrow_base> <sprite:items:item/firework_star> <sprite:items:item/leather_chestplate>'
      - '<gray>Funziona anche con armature di cuoio, stelle pirotecniche, pozioni e frecce imbevute!'
      - '<gray><yellow>[red] [green] [blue] </yellow>sono i valori dei colori da combinare'
      - '<gray>Ogni colore è un numero intero compreso tra 0 e 255'
      - '<gray>Se hai dubbi, cerca su Google "<yellow>RGB color picker</yellow>"'
    params: '[red] [green] [blue]'
    feedback: '%prefix% <green>Colore aggiornato'
  compass:
    description:
      - '<gradient:#A78BFA:gold><b>Imposta la destinazione della bussola</b></gradient>'
      - '<white><sprite:items:item/compass_00>'
      - '<gray><yellow>Set </yellow><dark_gray>»</dark_gray> imposta la tua posizione come destinazione della bussola'
      - '<gray><yellow>Clear </yellow><dark_gray>»</dark_gray> cancella la destinazione della bussola'
    params: '<set/clear>'
    set:
      feedback: '%prefix% <green>La bussola ora punta a <yellow>%world% %x% %y% %z%'
    clear:
      feedback: '%prefix% <green>Destinazione della bussola cancellata'
  custommodeldata:
    description:
      - '<gradient:#A78BFA:gold><b>Modifica i dati del modello personalizzato</b></gradient>'
      - ''
      - '<gray>Usato nei pacchetti di texture'
      - '<gray><yellow>[value] </yellow>numero intero positivo del modello da impostare'
      - '<gray>Nota: i server moderni usano itemmodel al posto di custommodeldata'
      - '<gray> per le texture; questo comando è per i client meno recenti'
    params: '<value>'
    feedback: '%prefix% <green>Dati del modello personalizzato aggiornati'
    feedback-reset: '%prefix% <green>Dati del modello personalizzato ripristinati'
  damage:
    description:
      - '<gradient:#A78BFA:gold><b>Modifica la durabilità</b></gradient>'
      - ''
      - '<gray><yellow><durability> </yellow>danno da applicare'
      - '<gray><gold>N.B.</gold> <yellow>0 </yellow>significa nessun danno e durabilità completa'
    params: '<durability>'
    feedback-reset: '%prefix% <green>Durabilità ripristinata'
    feedback: '%prefix% <green>Durabilità aggiornata'
  equipment:
    description:
      - '<gradient:#A78BFA:gold><b>Imposta la proprietà equipaggiamento dell''oggetto</b></gradient>'
      - ''
      - '<gray><gold><b>Suggerimento</b></gold> Usa /itemequip o /iee'
      - '<gray><gold>N.B.</gold> gli oggetti da bere non possono essere mangiati'
    params: ''
  enchant:
    description:
      - '<gradient:#A78BFA:gold><b>Imposta gli incantesimi</b></gradient>'
      - ''
      - '<gray><yellow><enchant> </yellow>tipo di incantesimo'
      - '<gray><yellow>[level] </yellow>livello dell''incantesimo; per impostazione predefinita <yellow>1'
      - ''
      - '<gold><b>Suggerimento</b></gold> <gray>Imposta <yellow>[level] </yellow>su <yellow>0 </yellow>per rimuovere un incantesimo'
    params: '<enchant> [level]'
    feedback-removed: '%prefix% <green>Incantesimo rimosso: <yellow>%enchant%'
    feedback: '%prefix% <green>Incantesimo applicato: <yellow>%enchant% <green>lv <yellow>%lv%'
  fireresistent:
    description:
      - '<gradient:#A78BFA:gold><b>Imposta la resistenza al fuoco e alla lava</b></gradient>'
      - ''
      - '<gray><yellow>[true/false] </yellow>imposta il valore; per impostazione predefinita alterna lo stato'
      - ''
      - '<gray>Un oggetto resistente al fuoco non verrà distrutto'
      - '<gray> se cade nel fuoco e galleggerà sulla lava'
    params: '[true/false]'
    feedback: '%prefix% <green>Resistenza al fuoco impostata su <yellow>%value%'
  fireworkpower:
    description:
      - '<gradient:#A78BFA:gold><b>Imposta la potenza del fuoco d''artificio</b></gradient>'
      - '<white><sprite:items:item/firework_rocket>'
      - '<gray><yellow><power> </yellow>potenza del fuoco d''artificio, un valore compreso tra <yellow>0 </yellow>and <yellow>5'
    params: '<power>'
    feedback: '%prefix% <green>Potenza del fuoco d''artificio aggiornata'
  firework:
    description:
      - '<gradient:#A78BFA:gold><b>Modifica il fuoco d''artificio tramite interfaccia</b></gradient>'
      - '<white><sprite:items:item/firework_rocket>'
    params: ''
  food:
    description:
      - '<gradient:#A78BFA:gold><b>Imposta la proprietà cibo dell''oggetto</b></gradient>'
      - ''
      - '<gray><gold><b>Suggerimento</b></gold> Usa /itemfood o /if'
      - '<gray><gold>N.B.</gold> gli oggetti da bere non possono essere mangiati'
    params: ''
  glider:
    description:
      - '<gradient:#A78BFA:gold><b>Imposta lo stato di planata</b></gradient>'
      - ''
      - '<gray>L''oggetto dovrebbe consentire di planare come con le elitre'
      - '<gray><yellow>[true/false] </yellow>imposta il valore di planata; per impostazione predefinita alterna lo stato'
    params: '[true/false]'
    feedback: '%prefix% <green>Planata impostata su <yellow>%value%'
  glow:
    description:
      - '<gradient:#A78BFA:gold><b>Sovrascrive l''effetto luminoso degli incantesimi</b></gradient>'
      - ''
      - '<gray><yellow>[true/false] </yellow>imposta il valore; per impostazione predefinita ripristina'
      - ''
      - '<gold><b>Suggerimento</b></gold> <gray><yellow>nessun valore specificato </yellow>ripristina il comportamento predefinito'
    params: '[true/false/default]'
    feedback: '%prefix% <green>Luminosità impostata su <yellow>%value%'
    feedback-reset: '%prefix% <green>Luminosità ripristinata al valore predefinito'
  goathornsound:
    description:
      - '<gradient:#A78BFA:gold><b>Imposta il suono del corno di capra</b></gradient>'
      - '<white><sprite:items:item/goat_horn>'
      - '<gray><yellow><type> </yellow>tipo di suono'
    params: '<type>'
    feedback: '%prefix% <green>Suono aggiornato'
  hide:
    description:
      - '<gradient:#A78BFA:gold><b>Nascondi o mostra i componenti</b></gradient>'
      - ''
      - '<gray><yellow><flag> </yellow>flag dell''oggetto da modificare'
      - '<gray><yellow>[true/false] </yellow>imposta il valore del flag; per impostazione predefinita alterna lo stato'
      - ''
      - '<gold><b>Suggerimento</b></gold> <gray>nascondi i motivi degli stendardi con il flag potion_effects'
      - '<gold><b>Suggerimento</b></gold> <gray>nascondi tutti i flag insieme con <yellow>/itemedit hideall'
    params: '<flag> [true/false]'
    feedback: '%prefix% <green>Flag impostato su <yellow>%value%'
  hidetooltip:
    description:
      - '<gradient:#A78BFA:gold><b>Nascondi o mostra i suggerimenti</b></gradient>'
      - ''
      - '<gray><yellow>[true/false] </yellow>imposta il valore del flag; per impostazione predefinita alterna lo stato'
    params: '[true/false]'
    feedback: '%prefix% <green>Visibilità dei suggerimenti impostata su <yellow>%value%'
  hideall:
    description:
      - '<gradient:#A78BFA:gold><b>Nascondi tutti i componenti</b></gradient>'
      - ''
      - '<gray>Nasconde: incantesimi, effetti delle pozioni, motivi degli stendardi, attributi...'
      - ''
      - '<gold><b>Suggerimento</b></gold> <gray>nascondi singoli componenti con <yellow>/itemedit hide <flag> true'
    params: ''
    feedback: '%prefix% <green>Tutti i flag sono stati nascosti'
  itemmodel:
    description:
      - '<gradient:#A78BFA:gold><b>Modifica il modello dell''oggetto</b></gradient>'
      - ''
      - '<gray><yellow><namespaced key> </yellow>chiave da impostare come riferimento alla texture'
      - '<gray>Esempio: /ie itemmodel <yellow>iron_sword'
      - '<gray>Esempio: /ie itemmodel <yellow>minecraft:iron_sword'
      - ''
      - '<gray><yellow><namespace></yellow>:<yellow><id></yellow> farà riferimento al modello:'
      - '  /assets/<yellow><namespace></yellow>/models/item/<yellow><id>'
    params: '<namespaced key>'
    feedback: '%prefix% <green>Modello dell''oggetto aggiornato'
    feedback-reset: '%prefix% <green>Modello dell''oggetto ripristinato'
  kinetic:
    description:
      - '<gradient:#A78BFA:gold><b>Imposta la proprietà cinetica dell''oggetto</b></gradient>'
      - '<white><sprite:items:item/iron_spear>'
      - '<gray><gold><b>Suggerimento</b></gold> Usa /itemkinetic o /iek'
    params: ''
  maxdurability:
    description:
      - '<gradient:#A78BFA:gold><b>Imposta la durabilità massima dell''oggetto</b></gradient>'
      - ''
      - '<gray><yellow><max durability> </yellow>nuovo valore di durabilità dell''oggetto,'
      - '<gray>  deve essere maggiore di 1'
    params: '<max durability>'
    feedback: '%prefix% <green>Durabilità massima aggiornata a <yellow>%value%'
  maxstacksize:
    description:
      - '<gradient:#A78BFA:gold><b>Imposta la dimensione massima dello stack</b></gradient>'
      - ''
      - '<gray><yellow>[1-99] </yellow>set the flag value'
      - ''
      - '<gray><yellow>no value </yellow>ripristina la dimensione standard dello stack, pari a <yellow>64'
      - '<gray> per la maggior parte degli oggetti, <yellow>1</yellow> per armature e strumenti; altri'
      - '<gray> valori si applicano ad alcuni oggetti'
    params: '[1-99]'
    feedback: '%prefix% <green>Dimensione massima dello stack aggiornata a <yellow>%value%'
    feedback-reset: '%prefix% <green>Dimensione massima dello stack ripristinata'
  pierce:
    description:
      - '<gradient:#A78BFA:gold><b>Imposta la proprietà perforante dell''oggetto</b></gradient>'
      - '<white><sprite:items:item/iron_spear>'
      - '<gold><b>Suggerimento</b></gold><gray> Usa /itempiercing o /iep'
    params: ''
  potioneffect:
    itemtag-tip: '%prefix% <gray>Vuoi aggiungere effetti delle pozioni agli oggetti comuni? Prova >ItemTag<'
    itemtag-tip-hover:
      - '<gradient:#A78BFA:gold>Clicca qui</gradient>'
    description:
      - '<gradient:#A78BFA:gold><b>Modifica gli effetti della pozione</b></gradient>'
      - '<white><sprite:items:item/potion> <sprite:items:item/suspicious_stew> <sprite:items:item/tipped_arrow_base>'
      - '<gray>Funziona con pozioni, frecce imbevute e stufati sospetti!'
      - '<gray><yellow>Add <effect> <duration> [level] </yellow><dark_gray>»</dark_gray> aggiunge un effetto'
      - '<gray><yellow>Remove <effect> </yellow><dark_gray>»</dark_gray> rimuove l''effetto selezionato'
      - '<gray><yellow>Reset </yellow><dark_gray>»</dark_gray> rimuove tutti gli effetti'
    params: '<add/remove/reset> [...]'
    add:
      params: '<effect> <duration> [level] [particles] [ambient] [icon]'
      description:
        - '<gradient:#A78BFA:gold><b>Aggiunge o sostituisce l''effetto selezionato</b></gradient>'
        - ''
        - '<gray><yellow><effect> </yellow>tipo di effetto'
