itemedit:
  amount:
    description:
      - '<gradient:#A78BFA:gold><b>Nustatyta suma</b></gradient>'
      - ''
      - '<gray><yellow><amount> </yellow>Nustatomas kiekis (iki 127)'
      - '<gold><b>Patarimas</b></gold> <gray> Neigiamos sumos atimamos'
      - '<gray> nuo prekės dabartinės sumos'
    params: '<amount>'
    feedback: '%prefix% <green>Elemento suma nustatyta į <yellow>%amount%'
    feedback-decrease: '%prefix% <green>Prekės suma sumažėjo <yellow>%amount%'
  attribute:
    description:
      - '<gradient:#A78BFA:gold><b>ERedaguoti atributų modifikatorius</b></gradient>'
      - ''
      - '<gray><yellow>Add <attribute> <amount> [operation] [slot] </yellow><dark_gray>»</dark_gray> pridėti naujus modifikatorius'
      - '<gray><yellow>Remove <attribute/slot> </yellow><dark_gray>»</dark_gray> pašalina kai kuriuos modifikatorius'
    params: '<add/remove> [...]'
    add:
      params: '<attribute> <amount> [operation] [slot]'
      description:
        - '<gradient:#A78BFA:gold><b>APridėti atributo modifikatorių</b></gradient>'
        - ''
        - '<gray><yellow><attribute> </yellow>atributo tipas'
        - '<gray><yellow><amount> </yellow>yra, kurią reikia nustatyti'
        - '<gray><yellow>[operation] </yellow>kaip pridedamas modifikatorius; pagal numatytuosius nustatymus reikšmės sumuojamos'
        - '<gray><yellow>[slot] </yellow>taikyti šį modifikatorių tik pasirinktam lizdui'
        - '<gray> įrangos lizdas arba bet koks įrangos lizdas, jei nepasirinktas'
      feedback: '%prefix% <green>Apridėtas modifikatorius'
    remove:
      params: '<attribute/slot>'
      description:
        - '<gradient:#A78BFA:gold><b>Pašalinti modifikatorius</b></gradient>'
        - ''
        - '<gray><yellow><attribute/slot> </yellow> tipas, kurį reikia pašalinti, bet kokie modifikatoriai su'
        - '<gray> pasirinkta reikšmė pašalinama'
      feedback-attribute: '%prefix% <green>Pašalinti atributo modifikatoriai'
      feedback-equipment: '%prefix% <green> Pašalinti įrangos lizdo modifikatoriai'
  axolotlvariant:
    description:
      - '<gradient:#A78BFA:gold><b>ERedaguoti Axolotl variantą ant Axolotl kaušo</b></gradient>'
      - '<white><sprite:items:item/axolotl_bucket>'
      - '<gray><yellow><type> </yellow> aksolotlo tipas'
    params: '<type>'
    feedback: '%prefix% <green> Pakeistas Axolotl variantas į <yellow>%variant%'
  banner:
    description:
      - '<gradient:#A78BFA:gold><b>Eredaguoti reklamjuostę</b></gradient>'
    params: '<add/set/remove/color> [...]'
    set:
      params: '<type> <color> <line>'
      description:
        - '<gradient:#A78BFA:gold><b>Pakeiskite šabloną pasirinktoje eilutėje</b></gradient>'
      feedback: '%prefix% <green>Raštų rinkinys'
    add:
      params: '<type> <color>'
      description:
        - '<gradient:#A78BFA:gold><b>APridėti šabloną</b></gradient>'
      feedback: '%prefix% <green>Raštas pridėtas'
    remove:
      params: '<line>'
      description:
        - '<gradient:#A78BFA:gold><b>Pašalinti šabloną pasirinktoje eilutėje</b></gradient>'
      feedback: '%prefix% <green>Raštas pašalintas'
    color:
      params: '<line> <color>'
      description:
        - '<gradient:#A78BFA:gold><b>Pakeiskite pasirinktos linijos rašto spalvą</b></gradient>'
      feedback: '%prefix% <green> Raštas pakeistas'
  bookauthor:
    description:
      - '<gradient:#A78BFA:gold><b>Rinkinio autorius</b></gradient>'
      - '<white><sprite:items:item/written_book>'
      - '<gray>Aautorio pavadinime gali būti tarpų ir jis taip pat gali būti spalvotas'
      - '<gray> Veikia tik su parašytomis knygomis'
    params: '<name>'
    feedback: '%prefix% <green>Atnaujintas knygos autorius'
    feedback-reset: '%prefix% <green> Iš naujo nustatyti knygos autorių'
  bookenchant:
    description:
      - '<gradient:#A78BFA:gold><b>Knygos užburiantis rinkinys</b></gradient>'
      - '<white><sprite:items:item/enchanted_book> <sprite:items:item/book>'
      - '<gray>Skirtumas tarp Enchant ir Bookenchant yra tas, kad'
      - '<gray> knyga su užburiančiu ugnies aspektu uždega pataikytus taikinius'
      - '<gray> nors knyga su „bookenchant“'
      - ''
      - '<gray><yellow><enchant> </yellow>enchant tipas'
      - '<gray><yellow>[level] </yellow>užkerėjimo lygis; pagal numatytuosius nustatymus <yellow>1'
      - ''
      - '<gold><b>Patarimas</b></gold> <gray>nustatykite <yellow>[level] </yellow> į <yellow>0 </yellow>, kad pašalintumėte užkeikimą'
    params: '<enchant> [level]'
    feedback-removed: '%prefix% <green>Pašalintas knygos žavesys <yellow>%enchant%'
    feedback: '%prefix% <green>A Taikomasis knygos užkeikimas <yellow>%enchant% <green>lv <yellow>%lv%'
  booktype:
    description:
      - '<gradient:#A78BFA:gold><b>Knygos tipo rinkinys</b></gradient>'
      - '<white><sprite:items:item/written_book>'
      - '<gray> Veikia tik su parašytomis knygomis'
    params: '<booktype>'
    feedback: '%prefix% <green> Atnaujinta knygų generacija į <yellow>%generation%'
    feedback-reset: '%prefix% <green> Iš naujo nustatyti knygų generavimą'
  color:
    description:
      - '<gradient:#A78BFA:gold><b>Nustatyti spalvą</b></gradient>'
      - '<white><sprite:items:item/potion> <sprite:items:item/tipped_arrow_base> <sprite:items:item/firework_star> <sprite:items:item/leather_chestplate>'
      - '<gray> Taip pat veikia su odiniais šarvais ir fejerverkų žvaigždėmis, gėrimais ir strėlėmis!'
      - '<gray><yellow>[raudona] [žalia] [mėlyna] </yellow> yra kiekvienos derinamos spalvos kiekis'
      - '<gray>E kiekviena spalva yra int reikšmė tarp 0 ir 255'
      - '<gray>Jei esate sutrikęs, google "<yellow>RGB spalvų rinkiklis</yellow>"'
    params: '[red] [green] [blue]'
    feedback: '%prefix% <green> Spalva atnaujinta'
  compass:
    description:
      - '<gradient:#A78BFA:gold><b>Nustatykite tikslinę kompaso vietą</b></gradient>'
      - '<white><sprite:items:item/compass_00>'
      - '<gray><yellow>Set </yellow><dark_gray>»</dark_gray> nustatykite savo vietą kaip kompaso tikslą'
      - '<gray><yellow>Clear </yellow><dark_gray>»</dark_gray> išvalyti kompaso tikslą'
    params: '<set/clear>'
    set:
      feedback: '%prefix% <green>Kompasas dabar nurodo <yellow>%world% %x% %y% %z%'
    clear:
      feedback: '%prefix% <green>Kompaso taikinys išvalytas'
  custommodeldata:
    description:
      - '<gradient:#A78BFA:gold><b>Eredaguoti pasirinktinio modelio duomenis</b></gradient>'
      - ''
      - '<gray>Naudojamas tekstūros paketams'
      - '<gray><yellow>[value] </yellow>teigiamas sveikasis skaičius tikslinio duomenų modelyje'
      - '<gray>Pastaba: šiuolaikiniai serveriai naudoja elemento modelį, o ne custommodeldata'
      - '<gray> tekstūroms, ši komanda skirta seniems klientams'
    params: '<value>'
    feedback: '%prefix% <green> Atnaujinti pasirinktinio modelio duomenys'
    feedback-reset: '%prefix% <green>Tinkinto modelio duomenų nustatymas iš naujo'
  damage:
    description:
      - '<gradient:#A78BFA:gold><b>ERedaguoti patvarumą</b></gradient>'
      - ''
      - '<gray><yellow><durability> </yellow> Pažeidimai'
      - '<gray><gold>N.B.</gold> <yellow>0 </yellow> reiškia, kad nėra pažeidimų, yra visiškas patvarumas'
    params: '<durability>'
    feedback-reset: '%prefix% <green> Atkurtas ilgaamžiškumas'
    feedback: '%prefix% <green> Patvarumas atnaujintas'
  equipment:
    description:
      - '<gradient:#A78BFA:gold><b>Rinkiniai Elemento įrangos savybė</b></gradient>'
      - ''
      - '<gray><gold><b>Patarimas</b></gold> Naudokite /itemequip arba /iee'
      - '<gray><gold>N.B.</gold> jūsų geriamųjų daiktų negalima valgyti'
    params: ''
  enchant:
    description:
      - '<gradient:#A78BFA:gold><b> Užburiančių rinkinių</b></gradient>'
      - ''
      - '<gray><yellow><enchant> </yellow>enchant tipas'
      - '<gray><yellow>[level] </yellow>užkerėjimo lygis; pagal numatytuosius nustatymus <yellow>1'
      - ''
      - '<gold><b>Patarimas</b></gold> <gray>nustatykite <yellow>[level] </yellow> į <yellow>0 </yellow>, kad pašalintumėte užkeikimą'
    params: '<enchant> [level]'
    feedback-removed: '%prefix% <green>Pašalintas žavesys <yellow>%enchant%'
    feedback: '%prefix% <green>A Taikomasis kerėjimas <yellow>%enchant% <green>lv <yellow>%lv%'
  fireresistent:
    description:
      - '<gradient:#A78BFA:gold><b>Nustatyti elemento atsparumą ugniai/lava</b></gradient>'
      - ''
      - '<gray><yellow>[true/false] </yellow>Nustatykite reikšmę, pagal numatytuosius nustatymus perjunkite'
      - ''
      - '<gray>A ugniai atsparus daiktas nebus sunaikintas'
      - '<gray> kris į ugnį ir plūduriuos virš lavos'
    params: '[true/false]'
    feedback: '%prefix% <green> Atsparumas ugniai nustatytas į <yellow>%value%'
  fireworkpower:
    description:
      - '<gradient:#A78BFA:gold><b>Nustatyti fejerverkų galią</b></gradient>'
      - '<white><sprite:items:item/firework_rocket>'
      - '<gray><yellow><power> </yellow> fejerverkų galia, vertė tarp <yellow>0 </yellow> ir <yellow>5'
    params: '<power>'
    feedback: '%prefix% <green> Atnaujinta fejerverkų galia'
  firework:
    description:
      - '<gradient:#A78BFA:gold><b>Eredaguokite fejerverkus naudodami GUI</b></gradient>'
      - '<white><sprite:items:item/firework_rocket>'
    params: ''
  food:
    description:
      - '<gradient:#A78BFA:gold><b>Nustato elemento maisto savybes</b></gradient>'
      - ''
      - '<gray><gold><b>Patarimas</b></gold> Naudokite /itemfood arba /if'
      - '<gray><gold>N.B.</gold> jūsų geriamųjų daiktų negalima valgyti'
    params: ''
  glider:
    description:
      - '<gradient:#A78BFA:gold><b>Nustatyti sklandytuvo būseną</b></gradient>'
      - ''
      - '<gray> Sklandytuvo elementas turėtų leisti sklandyti kaip ant elytros'
      - '<gray><yellow>[true/false] </yellow>nustatyti sklandytuvo vertę, pagal numatytuosius nustatymus perjungti'
    params: '[true/false]'
    feedback: '%prefix% <green> Atnaujintas sklandymo rinkinys į <yellow>%value%'
  glow:
    description:
      - '<gradient:#A78BFA:gold><b>Nepaisyti žavingo švytėjimo efekto</b></gradient>'
      - ''
      - '<gray><yellow>[true/false] </yellow>Nustatykite reikšmę, pagal numatytuosius nustatymus iš naujo'
      - ''
      - '<gold><b>Patarimas</b></gold> <gray><yellow> nenurodyta vertė </yellow>Atkurti vanilės elgseną'
    params: '[true/false/default]'
    feedback: '%prefix% <green> Švytėjimas nustatytas į <yellow>%value%'
    feedback-reset: '%prefix% <green>Atkurti numatytąją švytėjimo vertę'
  goathornsound:
    description:
      - '<gradient:#A78BFA:gold><b>Nustatyti ožkos rago garsą</b></gradient>'
      - '<white><sprite:items:item/goat_horn>'
      - '<gray><yellow><type> </yellow> garso tipas'
    params: '<type>'
    feedback: '%prefix% <green>Atnaujintas garsas'
  hide:
    description:
      - '<gradient:#A78BFA:gold><b>Slėpti arba rodyti komponentus</b></gradient>'
      - ''
      - '<gray><yellow><flag> </yellow> Redaguotino elemento žyma'
      - '<gray><yellow>[true/false] </yellow>nustatyti vėliavėlės reikšmę, pagal numatytuosius nustatymus perjungti'
      - ''
      - '<gold><b>Patarimas</b></gold> <gray> Slėpti reklamjuosčių skydelius su potion_effects vėliava'
      - '<gold><b>Patarimas</b></gold> <gray>vienu kartu paslėpkite visus indikatorius naudodami <yellow>/itemedit hideall'
    params: '<flag> [true/false]'
    feedback: '%prefix% <green>Vėliava dabar yra <yellow>%value%'
  hidetooltip:
    description:
      - '<gradient:#A78BFA:gold><b>Slėpti arba rodyti patarimus</b></gradient>'
      - ''
      - '<gray><yellow>[true/false] </yellow>nustatyti vėliavėlės reikšmę, pagal numatytuosius nustatymus perjungti'
    params: '[true/false]'
    feedback: '%prefix% <green>Paslėpto patarimo būsena dabar yra <yellow>%value%'
  hideall:
    description:
      - '<gradient:#A78BFA:gold><b>Paslėpti visus komponentus</b></gradient>'
      - ''
      - '<gray>Slepia: užburia, gėrimo efektus, reklamjuosčių sluoksnius, atributus...'
      - ''
      - '<gold><b>Patarimas</b></gold> <gray> Paslėpkite atskirus komponentus naudodami <yellow>/itemedit hide <flag> true'
    params: ''
    feedback: '%prefix% <green>Paslėptos visos vėliavėlės'
  itemmodel:
    description:
      - '<gradient:#A78BFA:gold><b>ERedaguoti prekės modelį</b></gradient>'
      - ''
      - '<gray><yellow><namespaced key> </yellow> klavišas, skirtas nustatyti tekstūros nuorodai'
      - '<gray>pavyzdys: /ie itemmodel <yellow>iron_sword'
      - '<gray>pavyzdys: /ie itemmodel <yellow>minecraft:iron_sword'
      - ''
      - '<gray><yellow><namespace></yellow>:<yellow><id></yellow> nurodys modelį:'
      - '/assets / <yellow><namespace></yellow>/models/item / <yellow><id>'
    params: '<namespaced key>'
    feedback: '%prefix% <green>Atnaujintas prekės modelis'
    feedback-reset: '%prefix% <green> Iš naujo nustatyti elemento modelį'
  kinetic:
    description:
      - '<gradient:#A78BFA:gold><b>Nustato elemento kinetinę savybę</b></gradient>'
      - '<white><sprite:items:item/iron_spear>'
      - '<gray><gold><b>Patarimas</b></gold> Naudokite /itemkinetic arba /iek'
    params: ''
  maxdurability:
    description:
      - '<gradient:#A78BFA:gold><b>Rinktinių elementų didžiausias patvarumas</b></gradient>'
      - ''
      - '<gray><yellow><max durability> </yellow>naujas daikto patvarumo dydis,'
      - '<gray> turi būti didesnis nei 1'
    params: '<max durability>'
    feedback: '%prefix% <green> Atnaujintas Maksimalus patvarumas iki <yellow>%value%'
