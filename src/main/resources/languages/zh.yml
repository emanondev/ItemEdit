generic:
  help:
    player-only: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <red>仅限玩家命令'
    no-item-on-hand: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <red>你需要手里拿着一个物品'
    lack-permission: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <red>您没有权限%permission%'
    lack-permission-generic: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <red>您没有权限使用此命令'
    blocked-by-censure: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <red>您不能使用此文本，它包含被阻止的单词'
    blocked-by-type-restriction: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <red>您无法重命名该物品'
    blocked-by-type-restriction-lore: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <red>您无法编辑该商品的商品描述'
    blocked-by-lore-line-limit: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <red>您无法在此物品上添加更多物品描述行'
    blocked-by-lore-length-limit: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <red>设置的行长度不能超过 %limit% 个字符'
    blocked-by-rename-length-limit: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <red>您设置的名称不能超过 %limit% 个字符'

    prefix: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray>'
    header-format: '<gradient:#54acff:#A78BFA><bold>%header%</bold></gradient> <dark_gray>»</dark_gray> <#A78BFA><bold>帮助</bold></#A78BFA>'
    header-sub-format: '<gradient:#54acff:#A78BFA><bold>%header%</bold></gradient> <dark_gray>»</dark_gray> <gradient:#A78BFA:#54acff><bold>%sub%</bold></gradient> <dark_gray>»</dark_gray> <#55d6ff><bold>帮助</#55d6ff>'
    command-format: '<gray>/%command%</gray> <#bad1ff>%sub%</#bad1ff> <#d7bbff>%params%</#d7bbff>'
    footer-format: '%prev_clickable% <#7E9CFD><b>帮助</b> [%page%/%max_page%]</#7E9CFD> %next_clickable%'
    next_text: ' <light_purple><b>><st>> ></st> '
    prev_text: ' <light_purple><b><st>< <</st>< '
    next_void: ' <dark_gray><b>><st>> ></st> '
    prev_void: ' <dark_gray><b><st>< <</st>< '
    next_hover: '<gold><b>转到第%target%页'
    prev_hover: '<gold><b>转到第%target%页'
  wrong-material:
    axolotl_bucket: '%prefix% <red>物品必须是蝾螈桶'
    banner: '%prefix% <red>商品必须是横幅'
    damageable: '%prefix% <red>物品必须像工具和盔甲一样具有耐用性'
    player_head: '%prefix% <red>物品必须是玩家头像'
    rgb_colorable: '%prefix% <red>物品必须是可着色类型，如皮甲、烟花星星、药水或具有药水效果的箭头'
    written_book: '%prefix% <red>物品必须是书面书籍'
    potion_effect_applicable: '%prefix% <red>物品必须是药水或具有药水效果的箭或谜之炖菜'
    firework: '%prefix% <red>物品必须是烟花'
    spawner_egg: '%prefix% <red>物品必须是刷怪蛋'
    tropical_fish_bucket: '%prefix% <red>物品必须是热带鱼桶'
    writable_book: '%prefix% <red>物品必须是书面书籍或书籍和羽毛笔'
    compass: '%prefix% <red>物品必须是指南针'
    music_instrument: '%prefix% <red>物品必须是山羊角'
    armor: '%prefix% <red>物品必须是盔甲'
    enchantment_storage: '%prefix% <red>物品必须是书或附魔书'
  wrong-alias:
    axolotl_variant: '%prefix% <red>蝾螈价值错误！ <dark_red>[<gold>悬停在此处<dark_red>]'
    potion_effect: '%prefix% <red>效果值错误！ <dark_red>[<gold>悬停在此处<dark_red>]'
    animations: '%prefix% <red>动画值错误！ <dark_red>[<gold>悬停在此处<dark_red>]'
    sound: '%prefix% <red>声音值错误！ <dark_red>[<gold>悬停在此处<dark_red>]'
    enchant: '%prefix% <red>附魔值错误！ <dark_red>[<gold>悬停在此处<dark_red>]'
    flag_type: '%prefix% <red>错误的标志值！ <dark_red>[<gold>悬停在此处<dark_red>]'
    book_type: '%prefix% <red>书籍类型值错误！ <dark_red>[<gold>悬停在此处<dark_red>]'
    equip_slot: '%prefix% <red>装备栏值错误！ <dark_red>[<gold>悬停在此处<dark_red>]'
    banner_pattern: '%prefix% <red>图案值错误！ <dark_red>[<gold>悬停在此处<dark_red>]'
    color: '%prefix% <red>颜色值错误！ <dark_red>[<gold>悬停在此处<dark_red>]'
    mob_type: '%prefix% <red>鸡蛋类型值错误！ <dark_red>[<gold>悬停在此处<dark_red>]'
    trim_material: '%prefix% <red>装甲装饰材质值错误！ <dark_red>[<gold>悬停在此处<dark_red>]'
    tropical_fish_pattern: '%prefix% <red>图案值错误！ <dark_red>[<gold>悬停在此处<dark_red>]'
    trim_pattern: '%prefix% <red>错误的装甲装饰图案值！ <dark_red>[<gold>悬停在此处<dark_red>]'
    boolean: '%prefix% <red>布尔值错误！ <dark_red>[<gold>悬停在此处<dark_red>]'
    attribute: '%prefix% <red>属性值错误！ <dark_red>[<gold>悬停在此处<dark_red>]'
    operation: '%prefix% <red>运算值错误！ <dark_red>[<gold>悬停在此处<dark_red>]'
    itemrarity: '%prefix% <red>稀有度值错误！ <dark_red>[<gold>悬停在此处<dark_red>]'
    entitytype: '%prefix% <red>实体类型值错误！ <dark_red>[<gold>悬停在此处<dark_red>]'
    entitygroups: '%prefix% <red>实体组值错误！ <dark_red>[<gold>悬停在此处<dark_red>]'
    consumable_effect: '%prefix% <red>消耗品效果值错误！ <dark_red>[<gold>悬停在此处<dark_red>]'
    goat_horn_sound: '%prefix% <red>羊角声音值错误！ <dark_red>[<gold>悬停在此处<dark_red>]'
    error-pre-hover: '<gradient:#A78BFA:gold><b>别名：</b></gradient>'
    first_color: '<aqua>'
    second_color: '<yellow>'
itemedit:
  amount:
    description:
      - '<gradient:#A78BFA:gold><b>设定金额</b></gradient>'
      - ''
      - '<gray><yellow><amount> </yellow>设定数量（最多127个）'
      - '<gold><b>提示</b></gold> <gray>减去负数'
      - '<gray> 来自物品当前金额'
    params: '<amount>'
    feedback: '%prefix% <green>物品数量设置为<yellow>%amount%'
    feedback-decrease: '%prefix% <green>物品数量减少<yellow>%amount%'
  attribute:
    description:
      - '<gradient:#A78BFA:gold><b>编辑属性修饰符</b></gradient>'
      - ''
      - '<gray><yellow>Add <attribute> <amount> [operation] [slot] </yellow><dark_gray>»</dark_gray>添加新修饰符'
      - '<gray><yellow>Remove <attribute/slot> </yellow><dark_gray>»</dark_gray> 删除一些修饰符'
    params: '<add/remove> [...]'
    add:
      params: '<attribute> <amount> [operation] [slot]'
      description:
        - '<gradient:#A78BFA:gold><b>添加属性修饰符</b></gradient>'
        - ''
        - '<gray><yellow><attribute> </yellow>属性类型'
        - '<gray><yellow><amount> </yellow>设定数量'
        - '<gray><yellow>[operation] </yellow>如何添加修饰符，默认求和'
        - '<gray><yellow>[slot] </yellow>仅当物品处于选中状态时应用此修饰符'
        - '<gray> 设备槽位或任意设备槽位（如果未选择）'
      feedback: '%prefix% <green>添加修改器'
    remove:
      params: '<attribute/slot>'
      description:
        - '<gradient:#A78BFA:gold><b>删除修饰符</b></gradient>'
        - ''
        - '<gray><yellow><attribute/slot> </yellow>要删除的类型，任何带有的修饰符'
        - '<gray> 所选值被删除'
      feedback-attribute: '%prefix% <green>删除属性修饰符'
      feedback-equipment: '%prefix% <green>删除了装备槽的修饰语'
  axolotlvariant:
    description:
      - '<gradient:#A78BFA:gold><b>在蝾螈桶上编辑蝾螈变体</b></gradient>'
      - '<white><sprite:items:item/axolotl_bucket>'
      - '<gray><yellow><type> </yellow>蝾螈的种类'
    params: '<type>'
    feedback: '%prefix% <green>将蝾螈变种更改为<yellow>%variant%'
  banner:
    description:
      - '<gradient:#A78BFA:gold><b>编辑横幅</b></gradient>'
    params: '<add/set/remove/color> [...]'
    set:
      params: '<type> <color> <line>'
      description:
        - '<gradient:#A78BFA:gold><b>替换所选行上的图案</b></gradient>'
      feedback: '%prefix% <green>图案组'
    add:
      params: '<type> <color>'
      description:
        - '<gradient:#A78BFA:gold><b>添加图案</b></gradient>'
      feedback: '%prefix% <green>添加图案'
    remove:
      params: '<line>'
      description:
        - '<gradient:#A78BFA:gold><b>删除所选行上的图案</b></gradient>'
      feedback: '%prefix% <green>图案已移除'
    color:
      params: '<line> <color>'
      description:
        - '<gradient:#A78BFA:gold><b>更改所选行上的图案颜色</b></gradient>'
      feedback: '%prefix% <green>图案重新着色'
  bookauthor:
    description:
      - '<gradient:#A78BFA:gold><b>设置作者</b></gradient>'
      - '<white><sprite:items:item/written_book>'
      - '<gray>作者姓名可能包含空格并且也可能带有颜色'
      - '<gray>仅适用于书面书籍'
    params: '<name>'
    feedback: '%prefix% <green>更新书籍作者'
    feedback-reset: '%prefix% <green>重置书籍作者'
  bookenchant:
    description:
      - '<gradient:#A78BFA:gold><b>在书本上设置魔咒</b></gradient>'
      - '<white><sprite:items:item/enchanted_book> <sprite:items:item/book>'
      - '<gray>enchant和bookenchant的区别在于'
      - '<gray>一本具有enchant火属性的书在击中时会使目标着火'
      - '<gray>而一本带有bookenchant的书则没有'
      - ''
      - '<gray><yellow><enchant> </yellow>结界类型'
      - '<gray><yellow>[level] </yellow>附魔等级，默认<yellow>1'
      - ''
      - '<gold><b>提示</b></gold> <gray>将<yellow>[level] </yellow>设置为<yellow>0</yellow>以移除附魔'
    params: '<enchant> [level]'
    feedback-removed: '%prefix% <green>移除书籍附魔<yellow>%enchant%'
    feedback: '%prefix% <green>应用书籍附魔<yellow>%enchant% <green>lv<yellow>%lv%'
  booktype:
    description:
      - '<gradient:#A78BFA:gold><b>设置书籍类型</b></gradient>'
      - '<white><sprite:items:item/written_book>'
      - '<gray>仅适用于书面书籍'
    params: '<booktype>'
    feedback: '%prefix% <green>将书籍生成更新为<yellow>%generation%'
    feedback-reset: '%prefix% <green>重置书籍生成'
  color:
    description:
      - '<gradient:#A78BFA:gold><b>设置颜色</b></gradient>'
      - '<white><sprite:items:item/potion> <sprite:items:item/tipped_arrow_base> <sprite:items:item/firework_star> <sprite:items:item/leather_chestplate>'
      - '<gray>也适用于皮甲和烟火星星、药水和具有药水效果的箭！'
      - '<gray><yellow>[red] [green] [blue] </yellow>是每种颜色要组合的数量'
      - '<gray>每种颜色都是 0 到 255 之间的 int 值'
      - '<gray>如果你感到困惑谷歌“<yellow>RGB颜色选择器</yellow>”'
    params: '[red] [green] [blue]'
    feedback: '%prefix% <green>颜色已更新'
  compass:
    description:
      - '<gradient:#A78BFA:gold><b>设置罗盘目标位置</b></gradient>'
      - '<white><sprite:items:item/compass_00>'
      - '<gray><yellow>Set </yellow><dark_gray>»</dark_gray> 将您的位置设置为罗盘目标'
      - '<gray><yellow>Clear </yellow><dark_gray>»</dark_gray> 清晰指南针目标'
    params: '<set/clear>'
    set:
      feedback: '%prefix% <green>罗盘现在指向<yellow>%world% %x% %y% %z%'
    clear:
      feedback: '%prefix% <green>罗盘目标已清除'
  custommodeldata:
    description:
      - '<gradient:#A78BFA:gold><b>编辑自定义模型数据</b></gradient>'
      - ''
      - '<gray>用于材质包'
      - '<gray><yellow>[value] </yellow>目标数据模型的正整数'
      - '<gray>注意：现代服务器使用itemmodel而不是custommodeldata'
      - '<gray> 对于纹理，此命令适用于旧版客户端'
    params: '<value>'
    feedback: '%prefix% <green>更新自定义模型数据'
    feedback-reset: '%prefix% <green>自定义模型数据重置'
  damage:
    description:
      - '<gradient:#A78BFA:gold><b>编辑耐久度</b></gradient>'
      - ''
      - '<gray><yellow><durability> </yellow>适用伤害'
      - '<gray><gold>N.B.</gold> <yellow>0 </yellow>表示无损坏，完全耐久'
    params: '<durability>'
    feedback-reset: '%prefix% <green>恢复耐久度'
    feedback: '%prefix% <green>耐久性更新'
  equipment:
    description:
      - '<gradient:#A78BFA:gold><b>设置物品的装备属性</b></gradient>'
      - ''
      - '<gray><gold><b>提示</b></gold>使用/itemequip or /iee'
      - '<gray><gold>NB.</gold> 您的饮用水不能食用'
    params: ''
  enchant:
    description:
      - '<gradient:#A78BFA:gold><b>设置魔咒</b></gradient>'
      - ''
      - '<gray><yellow><enchant> </yellow>结界类型'
      - '<gray><yellow>[level] </yellow>附魔等级，默认<yellow>1'
      - ''
      - '<gold><b>提示</b></gold> <gray>将<yellow>[level] </yellow>设置为<yellow>0</yellow>以移除附魔'
    params: '<enchant> [level]'
    feedback-removed: '%prefix% <green>移除附魔<yellow>%enchant%'
    feedback: '%prefix% <green>已应用附魔<yellow>%enchant% <green>lv<yellow>%lv%'
  fireresistent:
    description:
      - '<gradient:#A78BFA:gold><b>设置物品对火/熔岩的抵抗力</b></gradient>'
      - ''
      - '<gray><yellow>[true/false] </yellow>设置值，默认切换'
      - ''
      - '<gray>具有耐火性的物品不会被摧毁'
      - '<gray> 落入火中时会漂浮在熔岩上'
    params: '[true/false]'
    feedback: '%prefix% <green>防火设置为<yellow>%value%'
  fireworkpower:
    description:
      - '<gradient:#A78BFA:gold><b>设置烟花威力</b></gradient>'
      - '<white><sprite:items:item/firework_rocket>'
      - '<gray><yellow><power> </yellow>烟花威力，介于<yellow>0 </yellow>和<yellow>5之间的值'
    params: '<power>'
    feedback: '%prefix% <green>更新烟火威力'
  firework:
    description:
      - '<gradient:#A78BFA:gold><b>使用 GUI 编辑烟花</b></gradient>'
      - '<white><sprite:items:item/firework_rocket>'
    params: ''
  food:
    description:
      - '<gradient:#A78BFA:gold><b>设置物品的食物属性</b></gradient>'
      - ''
      - '<gray><gold><b>提示</b></gold>使用/itemfood or /if'
      - '<gray><gold>NB.</gold> 您的饮用水不能食用'
    params: ''
  glider:
    description:
      - '<gradient:#A78BFA:gold><b>设置滑翔机状态</b></gradient>'
      - ''
      - '<gray>滑翔机物品应该允许像鞘翅一样滑翔'
      - '<gray><yellow>[true/false] </yellow>设置滑翔机值，默认切换'
    params: '[true/false]'
    feedback: '%prefix% <green>更新滑翔设置为<yellow>%value%'
  glow:
    description:
      - '<gradient:#A78BFA:gold><b>覆盖附魔发光效果</b></gradient>'
      - ''
      - '<gray><yellow>[true/false] </yellow>设置值，默认重置'
      - ''
      - '<gold><b>提示</b></gold> <gray><yellow>未指定值</yellow>恢复原版行为'
    params: '[true/false/default]'
    feedback: '%prefix% <green>发光设置为 <yellow>%value%'
    feedback-reset: '%prefix% <green>将发光值重置为默认值'
  goathornsound:
    description:
      - '<gradient:#A78BFA:gold><b>设置山羊角声音</b></gradient>'
      - '<white><sprite:items:item/goat_horn>'
      - '<gray><yellow><type> </yellow>声音类型'
    params: '<type>'
    feedback: '%prefix% <green>更新声音'
  hide:
    description:
      - '<gradient:#A78BFA:gold><b>隐藏或显示组件</b></gradient>'
      - ''
      - '<gray><yellow><flag> </yellow>要编辑的物品标志'
      - '<gray><yellow>[true/false] </yellow>设置flag值，默认切换'
      - ''
      - '<gold><b>提示</b></gold> <gray>隐藏带有potion_effects标志的横幅图案'
      - '<gold><b>提示</b></gold> <gray>使用<yellow>/itemedit hideall一次隐藏所有标志'
    params: '<flag> [true/false]'
    feedback: '%prefix% <green>标志现在是<yellow>%value%'
  hidetooltip:
    description:
      - '<gradient:#A78BFA:gold><b>隐藏或显示工具提示</b></gradient>'
      - ''
      - '<gray><yellow>[true/false] </yellow>设置flag值，默认切换'
    params: '[true/false]'
    feedback: '%prefix% <green>工具提示隐藏状态现在为<yellow>%value%'
  hideall:
    description:
      - '<gradient:#A78BFA:gold><b>隐藏所有组件</b></gradient>'
      - ''
      - '<gray>隐藏：附魔、药水效果、横幅层、属性......'
      - ''
      - '<gold><b>提示</b></gold> <gray>使用<yellow>/itemedit hide <flag> true隐藏单个组件'
    params: ''
    feedback: '%prefix% <green>隐藏所有标志'
  itemmodel:
    description:
      - '<gradient:#A78BFA:gold><b>编辑物品模型</b></gradient>'
      - ''
      - '<gray><yellow><namespaced key> </yellow>设置纹理参考的键'
      - '<gray>示例：/ie itemmodel <yellow>iron_sword'
      - '<gray>示例：/ie itemmodel <yellow>minecraft:iron_sword'
      - ''
      - '<gray><yellow><namespace></yellow>:<yellow><id></yellow> 将参考模型：'
      - '  /assets/<yellow><namespace></yellow>/models/item/<yellow><id>'
    params: '<namespaced key>'
    feedback: '%prefix% <green>更新了物品模型'
    feedback-reset: '%prefix% <green>重置物品模型'
  kinetic:
    description:
      - '<gradient:#A78BFA:gold><b>设置物品的动能属性</b></gradient>'
      - '<white><sprite:items:item/iron_spear>'
      - '<gray><gold><b>提示</b></gold>使用/itemkinetic or /iek'
    params: ''
  maxdurability:
    description:
      - '<gradient:#A78BFA:gold><b>设置物品最大耐久度</b></gradient>'
      - ''
      - '<gray><yellow><max durability> </yellow>物品新的耐久值，'
      - '<gray> 必须大于 1'
    params: '<max durability>'
    feedback: '%prefix% <green>更新最大耐久度至<yellow>%value%'
  maxstacksize:
    description:
      - '<gradient:#A78BFA:gold><b>设置物品最大堆叠大小</b></gradient>'
      - ''
      - '<gray><yellow>[1-99] </yellow>设置标志值'
      - ''
      - '<gray><yellow>无值</yellow>将恢复公共堆栈大小，即<yellow>64'
      - '<gray>适用于大多数物品，<yellow>1</yellow>适用于盔甲和工具，以及其他'
      - '<gray> 一些物品的值'
    params: '[1-99]'
    feedback: '%prefix% <green>将最大堆栈大小更新为<yellow>%value%'
    feedback-reset: '%prefix% <green>重置最大堆栈大小'
  pierce:
    description:
      - '<gradient:#A78BFA:gold><b>设置物品的穿刺武器属性</b></gradient>'
      - '<white><sprite:items:item/iron_spear>'
      - '<gold><b>提示</b></gold><gray>使用/itempiercing or /iep'
    params: ''
  potioneffect:
    itemtag-tip: '%prefix% <gray>您需要为普通物品添加药水效果吗？尝试>ItemTag<'
    itemtag-tip-hover:
      - '<gradient:#A78BFA:gold>点我</gradient>'
    description:
      - '<gradient:#A78BFA:gold><b>编辑药水效果</b></gradient>'
      - '<white><sprite:items:item/potion> <sprite:items:item/suspicious_stew> <sprite:items:item/tipped_arrow_base>'
