    header-sub-format: '<gradient:#54acff:#A78BFA><bold>%header%</bold></gradient> <dark_gray>»</dark_gray> <gradient:#A78BFA:#54acff><bold>%sub%</bold></gradient> <dark_gray>»</dark_gray> <#55d6ff><bold>Pomoc</#55d6ff>'
    command-format: '<gray>/%command%</gray> <#bad1ff>%sub%</#bad1ff> <#d7bbff>%params%</#d7bbff>'
    footer-format: '%prev_clickable% <#7E9CFD><b>Pomoc</b> [%page%/%max_page%]</#7E9CFD> %next_clickable%'
