    book_type: '%prefix% <red>Zła wartość typu książki! <dark_red>[<gold>najedź tutaj<dark_red>]'
    equip_slot: '%prefix% <red>Zła wartość miejsca na sprzęt! <dark_red>[<gold>najedź tutaj<dark_red>]'
    banner_pattern: '%prefix% <red>Zła wartość wzorca! <dark_red>[<gold>najedź tutaj<dark_red>]'
    color: '%prefix% <red>Zła wartość koloru! <dark_red>[<gold>najedź tutaj<dark_red>]'
    mob_type: '%prefix% <red>Zła wartość typu jajka! <dark_red>[<gold>najedź tutaj<dark_red>]'
    trim_material: '%prefix% <red>Złe wykończenie pancerza Wartość materiału! <dark_red>[<gold>najedź tutaj<dark_red>]'
    tropical_fish_pattern: '%prefix% <red>Zła wartość wzorca! <dark_red>[<gold>najedź tutaj<dark_red>]'
