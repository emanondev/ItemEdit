itemedit:
  amount:
    description:
      - '<gradient:#A78BFA:gold><b>Ustaw kwotę</b></gradient>'
      - ''
      - '<gray><yellow><amount> </yellow>ilość do ustawienia (do 127)'
      - '<gold><b>Wskazówka</b></gold> <gray>Kwoty ujemne są odejmowane'
      - '<gray> od aktualnej kwoty przedmiotu'
    params: '<amount>'
    feedback: '%prefix% <green>Ilość przedmiotu ustawiona na <yellow>%amount%'
    feedback-decrease: '%prefix% <green>Kwota przedmiotu zmniejszona o <yellow>%amount%'
  attribute:
    description:
      - '<gradient:#A78BFA:gold><b>Edytuj modyfikatory atrybutów</b></gradient>'
      - ''
      - '<gray><yellow>Add <attribute> <amount> [operation] [slot] </yellow><dark_gray>»</dark_gray> dodaj nowe modyfikatory'
      - '<gray><yellow>Remove <attribute/slot> </yellow><dark_gray>»</dark_gray> usuwa niektóre modyfikatory'
    params: '<add/remove> [...]'
    add:
      params: '<attribute> <amount> [operation] [slot]'
      description:
        - '<gradient:#A78BFA:gold><b>Dodaj modyfikator atrybutu</b></gradient>'
        - ''
        - '<gray><yellow><attribute> </yellow>typ atrybutu'
        - '<gray><yellow><amount> </yellow>kwota do ustawienia'
        - '<gray><yellow>[operation] </yellow>jak dodawany jest modyfikator, domyślnie sumy'
        - '<gray><yellow>[slot] </yellow>zastosuj ten modyfikator tylko wtedy, gdy element jest wybrany'
        - '<gray> miejsce na wyposażenie lub dowolne miejsce na wyposażenie, jeśli nie zostało wybrane'
      feedback: '%prefix% <green>Dodano modyfikator'
    remove:
      params: '<attribute/slot>'
      description:
        - '<gradient:#A78BFA:gold><b>Usuń modyfikatory</b></gradient>'
        - ''
        - '<gray><yellow><attribute/slot> </yellow>wpisz, aby usunąć, wszelkie modyfikatory'
        - '<gray> wybrane wartości zostaną usunięte'
      feedback-attribute: '%prefix% <green>Usunięto modyfikatory atrybutów'
      feedback-equipment: '%prefix% <green>Usunięto modyfikatory miejsca na wyposażenie'
  axolotlvariant:
    description:
      - '<gradient:#A78BFA:gold><b>Edytuj wariant aksolotla na wiadrze aksolotla</b></gradient>'
      - '<white><sprite:items:item/axolotl_bucket>'
      - '<gray><yellow><type> </yellow>rodzaj aksolotla'
    params: '<type>'
    feedback: '%prefix% <green>Zmieniono wariant Aksolotla na <yellow>%variant%'
  banner:
    description:
      - '<gradient:#A78BFA:gold><b>Edytuj baner</b></gradient>'
    params: '<add/set/remove/color> [...]'
    set:
      params: '<type> <color> <line>'
      description:
        - '<gradient:#A78BFA:gold><b>Zastąp wzór na wybranej linii</b></gradient>'
      feedback: '%prefix% <green>Zestaw wzorów'
    add:
      params: '<type> <color>'
      description:
        - '<gradient:#A78BFA:gold><b>Dodaj wzór</b></gradient>'
      feedback: '%prefix% <green>Dodano wzór'
    remove:
      params: '<line>'
      description:
        - '<gradient:#A78BFA:gold><b>Usuń wzór z wybranej linii</b></gradient>'
      feedback: '%prefix% <green>Wzór usunięty'
    color:
      params: '<line> <color>'
      description:
        - '<gradient:#A78BFA:gold><b>Zmień kolor wzoru na wybranej linii</b></gradient>'
      feedback: '%prefix% <green>Zmieniono kolor wzoru'
  bookauthor:
    description:
      - '<gradient:#A78BFA:gold><b>Ustaw autora</b></gradient>'
      - '<white><sprite:items:item/written_book>'
      - '<gray>Nazwa autora może zawierać spacje i być pokolorowana'
      - '<gray>Działa tylko na książkach pisanych'
    params: '<name>'
    feedback: '%prefix% <green>Zaktualizowano autora książki'
    feedback-reset: '%prefix% <green>Zresetuj autora książki'
  bookenchant:
    description:
      - '<gradient:#A78BFA:gold><b>Ustaw zaklęcia na księdze</b></gradient>'
      - '<white><sprite:items:item/enchanted_book> <sprite:items:item/book>'
      - '<gray>Różnica między enchant a bookenchant polega na tym, że'
      - '<gray>księga z aspektem ognia enchant podpala cele po trafieniu'
      - '<gray>podczas gdy książka z bookenchant nie'
      - ''
      - '<gray><yellow><enchant> </yellow>rodzaj zaklęcia'
      - '<gray><yellow>[level] </yellow>poziom zaklęcia, domyślnie <yellow>1'
      - ''
      - '<gold><b>Wskazówka</b></gold> <gray>Ustaw <yellow>[level] </yellow>na <yellow>0 </yellow>aby usunąć zaklęcie'
    params: '<enchant> [level]'
    feedback-removed: '%prefix% <green>Usunięto zaklęcie księgi <yellow>%enchant%'
    feedback: '%prefix% <green>Zastosowane zaklęcie książki <yellow>%enchant% <green>lv <yellow>%lv%'
  booktype:
    description:
      - '<gradient:#A78BFA:gold><b>Ustaw typ książki</b></gradient>'
      - '<white><sprite:items:item/written_book>'
      - '<gray>Działa tylko na książkach pisanych'
    params: '<booktype>'
    feedback: '%prefix% <green>Zaktualizowano generowanie książek do <yellow>%generation%'
    feedback-reset: '%prefix% <green>Zresetuj generowanie książek'
  color:
    description:
      - '<gradient:#A78BFA:gold><b>Ustaw kolor</b></gradient>'
      - '<white><sprite:items:item/potion> <sprite:items:item/tipped_arrow_base> <sprite:items:item/firework_star> <sprite:items:item/leather_chestplate>'
      - '<gray>Działa na skórzanej zbroi i gwiazdach fajerwerków, miksturach i strzałach z efektami mikstur!'
      - '<gray><yellow>[red] [green] [blue] </yellow>to ilość każdego koloru do połączenia'
      - '<gray>Każdy kolor jest wartością typu int z zakresu od 0 do 255'
      - '<gray>Jeśli jesteś zdezorientowany, wpisz w Google „<yellow>Selektor kolorów RGB</yellow>”'
    params: '[red] [green] [blue]'
    feedback: '%prefix% <green>Zaktualizowano kolor'
  compass:
    description:
      - '<gradient:#A78BFA:gold><b>Ustaw lokalizację docelową kompasu</b></gradient>'
      - '<white><sprite:items:item/compass_00>'
      - '<gray><yellow>Set </yellow><dark_gray>»</dark_gray> ustaw swoją lokalizację jako cel kompasu'
      - '<gray><yellow>Clear </yellow><dark_gray>»</dark_gray> wyczyść cel kompasu'
    params: '<set/clear>'
    set:
      feedback: '%prefix% <green>Kompas wskazuje teraz <yellow>%world% %x% %y% %z%'
    clear:
      feedback: '%prefix% <green> Cel kompasu wyczyszczony'
  custommodeldata:
    description:
      - '<gradient:#A78BFA:gold><b>Edytuj dane modelu niestandardowego</b></gradient>'
      - ''
      - '<gray>Używany w pakietach tekstur'
      - '<gray><yellow>[value] </yellow>dodatni int docelowego modelu danych'
      - '<gray>Uwaga: nowoczesne serwery używają itemmodel zamiast custommodeldata'
      - '<gray> dla tekstur, to polecenie jest przeznaczone dla starszych klientów'
    params: '<value>'
    feedback: '%prefix% <green>Zaktualizowano dane modelu niestandardowego'
    feedback-reset: '%prefix% <green>Reset danych modelu niestandardowego'
  damage:
    description:
      - '<gradient:#A78BFA:gold><b>Edytuj trwałość</b></gradient>'
      - ''
      - '<gray><yellow><durability> </yellow>obrażenia do zastosowania'
      - '<gray><gold>N.B.</gold> <yellow>0 </yellow>oznacza brak uszkodzeń, pełną trwałość'
    params: '<durability>'
    feedback-reset: '%prefix% <green>Przywrócono trwałość'
    feedback: '%prefix% <green>Zaktualizowano trwałość'
  equipment:
    description:
      - '<gradient:#A78BFA:gold><b>Ustawia właściwość wyposażenia przedmiotu</b></gradient>'
      - ''
      - '<gray><gold><b>Wskazówka</b></gold> Użyj /itemequip or /iee'
      - '<gray><gold>N.B.</gold> twoich napojów nie można jeść'
    params: ''
  enchant:
    description:
      - '<gradient:#A78BFA:gold><b>Ustaw zaklęcia</b></gradient>'
      - ''
      - '<gray><yellow><enchant> </yellow>rodzaj zaklęcia'
      - '<gray><yellow>[level] </yellow>poziom zaklęcia, domyślnie <yellow>1'
      - ''
      - '<gold><b>Wskazówka</b></gold> <gray>Ustaw <yellow>[level] </yellow>na <yellow>0 </yellow>aby usunąć zaklęcie'
    params: '<enchant> [level]'
    feedback-removed: '%prefix% <green>Usunięto zaklęcie <yellow>%enchant%'
    feedback: '%prefix% <green>Zastosowane zaklęcie <yellow>%enchant% <green>poziom <yellow>%lv%'
  fireresistent:
    description:
      - '<gradient:#A78BFA:gold><b>Ustaw odporność przedmiotu na ogień/lawę</b></gradient>'
      - ''
      - '<gray><yellow>[true/false] </yellow>ustaw wartość, domyślnie przełącz'
      - ''
      - '<gray>Przedmiot posiadający odporność na ogień nie zostanie zniszczony'
      - '<gray> po wpadnięciu w ogień i unosi się nad lawą'
    params: '[true/false]'
    feedback: '%prefix% <green>Odporność na ogień ustawiona na <yellow>%value%'
  fireworkpower:
    description:
      - '<gradient:#A78BFA:gold><b>Ustaw moc fajerwerków</b></gradient>'
      - '<white><sprite:items:item/firework_rocket>'
      - '<gray><yellow><power> </yellow>moc fajerwerków, wartość pomiędzy <yellow>0 </yellow>a <yellow>5'
    params: '<power>'
    feedback: '%prefix% <green>Zaktualizowano moc fajerwerków'
  firework:
    description:
      - '<gradient:#A78BFA:gold><b>Edytuj fajerwerki za pomocą GUI</b></gradient>'
      - '<white><sprite:items:item/firework_rocket>'
    params: ''
  food:
    description:
      - '<gradient:#A78BFA:gold><b>Ustawia właściwości żywnościowe przedmiotu</b></gradient>'
      - ''
      - '<gray><gold><b>Wskazówka</b></gold> Użyj /itemfood or /if'
      - '<gray><gold>N.B.</gold> twoich napojów nie można jeść'
    params: ''
  glider:
    description:
      - '<gradient:#A78BFA:gold><b>Ustaw stan szybowca</b></gradient>'
      - ''
      - '<gray>Przedmiot szybowca powinien umożliwiać szybowanie jak na elytrach'
      - '<gray><yellow>[true/false] </yellow>ustaw wartość szybowca, domyślnie przełączaj'
    params: '[true/false]'
    feedback: '%prefix% <green>Zaktualizowano Szybowanie ustawione na <yellow>%value%'
  glow:
    description:
      - '<gradient:#A78BFA:gold><b>Zastąp efekt blasku zaklęcia</b></gradient>'
      - ''
      - '<gray><yellow>[true/false] </yellow>ustaw wartość, domyślnie reset'
      - ''
      - '<gold><b>Wskazówka</b></gold> <gray><yellow>nie określono wartości </yellow>przywróć standardowe zachowanie'
    params: '[true/false/default]'
    feedback: '%prefix% <green>Poświata ustawiona na <yellow>%value%'
    feedback-reset: '%prefix% <green>Przywróć domyślną wartość blasku'
  goathornsound:
    description:
      - '<gradient:#A78BFA:gold><b>Ustaw dźwięk koziego rogu</b></gradient>'
      - '<white><sprite:items:item/goat_horn>'
      - '<gray><yellow><type> </yellow>rodzaj dźwięku'
    params: '<type>'
    feedback: '%prefix% <green>Zaktualizowany dźwięk'
  hide:
    description:
      - '<gradient:#A78BFA:gold><b>Ukryj lub pokaż komponenty</b></gradient>'
      - ''
      - '<gray><yellow><flag> </yellow>flaga elementu do edycji'
      - '<gray><yellow>[true/false] </yellow>ustaw wartość flagi, domyślnie przełącz'
      - ''
      - '<gold><b>Wskazówka</b></gold> <gray>ukryj wzory banerów za pomocą flagi potion_effects'
      - '<gold><b>Wskazówka</b></gold> <gray>ukryj wszystkie flagi na raz za pomocą <yellow>/itemedit hideall'
    params: '<flag> [true/false]'
    feedback: '%prefix% <green>Flaga jest teraz <yellow>%value%'
  hidetooltip:
    description:
      - '<gradient:#A78BFA:gold><b>Ukryj lub pokaż podpowiedzi</b></gradient>'
      - ''
      - '<gray><yellow>[true/false] </yellow>ustaw wartość flagi, domyślnie przełącz'
    params: '[true/false]'
    feedback: '%prefix% <green>Ukryta podpowiedź to teraz <yellow>%value%'
  hideall:
    description:
      - '<gradient:#A78BFA:gold><b>Ukryj wszystkie komponenty</b></gradient>'
      - ''
      - '<gray>Skrytki: zaklęcia, efekty mikstur, warstwy banerów, atrybuty...'
      - ''
      - '<gold><b>Wskazówka</b></gold> <gray>ukryj pojedyncze komponenty za pomocą <yellow>/itemedit hide <flag> true'
    params: ''
    feedback: '%prefix% <green>Ukryte wszystkie flagi'
  itemmodel:
    description:
      - '<gradient:#A78BFA:gold><b>Edytuj model przedmiotu</b></gradient>'
      - ''
      - '<gray><yellow><namespaced key> </yellow>klawisz do ustawienia odniesienia do tekstury'
      - '<gray>Przykład: /ie itemmodel <yellow>iron_sword'
      - '<gray>Przykład: /ie itemmodel <yellow>minecraft:iron_sword'
      - ''
      - '<gray><yellow><namespace></yellow>:<yellow><id></yellow> będzie odnosić się do modelu:'
      - '  /assets/<yellow><namespace></yellow>/models/item/<yellow><id>'
    params: '<namespaced key>'
    feedback: '%prefix% <green>Zaktualizowano model przedmiotu'
    feedback-reset: '%prefix% <green>Zresetuj model przedmiotu'
  kinetic:
    description:
      - '<gradient:#A78BFA:gold><b>Ustawia właściwości kinetyczne przedmiotu</b></gradient>'
      - '<white><sprite:items:item/iron_spear>'
      - '<gray><gold><b>Wskazówka</b></gold> Użyj /itemkinetic or /iek'
    params: ''
  maxdurability:
    description:
      - '<gradient:#A78BFA:gold><b>Ustawia maksymalną trwałość przedmiotu</b></gradient>'
      - ''
      - '<gray><yellow><max durability> </yellow>nowa wartość wytrzymałości przedmiotu,'
      - '<gray> musi być większe niż 1'
    params: '<max durability>'
    feedback: '%prefix% <green>Zaktualizowano maksymalną wytrzymałość do <yellow>%value%'
  maxstacksize:
    description:
      - '<gradient:#A78BFA:gold><b>Ustawia maksymalny rozmiar stosu przedmiotów</b></gradient>'
      - ''
      - '<gray><yellow>[1-99] </yellow>ustaw wartość flagi'
