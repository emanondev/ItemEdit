    animations: '%prefix% <red>Zła wartość animacji! <dark_red>[<gold>najedź tutaj<dark_red>]'
    sound: '%prefix% <red>Zła wartość dźwięku! <dark_red>[<gold>najedź tutaj<dark_red>]'
    enchant: '%prefix% <red>Zła wartość zaklęcia! <dark_red>[<gold>najedź tutaj<dark_red>]'
