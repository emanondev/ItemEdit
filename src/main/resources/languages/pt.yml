    success: '%prefix% <green>Obtido <yellow>%amount% <green>de <yellow>%id%'
    no-inventory-space: '%prefix% <red>Não tem espaço no seu inventário'
    description:
      - '<gradient:#A78BFA:gold><b>Obter item selecionado</b></gradient>'
      - ''
      - '<gray><yellow><id> </yellow>Id do item'
      - '<gray><yellow>[amount] </yellow>quantidade a obter, por defeito 1'
    params: '<id> [amount]'
  save:
    #Holders: %id%
    success: '%prefix% <green>Artigo <yellow>%id% <green>registado'
    #Holders: %limit%
    limit-reached: '%prefix% <red>Atingiu o número máximo de itens salváveis (%limit%)'
    description:
      - '<gradient:#A78BFA:gold><b>Registe o item na sua mão</b></gradient>'
      - ''
      - '<gray><yellow><id> </yellow>identifique o seu item, não distingue maiúsculas de minúsculas e não pode'
      - '<gray> contém espaços ou pontos e não pode selecionar'
      - '<gray> qualquer ID já utilizado'
      - ''
      - '<gold><b>Dica</b></gold> <gray>utilizar <yellow>/itemstorage update <id></yellow>, para alterar um item existente'
      - '<gold><b>Dica</b></gold> <gray>recupere os seus itens guardados com <yellow>/itemstorage get <id>'
    params: '<id>'
  delete:
    #Holders: %id%
    success: '%prefix% <green>Artigo <yellow>%id% <green>não registado'
    description:
      - '<gradient:#A78BFA:gold><b>Apagar item selecionado</b></gradient>'
      - ''
      - '<gray><yellow><id> </yellow>Id do item'
    params: '<id>'
  update:
    #Holders: %id%
    success: '%prefix% <green>O item <yellow>%id% <green>foi atualizado'
    description:
      - '<gradient:#A78BFA:gold><b>Atualizar item selecionado</b></gradient>'
      - ''
      - '<gray>Altere o item associado ao id com o seu item de mão'
      - '<gray><yellow><id> </yellow>Id do item'
      - ''
      - '<gray><gold><b>Dica</b></gold> utilize <yellow>/itemstorage save <id></yellow>, para criar um novo item'
      - '<gray><gold><b>Tip</b></gold> utilize <yellow>/itemstorage delete <id></yellow>, para eliminar um item'
    params: '<id>'
  show:
    description:
      - '<gradient:#A78BFA:gold><b>Abra uma GUI com os seus itens guardados</b></gradient>'
      - ''
      - '<gray><yellow>[page] <gray>página da GUI, por defeito 1'
    params: '[page]'
itemeditimport:
  help:
    - '<green>/itemeditimport ItemEditor <dark_green>- importar itens do plugin ItemEditor'
  itemeditor:
    unable-to-get-item:
      - '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <red>Não foi possível carregar o item <gold>%id%'
    already-used-id:
      - '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <gold>%id% <red> já está a ser utilizado, talvez já tenha feito este comando anteriormente, caso contrário pode renomear o ficheiro ItemEditor/items/%id%.yml'
    invalid-id:
      - '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <gold>%id% <red> não é um ID aceitável, pode renomear o ficheiro ItemEditor/items/%id%.yml para um nome alfanumérico'
    import-unsuccess:
      - '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <red>Nenhum item de <gold>%max% <red>foi importado, talvez já tenha feito este comando antes(?)'
    import-success:
      - '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <green>Importado <yellow>%done% <green>de <yellow>%max% <green>itens de ItemEditor'
      - '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <green>Artigos importados: <yellow>%ids%'
    import-empty:
      - '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <red>ItemEditor não tem itens para importar'
itemeditreload:
  success: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <green>Recarregado'
