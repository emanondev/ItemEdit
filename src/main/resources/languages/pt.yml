generic:
  help:
    player-only: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <red>Comando apenas para jogadores'
    no-item-on-hand: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <red>Necessita de segurar um item na mão'
    lack-permission: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <red>Não tem permissão %permission%'
    lack-permission-generic: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <red>Não tem permissão para utilizar este comando'
    blocked-by-censure: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <red>Não pode utilizar este texto, contém palavras bloqueadas'
    blocked-by-type-restriction: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <red>Não pode renomear este item'
    blocked-by-type-restriction-lore: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <red>Não pode editar a descrição do item neste item'
    blocked-by-lore-line-limit: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <red>Não pode adicionar mais linhas de descrição de itens neste item'
    blocked-by-lore-length-limit: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <red>Não pode definir linhas maiores que %limit% caracteres'
    blocked-by-rename-length-limit: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <red>Não pode definir nomes com mais de %limit% caracteres'

    prefix: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray>'
    header-format: '<gradient:#54acff:#A78BFA><bold>%header%</bold></gradient> <dark_gray>»</dark_gray> <#A78BFA><bold>Ajuda</bold></#A78BFA>'
    header-sub-format: '<gradient:#54acff:#A78BFA><bold>%header%</bold></gradient> <dark_gray>»</dark_gray> <gradient:#A78BFA:#54acff><bold>%sub%</bold></gradient> <dark_gray>»</dark_gray> <#55d6ff><bold>Ajuda</#55d6ff>'
    command-format: '<gray>/%command%</gray> <#bad1ff>%sub%</#bad1ff> <#d7bbff>%params%</#d7bbff>'
    footer-format: '%prev_clickable% <#7E9CFD><b>Ajuda</b> [%page%/%max_page%]</#7E9CFD> %next_clickable%'
    next_text: ' <light_purple><b>><st>> ></st> '
    prev_text: ' <light_purple><b><st>< <</st>< '
    next_void: ' <dark_gray><b>><st>> ></st> '
    prev_void: ' <dark_gray><b><st>< <</st>< '
    next_hover: '<gold><b>Ir para a página %target%'
    prev_hover: '<gold><b>Ir para a página %target%'
  wrong-material:
    axolotl_bucket: '%prefix% <red>O item deve ser um balde de axolote'
    banner: '%prefix% <red>O item deve ser um banner'
    damageable: '%prefix% <red>O item deve ter durabilidade como ferramentas e armaduras'
    player_head: '%prefix% <red>O item deve ser a cabeça de um jogador'
    rgb_colorable: '%prefix% <red>O item deve ser do tipo colorido, como armaduras de couro, estrelas de fogo de artifício, poções ou flechas com efeitos de poção'
    written_book: '%prefix% <red>O item deve ser um livro escrito'
    potion_effect_applicable: '%prefix% <red>O item deve ser uma poção ou uma flecha com efeito de poção ou um ensopado suspeito'
    firework: '%prefix% <red>O item deve ser fogo de artifício'
    spawner_egg: '%prefix% <red>O item deve ser um ovo de desova'
    tropical_fish_bucket: '%prefix% <red>O item deve ser um balde de peixes tropicais'
    writable_book: '%prefix% <red>O item deve ser um livro escrito ou livro e pena'
    compass: '%prefix% <red>O item deve ser uma bússola'
    music_instrument: '%prefix% <red>O item deve ser um chifre de cabra'
    armor: '%prefix% <red>O item deve ser uma armadura'
    enchantment_storage: '%prefix% <red>O item deve ser um livro ou livro encantado'
  wrong-alias:
    axolotl_variant: '%prefix% <red>Valor de Axolotl errado! <dark_red>[<gold>passe aqui o rato<dark_red>]'
    potion_effect: '%prefix% <red>Valor do efeito errado! <dark_red>[<gold>passe aqui o rato<dark_red>]'
    animations: '%prefix% <red>Valor de animação errado! <dark_red>[<gold>passe aqui o rato<dark_red>]'
    sound: '%prefix% <red>Valor sonoro errado! <dark_red>[<gold>passe aqui o rato<dark_red>]'
    enchant: '%prefix% <red>Valor de encantamento errado! <dark_red>[<gold>passe aqui o rato<dark_red>]'
    flag_type: '%prefix% <red>Valor de indicador errado! <dark_red>[<gold>passe aqui o rato<dark_red>]'
    book_type: '%prefix% <red>Valor do tipo de livro errado! <dark_red>[<gold>passe aqui o rato<dark_red>]'
    equip_slot: '%prefix% <red>Valor errado do slot do equipamento! <dark_red>[<gold>passe aqui o rato<dark_red>]'
    banner_pattern: '%prefix% <red>Valor do padrão errado! <dark_red>[<gold>passe aqui o rato<dark_red>]'
    color: '%prefix% <red>Valor de cor errado! <dark_red>[<gold>passe aqui o rato<dark_red>]'
    mob_type: '%prefix% <red>Valor do tipo de ovo errado! <dark_red>[<gold>passe aqui o rato<dark_red>]'
    trim_material: '%prefix% <red>Armadura de armadura errada Valor do material! <dark_red>[<gold>passe aqui o rato<dark_red>]'
    tropical_fish_pattern: '%prefix% <red>Valor do padrão errado! <dark_red>[<gold>passe aqui o rato<dark_red>]'
    trim_pattern: '%prefix% <red>Valor do padrão de acabamento da armadura errado! <dark_red>[<gold>passe aqui o rato<dark_red>]'
    boolean: '%prefix% <red>Valor booleano errado! <dark_red>[<gold>passe aqui o rato<dark_red>]'
    attribute: '%prefix% <red>Valor de atributo errado! <dark_red>[<gold>passe aqui o rato<dark_red>]'
    operation: '%prefix% <red>Valor de funcionamento errado! <dark_red>[<gold>passe aqui o rato<dark_red>]'
    itemrarity: '%prefix% <red>Valor de raridade errado! <dark_red>[<gold>passe aqui o rato<dark_red>]'
    entitytype: '%prefix% <red>Valor EntityType errado! <dark_red>[<gold>passe aqui o rato<dark_red>]'
    entitygroups: '%prefix% <red>Valor EntityGroup errado! <dark_red>[<gold>passe aqui o rato<dark_red>]'
    consumable_effect: '%prefix% <red>Valor de efeito consumível errado! <dark_red>[<gold>passe aqui o rato<dark_red>]'
    goat_horn_sound: '%prefix% <red>Valor sonoro de chifre de cabra errado! <dark_red>[<gold>passe aqui o rato<dark_red>]'
    error-pre-hover: '<gradient:#A78BFA:gold><b>Aliás:</b></gradient>'
    first_color: '<aqua>'
    second_color: '<yellow>'
itemedit:
  amount:
    description:
      - '<gradient:#A78BFA:gold><b>Definir valor</b></gradient>'
      - ''
      - '<gray><yellow><amount> </yellow>quantidade a definir (até 127)'
      - '<gold><b>Dica</b></gold> <gray>Os valores negativos são subtraídos'
      - '<gray> do valor atual do item'
    params: '<amount>'
    feedback: '%prefix% <green>Valor do item definido como <yellow>%amount%'
    feedback-decrease: '%prefix% <green>Valor do item diminuiu em <yellow>%amount%'
  attribute:
    description:
      - '<gradient:#A78BFA:gold><b>Editar modificadores de atributos</b></gradient>'
      - ''
      - '<gray><yellow>Add <attribute> <amount> [operation] [slot] </yellow><dark_gray>»</dark_gray> adicionar novos modificadores'
      - '<gray><yellow>Remove <attribute/slot> </yellow><dark_gray>»</dark_gray> remove alguns modificadores'
    params: '<add/remove> [...]'
    add:
      params: '<attribute> <amount> [operation] [slot]'
      description:
        - '<gradient:#A78BFA:gold><b>Adicionar modificador de atributo</b></gradient>'
        - ''
        - '<gray><yellow><attribute> </yellow>tipo de atributo'
        - '<gray><yellow><amount> </yellow>quantidade a definir'
        - '<gray><yellow>[operation] </yellow>como o modificador é adicionado, por defeito somas'
        - '<gray><yellow>[slot] </yellow>aplica este modificador apenas quando o item está selecionado'
        - '<gray> slot de equipamento ou qualquer slot de equipamento se não for selecionado'
      feedback: '%prefix% <green>Modificador adicionado'
    remove:
      params: '<attribute/slot>'
      description:
        - '<gradient:#A78BFA:gold><b>Remover modificadores</b></gradient>'
        - ''
        - '<gray><yellow><attribute/slot> </yellow>digite para remover quaisquer modificadores com'
        - '<gray> o valor selecionado é removido'
      feedback-attribute: '%prefix% <green>Modificadores de atributos removidos'
      feedback-equipment: '%prefix% <green>Modificadores de ranhura de equipamento removidos'
  axolotlvariant:
    description:
      - '<gradient:#A78BFA:gold><b>Editar variante do Axolotl no balde Axolotl</b></gradient>'
      - '<white><sprite:items:item/axolotl_bucket>'
      - '<gray><yellow><type> </yellow>o tipo de axolote'
    params: '<type>'
    feedback: '%prefix% <green>Variante Axolotl alterada para <yellow>%variant%'
  banner:
    description:
      - '<gradient:#A78BFA:gold><b>Editar banner</b></gradient>'
    params: '<add/set/remove/color> [...]'
    set:
      params: '<type> <color> <line>'
      description:
        - '<gradient:#A78BFA:gold><b>Substituir o padrão na linha selecionada</b></gradient>'
      feedback: '%prefix% <green>Conjunto de normas'
    add:
      params: '<type> <color>'
      description:
        - '<gradient:#A78BFA:gold><b>Adicionar um padrão</b></gradient>'
      feedback: '%prefix% <green>Padrão adicionado'
    remove:
      params: '<line>'
      description:
        - '<gradient:#A78BFA:gold><b>Remover predefinição na linha selecionada</b></gradient>'
      feedback: '%prefix% <green>Padrão removido'
    color:
      params: '<line> <color>'
      description:
        - '<gradient:#A78BFA:gold><b>Alterar cor do padrão na linha selecionada</b></gradient>'
      feedback: '%prefix% <green>Padrão recolorido'
  bookauthor:
    description:
      - '<gradient:#A78BFA:gold><b>Definir autor</b></gradient>'
      - '<white><sprite:items:item/written_book>'
      - '<gray>O nome do autor pode conter espaços e ser também colorido'
      - '<gray>Funciona apenas em livros escritos'
    params: '<name>'
    feedback: '%prefix% <green>Autor do livro atualizado'
    feedback-reset: '%prefix% <green>Redefinir autor do livro'
  bookenchant:
    description:
      - '<gradient:#A78BFA:gold><b>Definir encantamentos no livro</b></gradient>'
      - '<white><sprite:items:item/enchanted_book> <sprite:items:item/book>'
      - '<gray>A diferença entre enchant e bookenchant é que'
      - '<gray>um livro com enchant aspeto de fogo incendeia os alvos quando atingido'
      - '<gray>enquanto um livro com bookenchant não'
      - ''
      - '<gray><yellow><enchant> </yellow>tipo de encantamento'
      - '<gray><yellow>[level] </yellow>nível do encantamento, por defeito <yellow>1'
      - ''
      - '<gold><b>Dica</b></gold> <gray>Defina <yellow>[level] </yellow>para <yellow>0 </yellow>para remover um encantamento'
    params: '<enchant> [level]'
    feedback-removed: '%prefix% <green>Encantamento de livro removido <yellow>%enchant%'
    feedback: '%prefix% <green>Encantamento de livro aplicado <yellow>%enchant% <green>lv <yellow>%lv%'
  booktype:
    description:
      - '<gradient:#A78BFA:gold><b>Definir tipo de livro</b></gradient>'
      - '<white><sprite:items:item/written_book>'
      - '<gray>Funciona apenas em livros escritos'
    params: '<booktype>'
    feedback: '%prefix% <green>Geração de livros atualizada para <yellow>%generation%'
    feedback-reset: '%prefix% <green>Redefinir geração de livro'
  color:
    description:
      - '<gradient:#A78BFA:gold><b>Definir cor</b></gradient>'
      - '<white><sprite:items:item/potion> <sprite:items:item/tipped_arrow_base> <sprite:items:item/firework_star> <sprite:items:item/leather_chestplate>'
      - '<gray>Funciona em armaduras de couro e estrelas de fogos de artifício, poções e flechas com efeitos de poção também!'
      - '<gray><yellow>[red] [green] [blue] </yellow>são a quantidade de cada cor a combinar'
      - '<gray>Cada cor é um valor interno entre 0 e 255'
      - '<gray>Se está confuso, pesquise no Google "<yellow>Seletor de cores RGB</yellow>"'
    params: '[red] [green] [blue]'
    feedback: '%prefix% <green>Cor atualizada'
  compass:
    description:
      - '<gradient:#A78BFA:gold><b>Definir local de destino da bússola</b></gradient>'
      - '<white><sprite:items:item/compass_00>'
      - '<gray><yellow>Set </yellow><dark_gray>»</dark_gray> defina a sua localização como alvo da bússola'
      - '<gray><yellow>Clear </yellow><dark_gray>»</dark_gray> limpar alvo da bússola'
    params: '<set/clear>'
    set:
      feedback: '%prefix% <green>Bússola aponta agora para <yellow>%world% %x% %y% %z%'
    clear:
      feedback: '%prefix% <green>Alvo da bússola apagado'
  custommodeldata:
    description:
      - '<gradient:#A78BFA:gold><b>Editar dados do modelo personalizado</b></gradient>'
      - ''
      - '<gray>Utilizado para pacotes de textura'
      - '<gray><yellow>[value] </yellow>int positivo do modelo de dados alvo'
      - '<gray>Nota: os servidores modernos utilizam itemmodel em vez de custommodeldata'
      - '<gray> para texturas, este comando é para clientes legados'
    params: '<value>'
    feedback: '%prefix% <green>Dados do modelo personalizado atualizados'
    feedback-reset: '%prefix% <green>Redefinição de dados do modelo personalizado'
  damage:
    description:
      - '<gradient:#A78BFA:gold><b>Editar durabilidade</b></gradient>'
      - ''
      - '<gray><yellow><durability> </yellow>dano a aplicar'
      - '<gray><gold>N.B.</gold> <yellow>0 </yellow>significa ausência de danos, durabilidade total'
    params: '<durability>'
    feedback-reset: '%prefix% <green>Durabilidade restaurada'
    feedback: '%prefix% <green>Durabilidade atualizada'
  equipment:
    description:
      - '<gradient:#A78BFA:gold><b>Define a propriedade Equipamento do item</b></gradient>'
      - ''
      - '<gray><gold><b>Dica</b></gold> Utilizar /itemequip or /iee'
      - '<gray><gold>N.B.</gold> os seus itens bebíveis não podem ser comidos'
    params: ''
  enchant:
    description:
      - '<gradient:#A78BFA:gold><b>Definir encantamentos</b></gradient>'
      - ''
      - '<gray><yellow><enchant> </yellow>tipo de encantamento'
      - '<gray><yellow>[level] </yellow>nível do encantamento, por defeito <yellow>1'
      - ''
      - '<gold><b>Dica</b></gold> <gray>Defina <yellow>[level] </yellow>para <yellow>0 </yellow>para remover um encantamento'
    params: '<enchant> [level]'
    feedback-removed: '%prefix% <green>Encantamento removido <yellow>%enchant%'
    feedback: '%prefix% <green>Encantamento aplicado <yellow>%enchant% <green>lv <yellow>%lv%'
  fireresistent:
    description:
      - '<gradient:#A78BFA:gold><b>Definir resistência do item ao fogo/lava</b></gradient>'
      - ''
      - '<gray><yellow>[true/false] </yellow>defina o valor, comute por defeito'
      - ''
      - '<gray>Um item com resistência ao fogo não será destruído'
      - '<gray> ao cair no fogo e flutuar sobre a lava'
    params: '[true/false]'
    feedback: '%prefix% <green>Resistência ao fogo definida como <yellow>%value%'
  fireworkpower:
    description:
      - '<gradient:#A78BFA:gold><b>Definir poder de fogo de artifício</b></gradient>'
      - '<white><sprite:items:item/firework_rocket>'
      - '<gray><yellow><power> </yellow>potência do fogo de artifício, um valor entre <yellow>0 </yellow>e <yellow>5'
    params: '<power>'
    feedback: '%prefix% <green>Poder de fogo de artifício atualizado'
  firework:
    description:
      - '<gradient:#A78BFA:gold><b>Editar fogo de artifício com uma GUI</b></gradient>'
      - '<white><sprite:items:item/firework_rocket>'
    params: ''
  food:
    description:
      - '<gradient:#A78BFA:gold><b>Define a propriedade alimentar do item</b></gradient>'
      - ''
      - '<gray><gold><b>Dica</b></gold> Utilizar /itemfood or /if'
      - '<gray><gold>N.B.</gold> os seus itens bebíveis não podem ser comidos'
    params: ''
  glider:
    description:
      - '<gradient:#A78BFA:gold><b>Definir estado do planador</b></gradient>'
      - ''
      - '<gray>O item planador deve permitir planar como nos élitros'
      - '<gray><yellow>[true/false] </yellow>definir valor do planador, por defeito alternar'
    params: '[true/false]'
    feedback: '%prefix% <green>Deslizante atualizado definido para <yellow>%value%'
  glow:
    description:
      - '<gradient:#A78BFA:gold><b>Substituir efeito de brilho de encantamento</b></gradient>'
      - ''
      - '<gray><yellow>[true/false] </yellow>defina o valor, por defeito reposto'
      - ''
      - '<gold><b>Tip</b></gold> <gray><yellow>nenhum valor especificado </yellow>restaurar comportamento vanilla'
    params: '[true/false/default]'
    feedback: '%prefix% <green>Brilho definido para <yellow>%value%'
    feedback-reset: '%prefix% <green>Repor valor de brilho para o padrão'
  goathornsound:
    description:
      - '<gradient:#A78BFA:gold><b>Definir som de buzina de cabra</b></gradient>'
      - '<white><sprite:items:item/goat_horn>'
      - '<gray><yellow><type> </yellow>o tipo de som'
    params: '<type>'
    feedback: '%prefix% <green>Som atualizado'
  hide:
    description:
      - '<gradient:#A78BFA:gold><b>Ocultar ou mostrar componentes</b></gradient>'
      - ''
      - '<gray><yellow><flag> </yellow>sinalizador de item para editar'
      - '<gray><yellow>[true/false] </yellow>defina o valor do sinalizador, por defeito comute'
      - ''
      - '<gold><b>Tip</b></gold> <gray>ocultar padrões de banner com indicador potion_effects'
      - '<gold><b>Tip</b></gold> <gray>ocultar todas os indicadores de uma só vez com <yellow>/itemedit hideall'
    params: '<flag> [true/false]'
    feedback: '%prefix% <green>O indicador é agora <yellow>%value%'
  hidetooltip:
    description:
      - '<gradient:#A78BFA:gold><b>Ocultar ou mostrar dicas de ferramentas</b></gradient>'
      - ''
      - '<gray><yellow>[true/false] </yellow>defina o valor do sinalizador, por defeito comute'
    params: '[true/false]'
    feedback: '%prefix% <green>O estado oculto da dica de ferramenta é agora <yellow>%value%'
  hideall:
    description:
      - '<gradient:#A78BFA:gold><b>Ocultar todos os componentes</b></gradient>'
      - ''
      - '<gray>Ocultos: encantamentos, efeitos de poções, camadas de banner, atributos...'
      - ''
      - '<gold><b>Tip</b></gold> <gray>ocultar componentes únicos com <yellow>/itemedit hide <flag> true'
    params: ''
    feedback: '%prefix% <green>Todas os indicadores escondidas'
  itemmodel:
    description:
      - '<gradient:#A78BFA:gold><b>Editar modelo do item</b></gradient>'
      - ''
      - '<gray><yellow><namespaced key> </yellow>chave para definir a referência de textura'
      - '<gray>Exemplo: /ie itemmodel <yellow>iron_sword'
      - '<gray>Exemplo: /ie itemmodel <yellow>minecraft:iron_sword'
      - ''
      - '<gray><yellow><namespace></yellow>:<yellow><id></yellow> fará referência ao modelo:'
      - '  /assets/<yellow><namespace></yellow>/models/item/<yellow><id>'
    params: '<namespaced key>'
    feedback: '%prefix% <green>Modelo de item atualizado'
    feedback-reset: '%prefix% <green>Redefinir modelo de item'
  kinetic:
    description:
      - '<gradient:#A78BFA:gold><b>Define a propriedade cinética do item</b></gradient>'
      - '<white><sprite:items:item/iron_spear>'
      - '<gray><gold><b>Dica</b></gold> Utilizar /itemkinetic or /iek'
    params: ''
  maxdurability:
    description:
      - '<gradient:#A78BFA:gold><b>Define a durabilidade máxima do item</b></gradient>'
      - ''
      - '<gray><yellow><max durability> </yellow>item novo valor de durabilidade,'
      - '<gray> deve ser superior a 1'
    params: '<max durability>'
    feedback: '%prefix% <green>Durabilidade máxima atualizada para <yellow>%value%'
  maxstacksize:
    description:
      - '<gradient:#A78BFA:gold><b>Define o tamanho máximo da pilha do item</b></gradient>'
      - ''
      - '<gray><yellow>[1-99] </yellow>defina o valor do sinalizador'
      - ''
      - '<gray><yellow>nenhum valor </yellow>irá repor o tamanho da pilha comum que é <yellow>64'
      - '<gray> para a maioria dos itens, <yellow>1</yellow> para armaduras e ferramentas e outros'
      - '<gray> valores para alguns itens'
    params: '[1-99]'
    feedback: '%prefix% <green>Atualizado o tamanho máximo da pilha para <yellow>%value%'
    feedback-reset: '%prefix% <green>Redefinir tamanho máximo da pilha'
  pierce:
    description:
      - '<gradient:#A78BFA:gold><b>Definir as propriedades da arma perfurante do item</b></gradient>'
      - '<white><sprite:items:item/iron_spear>'
      - '<gold><b>Dica</b></gold><gray> Utilizar /itempiercing or /iep'
    params: ''
  potioneffect:
    itemtag-tip: '%prefix% <gray>Precisa de adicionar efeitos de poção a itens comuns? experimente >ItemTag<'
    itemtag-tip-hover:
      - '<gradient:#A78BFA:gold>Clique em mim</gradient>'
    description:
      - '<gradient:#A78BFA:gold><b>Editar efeitos da poção</b></gradient>'
      - '<white><sprite:items:item/potion> <sprite:items:item/suspicious_stew> <sprite:items:item/tipped_arrow_base>'
      - '<gray>Funciona em qualquer Poção, flechas com efeitos de poção e Ensopado Suspeito!'
      - '<gray><yellow>Add <effect> <duration> [level] </yellow><dark_gray>»</dark_gray> adicionar efeito'
      - '<gray><yellow>Remove <effect> </yellow><dark_gray>»</dark_gray> remove o efeito selecionado'
      - '<gray><yellow>Reset </yellow><dark_gray>»</dark_gray> remover todos os efeitos'
    params: '<add/remove/reset> [...]'
    add:
      params: '<effect> <duration> [level] [particles] [ambient] [icon]'
      description:
        - '<gradient:#A78BFA:gold><b>Adiciona/substitui efeito selecionado</b></gradient>'
        - ''
        - '<gray><yellow><effect> </yellow>tipo de efeito'
        - '<gray><yellow><duration> </yellow>duração em segundos'
        - '<gray><yellow>[level] </yellow>Até 127, por defeito <yellow>1'
        - '<gray><yellow>[particles] </yellow>Deve apresentar partículas? <yellow>true</yellow>/<yellow>false'
        - '<gray><yellow>[ambient] </yellow>As partículas devem ter sinalização ambiental? <yellow>true</yellow>/<yellow>false'
        - '<gray><yellow>[icon] </yellow>Mostrar ícone no canto superior direito? <yellow>true</yellow>/<yellow>false'
