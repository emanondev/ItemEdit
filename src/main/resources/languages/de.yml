generic:
  help:
    player-only: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <red>Befehl nur für Spieler'
    no-item-on-hand: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <red>Sie müssen einen Gegenstand in der Hand halten'
    lack-permission: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <red>Sie haben keine Berechtigung %permission%'
    lack-permission-generic: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <red>Sie haben keine Berechtigung, diesen Befehl zu verwenden'
    blocked-by-censure: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <red>Sie können diesen Text nicht verwenden, er enthält blockierte Wörter'
    blocked-by-type-restriction: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <red>Sie können dieses Element nicht umbenennen'
    blocked-by-type-restriction-lore: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <red>Sie können die Gegenstandsbeschreibung für diesen Artikel nicht bearbeiten'
    blocked-by-lore-line-limit: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <red>Sie können diesem Artikel keine weiteren Gegenstandsbeschreibungszeilen hinzufügen'
    blocked-by-lore-length-limit: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <red>Sie können keine Zeilen festlegen, die länger als %limit% Zeichen sind'
    blocked-by-rename-length-limit: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <red>Sie können keine Namen festlegen, die länger als %limit% Zeichen sind'

    prefix: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray>'
    header-format: '<gradient:#54acff:#A78BFA><bold>%header%</bold></gradient> <dark_gray>»</dark_gray> <#A78BFA><bold>Hilfe</bold></#A78BFA>'
    header-sub-format: '<gradient:#54acff:#A78BFA><bold>%header%</bold></gradient> <dark_gray>»</dark_gray> <gradient:#A78BFA:#54acff><bold>%sub%</bold></gradient> <dark_gray>»</dark_gray> <#55d6ff><bold>Hilfe</#55d6ff>'
    command-format: '<gray>/%command%</gray> <#bad1ff>%sub%</#bad1ff> <#d7bbff>%params%</#d7bbff>'
    footer-format: '%prev_clickable% <#7E9CFD><b>Hilfe</b> [%page%/%max_page%]</#7E9CFD> %next_clickable%'
    next_text: ' <light_purple><b>><st>> ></st> '
    prev_text: ' <light_purple><b><st>< <</st>< '
    next_void: ' <dark_gray><b>><st>> ></st> '
    prev_void: ' <dark_gray><b><st>< <</st>< '
    next_hover: '<gold><b>Gehe zu Seite %target%'
    prev_hover: '<gold><b>Gehe zu Seite %target%'
  wrong-material:
    axolotl_bucket: '%prefix% <red>Beim Gegenstand muss es sich um einen Axolotl-Eimer handeln'
    banner: '%prefix% <red>Beim Element muss es sich um ein Banner handeln'
    damageable: '%prefix% <red>Der Gegenstand muss eine Haltbarkeit wie Werkzeuge und Rüstungen haben'
    player_head: '%prefix% <red>Der Gegenstand muss ein Spielerkopf sein'
    rgb_colorable: '%prefix% <red>Der Gegenstand muss ein färbbarer Typ sein, z. B. Lederrüstungen, Feuerwerkssterne, Tränke oder Pfeile mit Trankeffekten'
    written_book: '%prefix% <red>Der Gegenstand muss ein geschriebenes Buch sein'
    potion_effect_applicable: '%prefix% <red>Der Gegenstand muss ein Trank oder ein Pfeil mit Trankeffekt oder ein verdächtiger Eintopf sein'
    firework: '%prefix% <red>Der Gegenstand muss ein Feuerwerk sein'
    spawner_egg: '%prefix% <red>Der Gegenstand muss ein Spawn-Ei sein'
    tropical_fish_bucket: '%prefix% <red>Der Gegenstand muss ein tropischer Fischeimer sein'
    writable_book: '%prefix% <red>Der Gegenstand muss ein geschriebenes Buch oder ein Buch mit Feder sein'
    compass: '%prefix% <red>Beim Gegenstand muss es sich um einen Kompass handeln'
    music_instrument: '%prefix% <red>Der Gegenstand muss ein Ziegenhorn sein'
    armor: '%prefix% <red>Der Gegenstand muss eine Rüstung sein'
    enchantment_storage: '%prefix% <red>Der Gegenstand muss ein Buch oder ein verzaubertes Buch sein'
  wrong-alias:
    axolotl_variant: '%prefix% <red>Falscher Axolotl-Wert! <dark_red>[<gold>hier schweben<dark_red>]'
    potion_effect: '%prefix% <red>Falscher Effektwert! <dark_red>[<gold>hier schweben<dark_red>]'
    animations: '%prefix% <red>Falscher Animationswert! <dark_red>[<gold>hier schweben<dark_red>]'
    sound: '%prefix% <red>Falscher Klangwert! <dark_red>[<gold>hier schweben<dark_red>]'
    enchant: '%prefix% <red>Falscher Verzauberungswert! <dark_red>[<gold>hier schweben<dark_red>]'
    flag_type: '%prefix% <red>Falscher Flag-Wert! <dark_red>[<gold>hier schweben<dark_red>]'
    book_type: '%prefix% <red>Falscher Buchtyp-Wert! <dark_red>[<gold>hier schweben<dark_red>]'
    equip_slot: '%prefix% <red>Falscher Ausrüstungsplatzwert! <dark_red>[<gold>hier schweben<dark_red>]'
    banner_pattern: '%prefix% <red>Falscher Musterwert! <dark_red>[<gold>hier schweben<dark_red>]'
    color: '%prefix% <red>Falscher Farbwert! <dark_red>[<gold>hier schweben<dark_red>]'
    mob_type: '%prefix% <red>Falscher Eiertyp-Wert! <dark_red>[<gold>hier schweben<dark_red>]'
    trim_material: '%prefix% <red>Falscher Rüstungsbesatz, Materialwert! <dark_red>[<gold>hier schweben<dark_red>]'
    tropical_fish_pattern: '%prefix% <red>Falscher Musterwert! <dark_red>[<gold>hier schweben<dark_red>]'
    trim_pattern: '%prefix% <red>Falscher Rüstungsbesatzmusterwert! <dark_red>[<gold>hier schweben<dark_red>]'
    boolean: '%prefix% <red>Falscher boolescher Wert! <dark_red>[<gold>hier schweben<dark_red>]'
    attribute: '%prefix% <red>Falscher Attributwert! <dark_red>[<gold>hier schweben<dark_red>]'
    operation: '%prefix% <red>Falscher Betriebswert! <dark_red>[<gold>hier schweben<dark_red>]'
    itemrarity: '%prefix% <red>Falscher Seltenheitswert! <dark_red>[<gold>hier schweben<dark_red>]'
    entitytype: '%prefix% <red>Falscher EntityType-Wert! <dark_red>[<gold>hier schweben<dark_red>]'
    entitygroups: '%prefix% <red>Falscher EntityGroup-Wert! <dark_red>[<gold>hier schweben<dark_red>]'
    consumable_effect: '%prefix% <red>Falscher Verbrauchseffektwert! <dark_red>[<gold>hier schweben<dark_red>]'
    goat_horn_sound: '%prefix% <red>Falscher Klangwert des Ziegenhorns! <dark_red>[<gold>hier schweben<dark_red>]'
    error-pre-hover: '<gradient:#A78BFA:gold><b>Aliase:</b></gradient>'
    first_color: '<aqua>'
    second_color: '<yellow>'
itemedit:
  amount:
    description:
      - '<gradient:#A78BFA:gold><b>Betrag festlegen</b></gradient>'
      - ''
      - '<gray><yellow><amount> </yellow>Einzustellender Betrag (bis zu 127)'
      - '<gold><b>Tipp</b></gold> <gray>Negative Beträge werden abgezogen'
      - '<gray> vom aktuellen Artikelbetrag'
    params: '<amount>'
    feedback: '%prefix% <green>Artikelmenge auf <yellow>%amount% gesetzt'
    feedback-decrease: '%prefix% <green>Gegenstandsmenge um <yellow>%amount% verringert'
  attribute:
    description:
      - '<gradient:#A78BFA:gold><b>Attributmodifikatoren bearbeiten</b></gradient>'
      - ''
      - '<gray><yellow>Add <attribute> <amount> [operation] [slot] </yellow><dark_gray>»</dark_gray> neue Modifikatoren hinzufügen'
      - '<gray><yellow>Remove <attribute/slot> </yellow><dark_gray>»</dark_gray> entfernt einige Modifikatoren'
    params: '<add/remove> [...]'
    add:
      params: '<attribute> <amount> [operation] [slot]'
      description:
        - '<gradient:#A78BFA:gold><b>Attributmodifikator hinzufügen</b></gradient>'
        - ''
        - '<gray><yellow><attribute> </yellow>Attributtyp'
        - '<gray><yellow><amount> </yellow>einzustellender Betrag'
        - '<gray><yellow>[operation] </yellow>wie der Modifikator hinzugefügt wird, standardmäßig Summen'
        - '<gray><yellow>[slot] </yellow>wende diesen Modifikator nur an, wenn das Element ausgewählt ist'
        - '<gray> Ausrüstungsplatz oder ein beliebiger Ausrüstungsplatz, falls nicht ausgewählt'
      feedback: '%prefix% <green>Modifikator hinzugefügt'
    remove:
      params: '<attribute/slot>'
      description:
        - '<gradient:#A78BFA:gold><b>Modifikatoren entfernen</b></gradient>'
        - ''
        - '<gray><yellow><attribute/slot> </yellow>Geben Sie zum Entfernen alle Modifikatoren mit ein'
        - '<gray> ausgewählte Werte werden entfernt'
      feedback-attribute: '%prefix% <green>Attributmodifikatoren entfernt'
      feedback-equipment: '%prefix% <green>Modifikatoren des Ausrüstungsplatzes entfernt'
  axolotlvariant:
    description:
      - '<gradient:#A78BFA:gold><b>Axolotl-Variante auf Axolotl-Eimer bearbeiten</b></gradient>'
      - '<white><sprite:items:item/axolotl_bucket>'
      - '<gray><yellow><type> </yellow>die Art von Axolotl'
    params: '<type>'
    feedback: '%prefix% <green>Axolotl-Variante in <yellow>%variant% geändert'
  banner:
    description:
      - '<gradient:#A78BFA:gold><b>Banner bearbeiten</b></gradient>'
    params: '<add/set/remove/color> [...]'
    set:
      params: '<type> <color> <line>'
      description:
        - '<gradient:#A78BFA:gold><b>Ersetzen Sie das Muster in der ausgewählten Zeile</b></gradient>'
      feedback: '%prefix% <green>Mustersatz'
    add:
      params: '<type> <color>'
      description:
        - '<gradient:#A78BFA:gold><b>Ein Muster hinzufügen</b></gradient>'
      feedback: '%prefix% <green>Muster hinzugefügt'
    remove:
      params: '<line>'
      description:
        - '<gradient:#A78BFA:gold><b>Muster auf ausgewählter Linie entfernen</b></gradient>'
      feedback: '%prefix% <green>Muster entfernt'
    color:
      params: '<line> <color>'
      description:
        - '<gradient:#A78BFA:gold><b>Musterfarbe auf ausgewählter Linie ändern</b></gradient>'
      feedback: '%prefix% <green>Muster neu eingefärbt'
  bookauthor:
    description:
      - '<gradient:#A78BFA:gold><b>Autor festlegen</b></gradient>'
      - '<white><sprite:items:item/written_book>'
      - '<gray>Autorenname kann Leerzeichen enthalten und auch farbig sein'
      - '<gray>Funktioniert nur bei schriftlichen Büchern'
    params: '<name>'
    feedback: '%prefix% <green>Aktualisierter Buchautor'
    feedback-reset: '%prefix% <green>Buchautor zurücksetzen'
  bookenchant:
    description:
      - '<gradient:#A78BFA:gold><b>Lege Verzauberungen auf das Buch</b></gradient>'
      - '<white><sprite:items:item/enchanted_book> <sprite:items:item/book>'
      - '<gray>Der Unterschied zwischen enchant und bookenchant ist dieser'
      - '<gray>ein Buch mit enchant Feueraspekt setzt Ziele in Brand, wenn sie getroffen werden'
      - '<gray>während ein Buch mit bookenchant dies nicht tut'
      - ''
      - '<gray><yellow><enchant> </yellow>Verzauberungstyp'
      - '<gray><yellow>[level] </yellow>Stufe der Verzauberung, standardmäßig <yellow>1'
      - ''
      - '<gold><b>Tipp</b></gold> <gray>Setzen Sie <yellow>[level] </yellow>auf <yellow>0 </yellow>um eine Verzauberung zu entfernen'
    params: '<enchant> [level]'
    feedback-removed: '%prefix% <green>Buchverzauberung entfernt <yellow>%enchant%'
    feedback: '%prefix% <green>Angewandte Buchverzauberung <yellow>%enchant% <green>lv <yellow>%lv%'
  booktype:
    description:
      - '<gradient:#A78BFA:gold><b>Buchtyp festlegen</b></gradient>'
      - '<white><sprite:items:item/written_book>'
      - '<gray>Funktioniert nur bei schriftlichen Büchern'
    params: '<booktype>'
    feedback: '%prefix% <green>Aktualisierte Buchgeneration auf <yellow>%generation%'
    feedback-reset: '%prefix% <green>Buchgenerierung zurücksetzen'
  color:
    description:
      - '<gradient:#A78BFA:gold><b>Farbe einstellen</b></gradient>'
      - '<white><sprite:items:item/potion> <sprite:items:item/tipped_arrow_base> <sprite:items:item/firework_star> <sprite:items:item/leather_chestplate>'
      - '<gray>Funktioniert auch auf Lederrüstungen und Feuerwerkssternen, Tränken und Pfeilen mit Trankeffekten!'
      - '<gray><yellow>[red] [green] [blue] </yellow>sind die Menge jeder Farbe, die kombiniert werden soll'
      - '<gray>Jede Farbe ist ein int-Wert zwischen 0 und 255'
      - '<gray>Wenn Sie verwirrt sind, googeln Sie „<yellow>RGB-Farbauswahl</yellow>“'
    params: '[red] [green] [blue]'
    feedback: '%prefix% <green>Farbe aktualisiert'
  compass:
    description:
      - '<gradient:#A78BFA:gold><b>Kompass-Zielposition festlegen</b></gradient>'
      - '<white><sprite:items:item/compass_00>'
      - '<gray><yellow>Set </yellow><dark_gray>»</dark_gray> Legen Sie Ihren Standort als Kompassziel fest'
      - '<gray><yellow>Clear </yellow><dark_gray>»</dark_gray> klares Kompassziel'
    params: '<set/clear>'
    set:
      feedback: '%prefix% <green>Der Kompass zeigt jetzt auf <yellow>%world% %x% %y% %z%'
    clear:
      feedback: '%prefix% <green>Kompassziel gelöscht'
  custommodeldata:
    description:
      - '<gradient:#A78BFA:gold><b>Benutzerdefinierte Modelldaten bearbeiten</b></gradient>'
      - ''
      - '<gray>Wird für Texturpakete verwendet'
      - '<gray><yellow>[value] </yellow>positiver Int des Zieldatenmodells'
      - '<gray>Hinweis: Moderne Server verwenden itemmodel anstelle von custommodeldata'
      - '<gray> für Texturen, dieser Befehl ist für ältere Clients'
    params: '<value>'
    feedback: '%prefix% <green>Benutzerdefinierte Modelldaten aktualisiert'
    feedback-reset: '%prefix% <green>Benutzerdefiniertes Modelldaten-Reset'
  damage:
    description:
      - '<gradient:#A78BFA:gold><b>Haltbarkeit bearbeiten</b></gradient>'
      - ''
      - '<gray><yellow><durability> </yellow>Schaden gilt'
      - '<gray><gold>Hinweis</gold> <yellow>0 </yellow>bedeutet keine Schäden, volle Haltbarkeit'
    params: '<durability>'
    feedback-reset: '%prefix% <green>Haltbarkeit wiederhergestellt'
    feedback: '%prefix% <green>Haltbarkeit aktualisiert'
  equipment:
    description:
      - '<gradient:#A78BFA:gold><b>Setzt die Ausrüstungseigenschaft des Artikels</b></gradient>'
      - ''
      - '<gray><gold><b>Tipp</b></gold> Verwenden Sie /itemequip or /iee'
      - '<gray><gold>Hinweis</gold> Ihre Getränke dürfen nicht gegessen werden'
    params: ''
  enchant:
    description:
      - '<gradient:#A78BFA:gold><b>Setze Verzauberungen</b></gradient>'
      - ''
      - '<gray><yellow><enchant> </yellow>Verzauberungstyp'
      - '<gray><yellow>[level] </yellow>Stufe der Verzauberung, standardmäßig <yellow>1'
      - ''
      - '<gold><b>Tipp</b></gold> <gray>Setzen Sie <yellow>[level] </yellow>auf <yellow>0 </yellow>um eine Verzauberung zu entfernen'
    params: '<enchant> [level]'
    feedback-removed: '%prefix% <green>Verzauberung entfernt <yellow>%enchant%'
    feedback: '%prefix% <green>Angewandte Verzauberung <yellow>%enchant% <green>lv <yellow>%lv%'
  fireresistent:
    description:
      - '<gradient:#A78BFA:gold><b>Gegenstandswiderstand gegen Feuer/Lava einstellen</b></gradient>'
      - ''
      - '<gray><yellow>[true/false] </yellow>Stellen Sie den Wert ein, standardmäßig umschalten'
      - ''
      - '<gray>Ein Gegenstand mit Feuerwiderstand wird nicht zerstört'
      - '<gray> wenn es ins Feuer fällt und über Lava schwebt'
    params: '[true/false]'
    feedback: '%prefix% <green>Feuerwiderstand auf <yellow>%value% eingestellt'
  fireworkpower:
    description:
      - '<gradient:#A78BFA:gold><b>Feuerwerksstärke einstellen</b></gradient>'
      - '<white><sprite:items:item/firework_rocket>'
      - '<gray><yellow><power> </yellow>Kraft des Feuerwerks, ein Wert zwischen <yellow>0 </yellow>und <yellow>5'
    params: '<power>'
    feedback: '%prefix% <green>Aktualisierte Feuerwerkskraft'
  firework:
    description:
      - '<gradient:#A78BFA:gold><b>Feuerwerk mit einer GUI bearbeiten</b></gradient>'
      - '<white><sprite:items:item/firework_rocket>'
    params: ''
  food:
    description:
      - '<gradient:#A78BFA:gold><b>Legt die Lebensmitteleigenschaft des Artikels fest</b></gradient>'
      - ''
      - '<gray><gold><b>Tipp</b></gold> Verwenden Sie /itemfood or /if'
      - '<gray><gold>Hinweis</gold> Ihre Getränke dürfen nicht gegessen werden'
    params: ''
  glider:
    description:
      - '<gradient:#A78BFA:gold><b>Glider-Status festlegen</b></gradient>'
      - ''
      - '<gray>Der Gleitergegenstand sollte ein Gleiten wie auf Flügeldecken ermöglichen'
      - '<gray><yellow>[true/false] </yellow>Gleiterwert einstellen, standardmäßig umschalten'
    params: '[true/false]'
    feedback: '%prefix% <green>Gleiten wurde auf <yellow>%value% eingestellt.'
  glow:
    description:
      - '<gradient:#A78BFA:gold><b>Verzauberungs-Glüheffekt außer Kraft setzen</b></gradient>'
      - ''
      - '<gray><yellow>[true/false] </yellow>Stellen Sie den Wert ein, standardmäßig zurückgesetzt'
      - ''
      - '<gold><b>Tipp</b></gold> <gray><yellow>kein Wert angegeben </yellow>Vanilla-Verhalten wiederherstellen'
    params: '[true/false/default]'
    feedback: '%prefix% <green>Glühen auf <yellow>%value% eingestellt'
    feedback-reset: '%prefix% <green>Glühwert auf Standard zurücksetzen'
  goathornsound:
    description:
      - '<gradient:#A78BFA:gold><b>Ziegenhorn-Sound einstellen</b></gradient>'
      - '<white><sprite:items:item/goat_horn>'
      - '<gray><yellow><type> </yellow>die Art des Tons'
    params: '<type>'
    feedback: '%prefix% <green>Aktualisierter Sound'
  hide:
    description:
      - '<gradient:#A78BFA:gold><b>Komponenten ein- oder ausblenden</b></gradient>'
      - ''
      - '<gray><yellow><flag> </yellow>Elementmarkierung zum Bearbeiten'
      - '<gray><yellow>[true/false] </yellow>Legen Sie den Flag-Wert fest, standardmäßig umschalten'
      - ''
      - '<gold><b>Tipp</b></gold> <gray>Bannermuster mit der Flagge potion_effects ausblenden'
      - '<gold><b>Tipp</b></gold> <gray>Alle Flaggen auf einmal ausblenden mit <yellow>/itemedit hideall'
    params: '<flag> [true/false]'
    feedback: '%prefix% <green>Flag ist jetzt <yellow>%value%'
  hidetooltip:
    description:
      - '<gradient:#A78BFA:gold><b>Tooltips ein- oder ausblenden</b></gradient>'
      - ''
      - '<gray><yellow>[true/false] </yellow>Legen Sie den Flag-Wert fest, standardmäßig umschalten'
    params: '[true/false]'
    feedback: '%prefix% <green>Der versteckte Tooltip-Status ist jetzt <yellow>%value%'
  hideall:
    description:
      - '<gradient:#A78BFA:gold><b>Alle Komponenten ausblenden</b></gradient>'
      - ''
      - '<gray>Versteckt: Verzauberungen, Trankeffekte, Bannerebenen, Attribute ...'
      - ''
      - '<gold><b>Tipp</b></gold> <gray>einzelne Komponenten ausblenden mit <yellow>/itemedit hide <flag> true'
    params: ''
    feedback: '%prefix% <green>Alle Flaggen ausgeblendet'
  itemmodel:
    description:
      - '<gradient:#A78BFA:gold><b>Artikelmodell bearbeiten</b></gradient>'
      - ''
      - '<gray><yellow><namespaced key> </yellow>Taste zum Festlegen der Texturreferenz'
      - '<gray>Beispiel: /ie itemmodel <yellow>iron_sword'
      - '<gray>Beispiel: /ie itemmodel <yellow>minecraft:iron_sword'
      - ''
      - '<gray><yellow><namespace></yellow>:<yellow><id></yellow> wird Referenzmodell sein:'
      - '  /assets/<yellow><namespace></yellow>/models/item/<yellow><id>'
    params: '<namespaced key>'
    feedback: '%prefix% <green>Aktualisiertes Artikelmodell'
    feedback-reset: '%prefix% <green>Artikelmodell zurücksetzen'
  kinetic:
    description:
      - '<gradient:#A78BFA:gold><b>Legt die kinetische Eigenschaft des Gegenstands fest</b></gradient>'
      - '<white><sprite:items:item/iron_spear>'
      - '<gray><gold><b>Tipp</b></gold> Verwenden Sie /itemkinetic or /iek'
    params: ''
  maxdurability:
    description:
      - '<gradient:#A78BFA:gold><b>Legt die maximale Haltbarkeit des Gegenstands fest</b></gradient>'
      - ''
      - '<gray><yellow><max durability> </yellow>Artikel neuer Haltbarkeitswert,'
      - '<gray> muss größer als 1 sein'
    params: '<max durability>'
    feedback: '%prefix% <green>Maximale Haltbarkeit auf <yellow>%value% aktualisiert'
  maxstacksize:
    description:
      - '<gradient:#A78BFA:gold><b>Legt die maximale Stapelgröße des Gegenstands fest</b></gradient>'
      - ''
      - '<gray><yellow>[1-99] </yellow>Setzen Sie den Flag-Wert'
      - ''
      - '<gray><yellow>kein Wert </yellow>stellt die gemeinsame Stapelgröße wieder her, die <yellow>64 beträgt'
      - '<gray> für die meisten Gegenstände, <yellow>1</yellow> für Rüstungen und Werkzeuge und andere'
      - '<gray> Werte für einige Artikel'
    params: '[1-99]'
    feedback: '%prefix% <green>Maximale Stapelgröße auf <yellow>%value% aktualisiert'
    feedback-reset: '%prefix% <green>Maximale Stapelgröße zurücksetzen'
  pierce:
    description:
      - '<gradient:#A78BFA:gold><b>Legen Sie die Eigenschaften der durchdringenden Waffe des Gegenstands fest</b></gradient>'
      - '<white><sprite:items:item/iron_spear>'
      - '<gold><b>Tipp</b></gold><gray> Verwenden Sie /itempiercing or /iep'
    params: ''
  potioneffect:
    itemtag-tip: '%prefix% <gray>Müssen Sie gewöhnlichen Gegenständen Trankeffekte hinzufügen? Versuchen Sie es mit >ItemTag<'
    itemtag-tip-hover:
      - '<gradient:#A78BFA:gold>Klick mich</gradient>'
    description:
      - '<gradient:#A78BFA:gold><b>Trankeffekte bearbeiten</b></gradient>'
      - '<white><sprite:items:item/potion> <sprite:items:item/suspicious_stew> <sprite:items:item/tipped_arrow_base>'
      - '<gray>Funktioniert mit jedem Trank, Pfeilen mit Trankeffekten und verdächtigem Eintopf!'
      - '<gray><yellow>Add <effect> <duration> [level] </yellow><dark_gray>»</dark_gray> Effekt hinzufügen'
      - '<gray><yellow>Remove <effect> </yellow><dark_gray>»</dark_gray> entfernt den ausgewählten Effekt'
