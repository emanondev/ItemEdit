itemedit:
  amount:
    description:
      - '<gradient:#A78BFA:gold><b>Tutar ayarla</b></gradient>'
      - ''
      - '<gray><yellow><amount> </yellow>ayarlanacak miktar (127''ye kadar)'
      - '<gold><b>İpucu</b></gold> <gray>Negatif tutarlar çıkarılır'
      - '<gray> öğenin mevcut tutarından'
    params: '<amount>'
    feedback: '%prefix% <green>Eşya miktarı <yellow>%amount% olarak ayarlandı'
    feedback-decrease: '%prefix% <green>Eşya miktarı <yellow>%amount% azaldı'
  attribute:
    description:
      - '<gradient:#A78BFA:gold><b>Özellik değiştiricileri düzenle</b></gradient>'
      - ''
      - '<gray><yellow>Add <attribute> <amount> [operation] [slot] </yellow><dark_gray>»</dark_gray> yeni değiştiriciler ekle'
      - '<gray><yellow>Remove <attribute/slot> </yellow><dark_gray>»</dark_gray> bazı değiştiricileri kaldırır'
    params: '<add/remove> [...]'
    add:
      params: '<attribute> <amount> [operation] [slot]'
      description:
        - '<gradient:#A78BFA:gold><b>Özellik değiştirici ekle</b></gradient>'
        - ''
        - '<gray><yellow><attribute> </yellow>özellik türü'
        - '<gray><yellow><amount> </yellow>ayarlanacak tutar'
        - '<gray><yellow>[operation] </yellow>varsayılan toplamlar olarak değiştiricinin nasıl eklendiği'
        - '<gray><yellow>[slot] </yellow>bu değiştiriciyi yalnızca öğe seçiliyken uygula'
        - '<gray> ekipman yuvası veya seçilmemişse herhangi bir ekipman yuvası'
      feedback: '%prefix% <green>Değiştirici eklendi'
    remove:
      params: '<attribute/slot>'
      description:
        - '<gradient:#A78BFA:gold><b>Değiştiricileri kaldır</b></gradient>'
        - ''
        - '<gray><yellow><attribute/slot> </yellow>kaldırmak için yazın, tüm değiştiriciler'
        - '<gray> seçilen değer kaldırıldı'
      feedback-attribute: '%prefix% <green>Özellik değiştiricileri kaldırıldı'
      feedback-equipment: '%prefix% <green>Ekipman yuvasının değiştiricileri kaldırıldı'
  axolotlvariant:
    description:
      - '<gradient:#A78BFA:gold><b>Axolotl kovasındaki Axolotl Varyantını düzenleyin</b></gradient>'
      - '<white><sprite:items:item/axolotl_bucket>'
      - '<gray><yellow><type> </yellow>aksolotl türü'
    params: '<type>'
    feedback: '%prefix% <green>Axolotl çeşidi <yellow>%variant% olarak değiştirildi'
  banner:
    description:
      - '<gradient:#A78BFA:gold><b>Banner''ı düzenle</b></gradient>'
    params: '<add/set/remove/color> [...]'
    set:
      params: '<type> <color> <line>'
      description:
        - '<gradient:#A78BFA:gold><b>Deseni seçilen satıra yerleştirin</b></gradient>'
      feedback: '%prefix% <green>Desen seti'
    add:
      params: '<type> <color>'
      description:
        - '<gradient:#A78BFA:gold><b>Desen ekle</b></gradient>'
      feedback: '%prefix% <green>Desen eklendi'
    remove:
      params: '<line>'
      description:
        - '<gradient:#A78BFA:gold><b>Seçili satırdaki deseni kaldır</b></gradient>'
      feedback: '%prefix% <green>Desen kaldırıldı'
    color:
      params: '<line> <color>'
      description:
        - '<gradient:#A78BFA:gold><b>Seçilen çizgideki desen rengini değiştir</b></gradient>'
      feedback: '%prefix% <green>Desen yeniden renklendirildi'
  bookauthor:
    description:
      - '<gradient:#A78BFA:gold><b>Yazarı ayarla</b></gradient>'
      - '<white><sprite:items:item/written_book>'
      - '<gray>Yazar adı boşluk içerebilir ve renkli de olabilir'
      - '<gray>Yalnızca Yazılı kitaplarda çalışır'
    params: '<name>'
    feedback: '%prefix% <green>Kitap yazarı güncellendi'
    feedback-reset: '%prefix% <green>Kitap yazarını sıfırla'
  bookenchant:
    description:
      - '<gradient:#A78BFA:gold><b>Kitaptaki büyüleri ayarlayın</b></gradient>'
      - '<white><sprite:items:item/enchanted_book> <sprite:items:item/book>'
      - '<gray>enchant ile bookenchant arasındaki fark şudur:'
      - '<gray> enchant ateş özelliğine sahip bir kitap, vurulduğunda hedefleri ateşe verir'
      - '<gray> iken bookenchant olan bir kitap bunu yapmaz'
      - ''
      - '<gray><yellow><enchant> </yellow>büyü türü'
      - '<gray><yellow>[level] </yellow>Büyü seviyesi, varsayılan olarak <yellow>1'
      - ''
      - '<gold><b>İpucu</b></gold> <gray>Bir büyüyü kaldırmak için <yellow>[level] </yellow>''yi <yellow>0 </yellow> olarak ayarlayın'
    params: '<enchant> [level]'
    feedback-removed: '%prefix% <green>Kitap büyüsü kaldırıldı <yellow>%enchant%'
    feedback: '%prefix% <green>Uygulamalı kitap büyüsü <yellow>%enchant% <green>lv <yellow>%lv%'
  booktype:
    description:
      - '<gradient:#A78BFA:gold><b>Kitap türünü ayarla</b></gradient>'
      - '<white><sprite:items:item/written_book>'
      - '<gray>Yalnızca Yazılı kitaplarda çalışır'
    params: '<booktype>'
    feedback: '%prefix% <green>Kitap oluşturma işlemi <yellow>%generation% olarak güncellendi'
    feedback-reset: '%prefix% <green>Kitap oluşturmayı sıfırla'
  color:
    description:
      - '<gradient:#A78BFA:gold><b>Rengi ayarla</b></gradient>'
      - '<white><sprite:items:item/potion> <sprite:items:item/tipped_arrow_base> <sprite:items:item/firework_star> <sprite:items:item/leather_chestplate>'
      - '<gray>İksir efektli deri zırh ve havai fişek yıldızları, iksirler ve oklar üzerinde de çalışır!'
      - '<gray><yellow>[red] [green] [blue] </yellow>birleştirilecek her rengin miktarıdır'
      - '<gray>Her renk 0 ile 255 arasında bir int değeridir'
      - '<gray>Kafanız karıştıysa Google''da "<yellow>RGB renk seçici</yellow>"'
    params: '[red] [green] [blue]'
    feedback: '%prefix% <green>Renk güncellendi'
  compass:
    description:
      - '<gradient:#A78BFA:gold><b>Pusula hedef konumunu ayarlayın</b></gradient>'
      - '<white><sprite:items:item/compass_00>'
      - '<gray><yellow>Set </yellow><dark_gray>»</dark_gray> konumunuzu pusula hedefi olarak ayarlayın'
      - '<gray><yellow>Clear </yellow><dark_gray>»</dark_gray> pusula hedefini temizle'
    params: '<set/clear>'
    set:
      feedback: '%prefix% <green>Pusula artık <yellow>%world% %x% %y% %z%''yi gösteriyor'
    clear:
      feedback: '%prefix% <green>Pusula hedefi temizlendi'
  custommodeldata:
    description:
      - '<gradient:#A78BFA:gold><b>Özel model verilerini düzenleyin</b></gradient>'
      - ''
      - '<gray>Doku paketleri için kullanılır'
      - '<gray><yellow>[value] </yellow>hedef veri modelinin pozitif int''si'
      - '<gray>Not: modern sunucular kullanılır itemmodel yerine custommodeldata'
      - '<gray> dokular için, bu komut eski istemciler içindir'
    params: '<value>'
    feedback: '%prefix% <green>Özel model verileri güncellendi'
    feedback-reset: '%prefix% <green>Özel model verileri sıfırlama'
  damage:
    description:
      - '<gradient:#A78BFA:gold><b>Dayanıklılığı düzenle</b></gradient>'
      - ''
      - '<gray><yellow><durability> </yellow>uygulanacak hasar'
      - '<gray><gold>N.B.</gold> <yellow>0 </yellow>hasar yok, tam dayanıklılık anlamına gelir'
    params: '<durability>'
    feedback-reset: '%prefix% <green>Dayanıklılık yenilendi'
    feedback: '%prefix% <green>Dayanıklılık güncellendi'
  equipment:
    description:
      - '<gradient:#A78BFA:gold><b>Öğenin Ekipman özelliğini ayarlar</b></gradient>'
      - ''
      - '<gray><gold><b>İpucu</b></gold> /itemequip or /iee''yi kullanın'
      - '<gray><gold>N.B.</gold> içilebilir eşyalarınız yenemez'
    params: ''
  enchant:
    description:
      - '<gradient:#A78BFA:gold><b>Büyüleri ayarla</b></gradient>'
      - ''
      - '<gray><yellow><enchant> </yellow>büyü türü'
      - '<gray><yellow>[level] </yellow>Büyü seviyesi, varsayılan olarak <yellow>1'
      - ''
      - '<gold><b>İpucu</b></gold> <gray>Bir büyüyü kaldırmak için <yellow>[level] </yellow>''yi <yellow>0 </yellow> olarak ayarlayın'
    params: '<enchant> [level]'
    feedback-removed: '%prefix% <green>Büyü kaldırıldı <yellow>%enchant%'
    feedback: '%prefix% <green>Uygulanan büyü <yellow>%enchant% <green>lv <yellow>%lv%'
  fireresistent:
    description:
      - '<gradient:#A78BFA:gold><b>Eşyanın yangına/lava karşı direncini ayarlayın</b></gradient>'
      - ''
      - '<gray><yellow>[true/false] </yellow>değeri ayarlayın, varsayılan olarak geçiş yapın'
      - ''
      - '<gray>Yangına dayanıklı bir eşya yok olmaz'
      - '<gray> ateşe düştüğünde ve lavın üzerinde yüzdüğünde'
    params: '[true/false]'
    feedback: '%prefix% <green>Yangın direnci <yellow>%value% olarak ayarlandı'
  fireworkpower:
    description:
      - '<gradient:#A78BFA:gold><b>Havai fişek gücünü ayarla</b></gradient>'
      - '<white><sprite:items:item/firework_rocket>'
      - '<gray><yellow><power> </yellow>havai fişek gücü, <yellow>0 </yellow> ile <yellow>5 arasında bir değer'
    params: '<power>'
    feedback: '%prefix% <green>Havai fişek gücü güncellendi'
  firework:
    description:
      - '<gradient:#A78BFA:gold><b>GUI ile havai fişekleri düzenleyin</b></gradient>'
      - '<white><sprite:items:item/firework_rocket>'
    params: ''
  food:
    description:
      - '<gradient:#A78BFA:gold><b>Ögenin yiyecek özelliğini ayarlar</b></gradient>'
      - ''
      - '<gray><gold><b>İpucu</b></gold> /itemfood or /if''yi kullanın'
      - '<gray><gold>N.B.</gold> içilebilir eşyalarınız yenemez'
    params: ''
  glider:
    description:
      - '<gradient:#A78BFA:gold><b> Planör durumunu ayarla</b></gradient>'
      - ''
      - '<gray>Planör öğesi elytralardaki gibi kaymaya izin vermeli'
      - '<gray><yellow>[true/false] </yellow>planör değerini ayarla, varsayılan olarak geçiş yap'
    params: '[true/false]'
    feedback: '%prefix% <green>Kayma ayarı <yellow>%value% olarak güncellendi'
  glow:
    description:
      - '<gradient:#A78BFA:gold><b>Büyü parlama efektini geçersiz kıl</b></gradient>'
      - ''
      - '<gray><yellow>[true/false] </yellow>değeri ayarlayın, varsayılan olarak sıfırlayın'
      - ''
