    params: '[true/false/default]'
    feedback: '%prefix% <green>Işıma <yellow>%value% olarak ayarlandı'
    feedback-reset: '%prefix% <green>Işıma değerini varsayılana sıfırla'
  goathornsound:
    description:
      - '<gradient:#A78BFA:gold><b>Keçi Boynuzu sesini ayarla</b></gradient>'
      - '<white><sprite:items:item/goat_horn>'
