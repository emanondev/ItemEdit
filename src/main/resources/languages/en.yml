generic:
  help:
    player-only: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <red>Command for Players only'
    no-item-on-hand: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <red>You need to hold an item in hand'
    lack-permission: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <red>You lack of permission %permission%'
    lack-permission-generic: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <red>You don''t have permission to use this command'
    blocked-by-censure: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <red>You can''t use this text, it contains blocked words'
    blocked-by-type-restriction: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <red>You can''t rename this item'
    blocked-by-type-restriction-lore: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <red>You can''t edit lore on this item'
    blocked-by-lore-line-limit: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <red>You can''t add more lore lines on this item'
    blocked-by-lore-length-limit: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <red>You can''t set lines longer than %limit% chars'
    blocked-by-rename-length-limit: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <red>You can''t set names longer than %limit% chars'

    prefix: "<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray>"
    header-format: "<gradient:#54acff:#A78BFA><bold>%header%</bold></gradient> <dark_gray>»</dark_gray> <#A78BFA><bold>Help</bold></#A78BFA>"
    header-sub-format: "<gradient:#54acff:#A78BFA><bold>%header%</bold></gradient> <dark_gray>»</dark_gray> <gradient:#A78BFA:#54acff><bold>%sub%</bold></gradient> <dark_gray>»</dark_gray> <#55d6ff><bold>Help</#55d6ff>"
    command-format: "<gray>/%command%</gray> <#bad1ff>%sub%</#bad1ff> <#d7bbff>%params%</#d7bbff>"
    footer-format: "%prev_clickable% <#7E9CFD><b>Help</b> [%page%/%max_page%]</#7E9CFD> %next_clickable%"
    next_text: " <light_purple><b>><st>> ></st> "
    prev_text: " <light_purple><b><st>< <</st>< "
    next_void: " <dark_gray><b>><st>> ></st> "
    prev_void: " <dark_gray><b><st>< <</st>< "
    next_hover: "<gold><b>Go to page %target%"
    prev_hover: "<gold><b>Go to page %target%"
    description:
      - '<gold><b>Shows help</b>'
      - ''
      - '<gray><yellow>[page] </yellow>help page'
      - '<gray><yellow>[subcommand] </yellow>help for subcommand'
    params: '[page/subcommand]'

  wrong-material:
    axolotl_bucket: '%prefix% <red>Item must be a axolotl bucket'
    banner: '%prefix% <red>Item must be a banner'
    damageable: '%prefix% <red>Item must have a durability like tools and armors'
    player_head: '%prefix% <red>Item must be a player head'
    rgb_colorable: '%prefix% <red>Item must be colorable type like leather armors, firework stars, potions or tipped arrows'
    written_book: '%prefix% <red>Item must be a written book'
    potion_effect_applicable: '%prefix% <red>Item must be a potion or a tipped arrow or a suspicious stew'
    firework: '%prefix% <red>Item must be a firework'
    spawner_egg: '%prefix% <red>Item must be a spawner egg'
    tropical_fish_bucket: '%prefix% <red>Item must be a tropical fish bucket'
    writable_book: '%prefix% <red>Item must be a written book or book and quill'
    compass: '%prefix% <red>Item must be a compass'
    music_instrument: '%prefix% <red>Item must be a goat horn'
    armor: '%prefix% <red>Item must be an armor'
    enchantment_storage: '%prefix% <red>Item must be a book or enchanted book'
  wrong-alias:
    axolotl_variant: '%prefix% <red>Wrong Axolotl Value! <dark_red>[<gold>hover here<dark_red>]'
    potion_effect: '%prefix% <red>Wrong Effect Value! <dark_red>[<gold>hover here<dark_red>]'
    animations: '%prefix% <red>Wrong Animation Value! <dark_red>[<gold>hover here<dark_red>]'
    sound: '%prefix% <red>Wrong Sound Value! <dark_red>[<gold>hover here<dark_red>]'
    enchant: '%prefix% <red>Wrong Enchant Value! <dark_red>[<gold>hover here<dark_red>]'
    flag_type: '%prefix% <red>Wrong Flag Value! <dark_red>[<gold>hover here<dark_red>]'
    book_type: '%prefix% <red>Wrong Book type Value! <dark_red>[<gold>hover here<dark_red>]'
    equip_slot: '%prefix% <red>Wrong Equipment Slot Value! <dark_red>[<gold>hover here<dark_red>]'
    banner_pattern: '%prefix% <red>Wrong Pattern Value! <dark_red>[<gold>hover here<dark_red>]'
    color: '%prefix% <red>Wrong Color Value! <dark_red>[<gold>hover here<dark_red>]'
    mob_type: '%prefix% <red>Wrong Egg type Value! <dark_red>[<gold>hover here<dark_red>]'
    trim_material: '%prefix% <red>Wrong Trim Material Value! <dark_red>[<gold>hover here<dark_red>]'
    tropical_fish_pattern: '%prefix% <red>Wrong Pattern Value! <dark_red>[<gold>hover here<dark_red>]'
    trim_pattern: '%prefix% <red>Wrong Trim Pattern Value! <dark_red>[<gold>hover here<dark_red>]'
    boolean: '%prefix% <red>Wrong Boolean Value! <dark_red>[<gold>hover here<dark_red>]'
    attribute: '%prefix% <red>Wrong Attribute Value! <dark_red>[<gold>hover here<dark_red>]'
    operation: '%prefix% <red>Wrong Operation Value! <dark_red>[<gold>hover here<dark_red>]'
    itemrarity: '%prefix% <red>Wrong Rarity Value! <dark_red>[<gold>hover here<dark_red>]'
    entitytype: '%prefix% <red>Wrong EntityType Value! <dark_red>[<gold>hover here<dark_red>]'
    entitygroups: '%prefix% <red>Wrong EntityGroup Value! <dark_red>[<gold>hover here<dark_red>]'
    consumable_effect: '%prefix% <red>Wrong Consumable Effect Value! <dark_red>[<gold>hover here<dark_red>]'
    goat_horn_sound: '%prefix% <red>Wrong Goat Horn Sound Value! <dark_red>[<gold>hover here<dark_red>]'
    error-pre-hover: '<gradient:#A78BFA:gold><b>Aliases:</b></gradient>'
    first_color: '<aqua>'
    second_color: '<yellow>'
itemedit:
  amount:
    description:
      - '<gradient:#A78BFA:gold><b>Set amount</b></gradient>'
      - ''
      - '<gray><yellow><amount> </yellow>amount to set (up to 127)'
      - '<gold><b>Tip</b></gold> <gray>Negative amounts are subtracted'
      - '<gray> from item current amount'
    params: '<amount>'
    feedback: '%prefix% <green>Item amount set to <yellow>%amount%'
    feedback-decrease: '%prefix% <green>Item amount decreased by <yellow>%amount%'
  attribute:
    description:
      - '<gradient:#A78BFA:gold><b>Edit attribute modifiers</b></gradient>'
      - ''
      - '<gray><yellow>Add <attribute> <amount> [operation] [slot] </yellow><dark_gray>»</dark_gray> add new modifiers'
      - '<gray><yellow>Remove <attribute/slot> </yellow><dark_gray>»</dark_gray> removes some modifiers'
    params: '<add/remove> [...]'
    add:
      params: '<attribute> <amount> [operation] [slot]'
      description:
        - '<gradient:#A78BFA:gold><b>Add attribute modifier</b></gradient>'
        - ''
        - '<gray><yellow><attribute> </yellow>attribute type'
        - '<gray><yellow><amount> </yellow>amount to set'
        - '<gray><yellow>[operation] </yellow>how the modifier is added, by default sums'
        - '<gray><yellow>[slot] </yellow>apply this modifier only when item is on selected'
        - '<gray>       equipment slot or any equipment slot if not selected'
      feedback: '%prefix% <green>Added modifier'
    remove:
      params: '<attribute/slot>'
      description:
        - '<gradient:#A78BFA:gold><b>Remove modifiers</b></gradient>'
        - ''
        - '<gray><yellow><attribute/slot> </yellow>type to remove, any modifiers with'
        - '<gray>                 selected value are removed'
      feedback-attribute: '%prefix% <green>Removed modifiers of attribute'
      feedback-equipment: '%prefix% <green>Removed modifiers of equipment slot'
  axolotlvariant:
    description:
      - '<gradient:#A78BFA:gold><b>Edit Axolotl Variant on Axolotl bucket</b></gradient>'
      - '<white><sprite:items:item/axolotl_bucket>'
      - '<gray><yellow><type> </yellow>the type of axolotl'
    params: '<type>'
    feedback: '%prefix% <green>Changed Axolotl variant to <yellow>%variant%'
  banner:
    description:
      - '<gradient:#A78BFA:gold><b>Edit banner</b></gradient>'
    params: '<add/set/remove/color> [...]'
    set:
      params: '<type> <color> <line>'
      description:
        - '<gradient:#A78BFA:gold><b>Replace the pattern on selected line</b></gradient>'
      feedback: '%prefix% <green>Pattern set'
    add:
      params: '<type> <color>'
      description:
        - '<gradient:#A78BFA:gold><b>Add a pattern</b></gradient>'
      feedback: '%prefix% <green>Pattern added'
    remove:
      params: '<line>'
      description:
        - '<gradient:#A78BFA:gold><b>Remove pattern on selected line</b></gradient>'
      feedback: '%prefix% <green>Pattern removed'
    color:
      params: '<line> <color>'
      description:
        - '<gradient:#A78BFA:gold><b>Change pattern color on selected line</b></gradient>'
      feedback: '%prefix% <green>Pattern recolored'
  bookauthor:
    description:
      - '<gradient:#A78BFA:gold><b>Set author</b></gradient>'
      - '<white><sprite:items:item/written_book>'
      - '<gray>Author name may contains spaces and be colored too'
      - '<gray>Works only on Written books'
    params: '<name>'
    feedback: '%prefix% <green>Updated book author'
    feedback-reset: '%prefix% <green>Reset book author'
  bookenchant:
    description:
      - '<gradient:#A78BFA:gold><b>Set enchants on the book</b></gradient>'
      - '<white><sprite:items:item/enchanted_book> <sprite:items:item/book>'
      - '<gray>The difference between enchant and bookenchant is that'
      - '<gray>a book with enchant fire aspect sets hit targets on fire'
      - '<gray>while a book with bookenchant doesn''t'
      - ''
      - '<gray><yellow><enchant> </yellow>enchant type'
      - '<gray><yellow>[level] </yellow>level of the enchant, by default <yellow>1'
      - ''
      - '<gold><b>Tip</b></gold> <gray>Set <yellow>[level] </yellow>to <yellow>0 </yellow>to remove an enchant'
    params: '<enchant> [level]'
    feedback-removed: '%prefix% <green>Removed book enchantment <yellow>%enchant%'
    feedback: '%prefix% <green>Applied book enchantment <yellow>%enchant% <green>lv <yellow>%lv%'
  booktype:
    description:
      - '<gradient:#A78BFA:gold><b>Set book type</b></gradient>'
      - '<white><sprite:items:item/written_book>'
      - '<gray>Works only on Written books'
    params: '<booktype>'
    feedback: '%prefix% <green>Updated book generation to <yellow>%generation%'
    feedback-reset: '%prefix% <green>Reset book generation'
  color:
    description:
      - '<gradient:#A78BFA:gold><b>Set color</b></gradient>'
      - '<white><sprite:items:item/potion> <sprite:items:item/tipped_arrow_base> <sprite:items:item/firework_star> <sprite:items:item/leather_chestplate>'
      - '<gray>Works on leather armor and firework stars, potions and Tipped arrows too!'
      - '<gray><yellow>[red] [green] [blue] </yellow>are the amount of each color to combine'
      - '<gray>Each color is an int value between 0 and 255'
      - '<gray>If you are confused google "<yellow>RGB color picker</yellow>"'
    params: '[red] [green] [blue]'
    feedback: '%prefix% <green>Color updated'
  compass:
    description:
      - '<gradient:#A78BFA:gold><b>Set compass target location</b></gradient>'
      - '<white><sprite:items:item/compass_00>'
      - '<gray><yellow>Set </yellow><dark_gray>»</dark_gray> set your location as compass target'
      - '<gray><yellow>Clear </yellow><dark_gray>»</dark_gray> clear compass target'
    params: '<set/clear>'
    set:
      feedback: '%prefix% <green>Compass now points to <yellow>%world% %x% %y% %z%'
    clear:
      feedback: '%prefix% <green>Compass target cleared'
  custommodeldata:
    description:
      - '<gradient:#A78BFA:gold><b>Edit custom model data</b></gradient>'
      - ''
      - '<gray>Used for texture packs'
      - '<gray><yellow>[value] </yellow>positive int of target data model'
      - '<gray>Note: modern servers use itemmodel instead of custommodeldata'
      - '<gray> for textures, this command is for legacy clients'
    params: '<value>'
    feedback: '%prefix% <green>Custom model data updated'
    feedback-reset: '%prefix% <green>Custom model data reset'
  damage:
    description:
      - '<gradient:#A78BFA:gold><b>Edit durability</b></gradient>'
      - ''
      - '<gray><yellow><durability> </yellow>damage to apply'
      - '<gray><gold>N.B.</gold> <yellow>0 </yellow>means no damage, full durability'
    params: '<durability>'
    feedback-reset: '%prefix% <green>Durability restored'
    feedback: '%prefix% <green>Durability updated'
  equipment:
    description:
      - '<gradient:#A78BFA:gold><b>Sets Equipment property of the item</b></gradient>'
      - ''
      - '<gray><gold><b>Tip</b></gold> Use /itemequip or /iee'
      - '<gray><gold>N.B.</gold> your drinkable items cannot be eaten'
    params: ''
  enchant:
    description:
      - '<gradient:#A78BFA:gold><b>Set enchants</b></gradient>'
      - ''
      - '<gray><yellow><enchant> </yellow>enchant type'
      - '<gray><yellow>[level] </yellow>level of the enchant, by default <yellow>1'
      - ''
      - '<gold><b>Tip</b></gold> <gray>Set <yellow>[level] </yellow>to <yellow>0 </yellow>to remove an enchant'
    params: '<enchant> [level]'
    feedback-removed: '%prefix% <green>Removed enchantment <yellow>%enchant%'
    feedback: '%prefix% <green>Applied enchantment <yellow>%enchant% <green>lv <yellow>%lv%'
  fireresistent:
    description:
      - '<gradient:#A78BFA:gold><b>Set item resistence to fire/lava</b></gradient>'
      - ''
      - '<gray><yellow>[true/false] </yellow>set the value, by default toggle'
      - ''
      - '<gray>An item with fire resistance won''t be destroyed'
      - '<gray> when falling into fire and will float over lava'
    params: '[true/false]'
    feedback: '%prefix% <green>Fire resistance set to <yellow>%value%'
  fireworkpower:
    description:
      - '<gradient:#A78BFA:gold><b>Set firework power</b></gradient>'
      - '<white><sprite:items:item/firework_rocket>'
      - '<gray><yellow><power> </yellow>power of the firework, a value betwheen <yellow>0 </yellow>and <yellow>5'
    params: '<power>'
    feedback: '%prefix% <green>Updated firework power'
  firework:
    description:
      - '<gradient:#A78BFA:gold><b>Edit firework with a GUI</b></gradient>'
      - '<white><sprite:items:item/firework_rocket>'
    params: ''
  food:
    description:
      - '<gradient:#A78BFA:gold><b>Sets food property of the item</b></gradient>'
      - ''
      - '<gray><gold><b>Tip</b></gold> Use /itemfood or /if'
      - '<gray><gold>N.B.</gold> your drinkable items cannot be eaten'
    params: ''
  glider:
    description:
      - '<gradient:#A78BFA:gold><b>Set Glider state</b></gradient>'
      - ''
      - '<gray>Glider item should allow gliding like on elytras'
      - '<gray><yellow>[true/false] </yellow>set glider value, by default toggle'
    params: '[true/false]'
    feedback: '%prefix% <green>Updated Gliding set to <yellow>%value%'
  glow:
    description:
      - '<gradient:#A78BFA:gold><b>Override enchantment glow effect</b></gradient>'
      - ''
      - '<gray><yellow>[true/false] </yellow>set the value, by default reset'
      - ''
      - '<gold><b>Tip</b></gold> <gray><yellow>no value specified </yellow>restore vanilla behavior'
    params: '[true/false/default]'
    feedback: '%prefix% <green>Glow set to <yellow>%value%'
    feedback-reset: '%prefix% <green>Reset glow value to default'
  goathornsound:
    description:
      - '<gradient:#A78BFA:gold><b>Set Goat Horn sound</b></gradient>'
      - '<white><sprite:items:item/goat_horn>'
      - '<gray><yellow><type> </yellow>the type of sound'
    params: '<type>'
    feedback: '%prefix% <green>Updated Sound'
  hide:
    description:
      - '<gradient:#A78BFA:gold><b>Hide or show components</b></gradient>'
      - ''
      - '<gray><yellow><flag> </yellow>item flag to edit'
      - '<gray><yellow>[true/false] </yellow>set the flag value, by default toggle'
      - ''
      - '<gold><b>Tip</b></gold> <gray>hide banner pannerns with potion_effects flag'
      - '<gold><b>Tip</b></gold> <gray>hide all flags at once with <yellow>/itemedit hideall'
    params: '<flag> [true/false]'
    feedback: '%prefix% <green>Flag is now <yellow>%value%'
  hidetooltip:
    description:
      - '<gradient:#A78BFA:gold><b>Hide or show tooltips</b></gradient>'
      - ''
      - '<gray><yellow>[true/false] </yellow>set the flag value, by default toggle'
    params: '[true/false]'
    feedback: '%prefix% <green>Tooltip hidden status is now <yellow>%value%'
  hideall:
    description:
      - '<gradient:#A78BFA:gold><b>Hide all components</b></gradient>'
      - ''
      - '<gray>Hides: enchants, potion effects, banner layers, attributes ...'
      - ''
      - '<gold><b>Tip</b></gold> <gray>hide single components with <yellow>/itemedit hide <flag> true'
    params: ''
    feedback: '%prefix% <green>Hidden all the flags'
  itemmodel:
    description:
      - '<gradient:#A78BFA:gold><b>Edit item model</b></gradient>'
      - ''
      - '<gray><yellow><namespaced key> </yellow>key to set for texture reference'
      - '<gray>Example: /ie itemmodel <yellow>iron_sword'
      - '<gray>Example: /ie itemmodel <yellow>minecraft:iron_sword'
      - ''
      - '<gray><yellow><namespace></yellow>:<yellow><id></yellow> will reference model:'
      - '  /assets/<yellow><namespace></yellow>/models/item/<yellow><id>'
    params: '<namespaced key>'
    feedback: '%prefix% <green>Updated Item Model'
    feedback-reset: '%prefix% <green>Reset Item Model'
  kinetic:
    description:
      - '<gradient:#A78BFA:gold><b>Sets kinetic property of the item</b></gradient>'
      - '<white><sprite:items:item/iron_spear>'
      - '<gray><gold><b>Tip</b></gold> Use /itemkinetic or /iek'
    params: ''
  maxdurability:
    description:
      - '<gradient:#A78BFA:gold><b>Sets item max durability</b></gradient>'
      - ''
      - '<gray><yellow><max durability> </yellow>item new durability value,'
      - '<gray>  must be bigger than 1'
    params: '<max durability>'
    feedback: '%prefix% <green>Updated Max durability to <yellow>%value%'
  maxstacksize:
    description:
      - '<gradient:#A78BFA:gold><b>Sets item max stack size</b></gradient>'
      - ''
      - '<gray><yellow>[1-99] </yellow>set the flag value'
      - ''
      - '<gray><yellow>no value </yellow>will restore common stack size which is <yellow>64'
      - '<gray> for most items, <yellow>1</yellow> for armors and tools, and other'
      - '<gray> values for a few items'
    params: '[1-99]'
    feedback: '%prefix% <green>Updated Max stack size to <yellow>%value%'
    feedback-reset: '%prefix% <green>Reset Max stack size'
  pierce:
    description:
      - '<gradient:#A78BFA:gold><b>Sets piercing property of the item</b></gradient>'
      - '<white><sprite:items:item/iron_spear>'
      - '<gold><b>Tip</b></gold><gray> Use /itempiercing or /iep'
    params: ''
  potioneffect:
    itemtag-tip: '%prefix% <gray>You need to add potion effects to common items? try >ItemTag<'
    itemtag-tip-hover:
      - '<gradient:#A78BFA:gold>Click me</gradient>'
    description:
      - '<gradient:#A78BFA:gold><b>Edit potion''s effects</b></gradient>'
      - '<white><sprite:items:item/potion> <sprite:items:item/suspicious_stew> <sprite:items:item/tipped_arrow_base>'
      - '<gray>Works on any Potion, Tipped arrows and Suspicious stew!'
      - '<gray><yellow>Add <effect> <duration> [level] </yellow><dark_gray>»</dark_gray> add effect'
      - '<gray><yellow>Remove <effect> </yellow><dark_gray>»</dark_gray> removes selected effect'
      - '<gray><yellow>Reset </yellow><dark_gray>»</dark_gray> remove all effects'
    params: '<add/remove/reset> [...]'
    add:
      params: '<effect> <duration> [level] [particles] [ambient] [icon]'
      description:
        - '<gradient:#A78BFA:gold><b>Adds/Override selected effect</b></gradient>'
        - ''
        - '<gray><yellow><effect> </yellow>effect type'
        - '<gray><yellow><duration> </yellow>duration in seconds'
        - '<gray><yellow>[level] </yellow>Up to 127, by default <yellow>1'
        - '<gray><yellow>[particles] </yellow>Should show particles? <yellow>true</yellow>/<yellow>false'
        - '<gray><yellow>[ambient] </yellow>Particles should have ambient flag? <yellow>true</yellow>/<yellow>false'
        - '<gray><yellow>[icon] </yellow>Show icon on top-right corner? <yellow>true</yellow>/<yellow>false'
      feedback: '%prefix% <green>Added potion effect'
    remove:
      params: '<effect>'
      description:
        - '<gradient:#A78BFA:gold><b>Remove selected effect</b></gradient>'
      feedback: '%prefix% <green>Removed potion effect'
    reset:
      feedback: '%prefix% <green>Reset potion effects'
  rarity:
    description:
      - '<gradient:#A78BFA:gold><b>Sets item rarity</b></gradient>'
      - ''
      - '<gray><yellow>[rarity] </yellow>set item rarity'
      - ''
      - '<gold><b>Tip</b><gold><gray> setting no rarity value will restore default'
    params: '[rarity]'
    feedback: '%prefix% <green>Updated rarity'
    feedback-reset: '%prefix% <green>Reset Rarity'
  repaircost:
    description:
      - '<gradient:#A78BFA:gold><b>Edit Anvil Repair Cost</b></gradient>'
      - ''
      - '<gray><yellow><cost> </yellow>levels amount'
      - '<gray><gold>N.B.</gold> anvil repair/rename price is always at least <yellow>1'
      - '<gray><gold>N.B.</gold> this command set base repair cost of the item, final levels cost on anvil is based what you do'
      - '<gray>More info at <yellow>minecraft.gamepedia.com/Anvil/Mechanics'
    params: '<cost>'
    feedback: '%prefix% <green>Repair cost updated'
  skullowner:
    description:
      - '<gradient:#A78BFA:gold><b>Set skull owner</b></gradient>'
      - ''
      - '<gray>Works only on Player''s skulls'
      - '<gray><yellow>[name] </yellow>name of the owner'
      - ''
      - '<gold><b>Tip</b></gold> <gray>Place and break the skull to update skins'
    params: '[name]'
    feedback: '%prefix% <green>Updated Head owner'
    feedback-reset: '%prefix% <green>Reset Head owner'
  tooltipstyle:
    description:
      - '<gradient:#A78BFA:gold><b>Edit item tooltip style</b></gradient>'
      - ''
      - '<gray><yellow><style> </yellow>key to set for texture reference'
      - '<gray>  style is composed by <white><namespace>:<id>'
      - '<gray>Example: /ie tooltipstyle <yellow>my_style'
      - '<gray>Example: /ie tooltipstyle <yellow>minecraft:my_style'
      - '<gray>where <yellow>minecraft</yellow> is the <white><namespace></white> and'
      - '<gray><yellow>my_style</yellow> is the <white><id>'
      - '<gray>when set, this item can use custom sprites for'
      - '<gray>its tooltip background and frame.'
      - '<gray><white><namespace>:tooltip/<id>_background'
      - '<gray>and <white><namespace>:tooltip/<id>_frame'
    params: '<style/clear>'
    feedback: '%prefix% <green>Updated tooltip style'
    feedback-reset: '%prefix% <green>Reset tooltip style'
  armortrim:
    description:
      - '<gradient:#A78BFA:gold><b>Set Armor Trim</b></gradient>'
      - '<white><sprite:items:item/iron_chestplate>'
      - '<gray><yellow><material> </yellow>the trim material'
      - '<gray><yellow><pattern> </yellow>the trim pattern'
    params: '<material> <pattern>'
    feedback: '%prefix% <green>Updated Trim'
    feedback-reset: '%prefix% <green>Trim removed'
  tropicalfish:
    description:
