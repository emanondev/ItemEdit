      params: '<replaced> <replacer>'
      description:
        - '<gold><b>Replace all occurrences on the lore</b></gradient>'
        - ''
        - '<gray>If you need to replace more than a word you have'
        - '<gray> to close them inside <yellow>{ }'
        - ''
        - '<gray>Example: <yellow>/ie lore replace New Rusty'
        - '<gray>''<yellow>New sword</yellow>'' -> ''<yellow>Rusty sword</yellow>'''
