    wrong-material_enchantment_storage: '<dark_red>[<red>ItemEdit<dark_red>] <red>Item must be a book or enchanted book'
    wrong-path: '<blue>[<white>ItemEdit<blue>] <red>Invalid path, remember to reload the configuration and check the CaPs'
itemedit:
  amount:
    description:
      - '<gold><b>Set amount</b>'
      - ''
      - '<yellow><amount> <aqua>amount to set (up to 127)'
      - '<aqua><b>Tip</b>: <aqua>Negative amounts are subtracted'
      - '<aqua> from item current amount'
    params: '<amount>'
    feedback: '<blue>[<white>ItemEdit<blue>] <green>Item amount set to <yellow>%amount%'
    feedback-decrease: '<blue>[<white>ItemEdit<blue>] <green>Item amount decreased by <yellow>%amount%'
  attribute:
    description:
      - '<gold><b>Edit attribute modifiers</b>'
      - ''
      - '<yellow>Add <attribute> <amount> [operation] [slot] <aqua>- add new modifiers'
      - '<yellow>Remove <attribute/slot> <aqua>- removes some modifiers'
    params: '<add/remove> [...]'
    add:
      params: '<attribute> <amount> [operation] [slot]'
      description:
        - '<gold><b>Add attribute modifier</b>'
        - ''
        - '<yellow><attribute> <aqua>attribute type'
        - '<yellow><amount> <aqua>amount to set'
        - '<yellow>[operation] <aqua>how the modifier is added, by default sums'
        - '<yellow>[slot] <aqua>apply this modifier only when item is on selected'
        - '<yellow>       equipment slot or any equipment slot if not selected'
      feedback: '<blue>[<white>ItemEdit<blue>] <green>Added modifier'
    remove:
      params: '<attribute/slot>'
      description:
        - '<gold><b>Remove modifiers</b>'
        - ''
        - '<yellow><attribute/slot> <aqua>type to remove, any modifiers with'
        - '<aqua>                 selected value are removed'
      feedback-attribute: '<blue>[<white>ItemEdit<blue>] <green>Removed modifiers of attribute'
      feedback-equipment: '<blue>[<white>ItemEdit<blue>] <green>Removed modifiers of equipment slot'
  axolotlvariant:
    description:
      - '<gold><b>Edit Axolotl Variant on Axolotl bucket</b>'
      - ''
      - '<yellow><type> <aqua>the type of axolotl'
    params: '<type>'
    feedback: '<blue>[<white>ItemEdit<blue>] <green>Changed Axolotl variant to <yellow>%variant%'
  banner:
    description:
      - '<gold><b>Edit banner</b>'
    set:
      params: '<type> <color> <line>'
      description:
        - '<gold><b>Replace the pattern on selected line</b>'
      feedback: '<blue>[<white>ItemEdit<blue>] <green>Pattern set'
    add:
      params: '<type> <color>'
      description:
        - '<gold><b>Add a pattern</b>'
      feedback: '<blue>[<white>ItemEdit<blue>] <green>Pattern added'
    remove:
      params: '<line>'
      description:
        - '<gold><b>Remove pattern on selected line</b>'
      feedback: '<blue>[<white>ItemEdit<blue>] <green>Pattern removed'
    color:
      params: '<line> <color>'
      description:
        - '<gold><b>Change pattern color on selected line</b>'
      feedback: '<blue>[<white>ItemEdit<blue>] <green>Pattern recolored'
  bookauthor:
    description:
      - '<gold><b>Set author</b>'
      - ''
      - '<aqua>Author name may contains spaces and be colored too'
      - '<aqua>Works only on Written books'
    params: '<name>'
    feedback: '<blue>[<white>ItemEdit<blue>] <green>Updated book author'
    feedback-reset: '<blue>[<white>ItemEdit<blue>] <green>Reset book author'
  bookenchant:
    description:
      - '<gold><b>Set enchants on the book</b>'
      - '<aqua>The difference between enchant and bookenchant is that'
      - '<aqua>a book with enchant fire aspect sets hit targets on fire'
      - '<aqua>while a book with bookenchant doesn''t'
      - ''
      - '<yellow><enchant> <aqua>enchant type'
      - '<yellow>[level] <aqua>level of the enchant, by default <yellow>1'
      - ''
      - '<aqua><b>Tip</b>: <aqua>Set <yellow>[level] <aqua>to <yellow>0 <aqua>to remove an enchant'
    params: '<enchant> [level]'
    feedback-removed: '<blue>[<white>ItemEdit<blue>] <green>Removed book enchantment <yellow>%enchant%'
    feedback: '<blue>[<white>ItemEdit<blue>] <green>Applied book enchantment <yellow>%enchant% <green>lv <yellow>%lv%'
  booktype:
    description:
      - '<gold><b>Set book type</b>'
      - ''
      - '<aqua>Works only on Written books'
    params: '<booktype>'
    feedback: '<blue>[<white>ItemEdit<blue>] <green>Updated book generation to <yellow>%generation%'
    feedback-reset: '<blue>[<white>ItemEdit<blue>] <green>Reset book generation'
  color:
    description:
      - '<gold><b>Set color</b>'
      - ''
      - '<aqua>Works on leather armor and firework stars, on servers'
      - '<aqua> 1.11+ works on any Potion and Tipped arrows too!'
      - '<yellow>[red (0-255)] [green (0-255)] [blue (0-255)] <aqua>are the amount of each color to combine'
      - '<aqua>Each color is an int value between 0 and 255'
      - '<aqua>If you are confused google "<yellow>RGB color picker<aqua>"'
    params: '[red (0-255)] [green (0-255)] [blue (0-255)]'
    feedback: '<blue>[<white>ItemEdit<blue>] <green>Color updated'
  compass:
    description:
      - '<gold><b>Set compass target location</b>'
      - ''
      - '<yellow>Set <aqua>- set your location as compass target'
      - '<yellow>Clear <aqua>- clear compass target'
    params: '<set/clear>'
    set:
      feedback: '<blue>[<white>ItemEdit<blue>] <green>Compass now points to <yellow>%world% %x% %y% %z%'
    clear:
      feedback: '<blue>[<white>ItemEdit<blue>] <green>Compass target cleared'
  custommodeldata:
    description:
      - '<gold><b>Edit custom model data</b>'
      - ''
      - '<aqua>Used for texture packs'
      - '<yellow>[value] <aqua>positive int of target data model'
      - '<aqua>Note: modern servers use itemmodel instead of custommodeldata'
      - '<aqua> for textures, this command is for legacy clients'
    params: '<value>'
    feedback: '<blue>[<white>ItemEdit<blue>] <green>Custom model data updated'
    feedback-reset: '<blue>[<white>ItemEdit<blue>] <green>Custom model data reset'
  damage:
    description:
      - '<gold><b>Edit durability</b>'
      - ''
      - '<yellow><durability> <aqua>damage to apply'
      - '<aqua><b>N.B.</b> <yellow>0 <aqua>means no damage, full durability'
    params: '<durability>'
    feedback-reset: '<blue>[<white>ItemEdit<blue>] <green>Durability restored'
    feedback: '<blue>[<white>ItemEdit<blue>] <green>Durability updated'
  equipment:
    description:
      - '<gold><b>Sets food property of the item</b>'
      - ''
      - '<aqua>Tip: Use /itemequip or /iee'
      - '<aqua>N.B. your drinkable items cannot be eaten'
  enchant:
    description:
      - '<gold><b>Set enchants</b>'
      - ''
      - '<yellow><enchant> <aqua>enchant type'
      - '<yellow>[level] <aqua>level of the enchant, by default <yellow>1'
      - ''
      - '<aqua><b>Tip</b>: <aqua>Set <yellow>[level] <aqua>to <yellow>0 <aqua>to remove an enchant'
    params: '<enchant> [level]'
    feedback-removed: '<blue>[<white>ItemEdit<blue>] <green>Removed enchantment <yellow>%enchant%'
    feedback: '<blue>[<white>ItemEdit<blue>] <green>Applied enchantment <yellow>%enchant% <green>lv <yellow>%lv%'
  fireresistent:
    description:
      - '<gold><b>Set item resistence to fire/lava</b>'
      - ''
      - '<yellow>[true/false] <aqua>set the value, by default toggle'
      - ''
      - '<aqua>An item with fire resistance won''t be destroyed'
      - '<aqua> when falling into fire and will float over lava'
    params: '[true/false]'
    feedback: '<blue>[<white>ItemEdit<blue>] <green>Fire resistance set to <yellow>%value%'
  fireworkpower:
    description:
      - '<gold><b>Set firework power</b>'
      - ''
      - '<yellow><power> <aqua>power of the firework, a value betwheen <yellow>0 <aqua>and <yellow>5'
    params: '<power>'
    feedback: '<blue>[<white>ItemEdit<blue>] <green>Updated firework power'
  firework:
    description:
      - '<gold><b>Edit firework with a GUI</b>'
    params: ''
  food:
    description:
      - '<gold><b>Sets food property of the item</b>'
      - ''
      - '<aqua>Tip: Use /itemfood or /if'
      - '<aqua>N.B. your drinkable items cannot be eaten'
  glider:
    description:
      - '<gold><b>Set Glider state</b>'
      - ''
      - '<aqua>Glider item should allow gliding like on elytras'
      - '<yellow>[true/false] <aqua>set glider value, by default toggle'
    params: '[true/false]'
    feedback: '<blue>[<white>ItemEdit<blue>] <green>Updated Gliding set to <yellow>%value%'
  glow:
    description:
      - '<gold><b>Override enchantment glow effect</b>'
      - ''
      - '<yellow>[true/false] <aqua>set the value, by default reset'
      - ''
      - '<aqua><b>Tip</b>: <yellow>no value specified <aqua>restore vanilla behavior'
    params: '[true/false/default]'
    feedback: '<blue>[<white>ItemEdit<blue>] <green>Glow set to <yellow>%value%'
    feedback-reset: '<blue>[<white>ItemEdit<blue>] <green>Reset glow value to default'
  goathornsound:
    description:
      - '<gold><b>Set Goat Horn sound</b>'
      - ''
      - '<yellow><type> <aqua>the type of sound'
    params: '<type>'
    feedback: '<blue>[<white>ItemEdit<blue>] <green>Updated Sound'
  hide:
    description:
      - '<gold><b>Hide or show components</b>'
      - ''
      - '<yellow><flag> <aqua>item flag to edit'
      - '<yellow>[true/false] <aqua>set the flag value, by default toggle'
      - ''
      - '<aqua><b>Tip</b>: <aqua>hide banner pannerns with potion_effects flag'
      - '<aqua><b>Tip</b>: <aqua>hide all flags at once with <yellow>/itemedit hideall'
    params: '<flag> [true/false]'
    feedback: '<blue>[<white>ItemEdit<blue>] <green>Flag is now <yellow>%value%'
  hidetooltip:
    description:
      - '<gold><b>Hide or show tooltips</b>'
      - ''
      - '<yellow>[true/false] <aqua>set the flag value, by default toggle'
    params: '[true/false]'
    feedback: '<blue>[<white>ItemEdit<blue>] <green>Tooltip hidden status is now <yellow>%value%'
  hideall:
    description:
      - '<gold><b>Hide all components</b>'
      - ''
      - '<aqua>Hides: enchants, potion effects, banner layers, attributes ...'
      - ''
      - '<aqua><b>Tip</b>: <aqua>hide single components with <yellow>/itemedit hide <flag> true'
    params: ''
    feedback: '<blue>[<white>ItemEdit<blue>] <green>Hidden all the flags'
  itemmodel:
    description:
      - '<gold><b>Edit item model</b>'
      - ''
      - '<yellow><namespaced key> <aqua>key to set for texture reference'
      - '<aqua>Example: /ie itemmodel <yellow>iron_sword'
      - '<aqua>Example: /ie itemmodel <yellow>minecraft:iron_sword'
      - ''
      - '<yellow><namespace><aqua>:<yellow><id> <aqua>will reference model:'
      - '  /assets/<yellow><namespace><aqua>/models/item/<yellow><id>'
    params: '<namespaced key>'
    feedback: '<blue>[<white>ItemEdit<blue>] <green>Updated Item Model'
    feedback-reset: '<blue>[<white>ItemEdit<blue>] <green>Reset Item Model'
  kinetic:
    description:
      - '<gold><b>Sets kinetic property of the item</b>'
      - ''
      - '<aqua>Tip: Use /itemkinetic or /iek'
  maxdurability:
    description:
      - '<gold><b>Sets item max durability</b>'
      - ''
      - '<yellow><max durability> <aqua>item new durability value, must be bigger than 1'
    params: '<max durability>'
    feedback: '<blue>[<white>ItemEdit<blue>] <green>Updated Max durability to <yellow>%value%'
  maxstacksize:
    description:
      - '<gold><b>Sets item max stack size</b>'
      - ''
      - '<yellow>[1-99] <aqua>set the flag value'
      - ''
      - '<yellow>no value <aqua>will restore common stack size which is <yellow>64'
      - '<aqua> for most items, <yellow>1<aqua> for armors and tools, and other'
      - '<aqua> values for a few items'
    params: '[1-99]'
    feedback: '<blue>[<white>ItemEdit<blue>] <green>Updated Max stack size to <yellow>%value%'
    feedback-reset: '<blue>[<white>ItemEdit<blue>] <green>Reset Max stack size'
  piercing:
    description:
      - '<gold><b>Sets piercing property of the item</b>'
      - ''
      - '<aqua><b>Tip</b>: Use /itempiercing or /iep'
  potioneffect:
    itemtag-tip: '<blue>[<white>ItemEdit<blue>] <aqua>You need to add potion effects to common items? try >ItemTag<'
    itemtag-tip-hover:
      - '<gold>Click me'
    description:
      - '<gold><b>Edit potion''s effects</b>'
      - ''
      - '<aqua>Works on any Potion, Tipped arrows and Suspicious stew!'
      - '<yellow>Add <effect> <duration> [level] <aqua>- add effect'
      - '<yellow>Remove <effect> <aqua>- removes selected effect'
      - '<yellow>Reset <aqua>- remove all effects'
    params: '<add/remove/reset> [...]'
    add:
      params: '<effect> <duration> [level] [particles] [ambient] [icon]'
      description:
        - '<gold><b>Adds/Override selected effect</b>'
        - ''
        - '<yellow><effect> <aqua>effect type'
        - '<yellow><duration> <aqua>duration in seconds'
        - '<yellow>[level] <aqua>Up to 127, by default <yellow>1'
        - '<yellow>[particles] <aqua>Should show particles? <yellow>true<aqua>/<yellow>false'
        - '<yellow>[ambient] <aqua>Particles should have ambient flag? <yellow>true<aqua>/<yellow>false'
        - '<yellow>[icon] <aqua>Show icon on top-right corner? <yellow>true<aqua>/<yellow>false <aqua>(for 1.13+ only)'
      feedback: '<blue>[<white>ItemEdit<blue>] <green>Added potion effect'
    remove:
      params: '<effect>'
      description:
        - '<gold><b>Remove selected effect</b>'
      feedback: '<blue>[<white>ItemEdit<blue>] <green>Removed potion effect'
    reset:
      feedback: '<blue>[<white>ItemEdit<blue>] <green>Reset potion effects'
  rarity:
    description:
      - '<gold><b>Sets item rarity</b>'
      - ''
      - '<yellow>[rarity] <aqua>set item rarity'
      - ''
      - '<aqua><b>Tip</b>: setting no rarity value will restore default'
    params: '[rarity]'
    feedback: '<blue>[<white>ItemEdit<blue>] <green>Updated rarity'
    feedback-reset: '<blue>[<white>ItemEdit<blue>] <green>Reset Rarity'
  repaircost:
    description:
      - '<gold><b>Edit Anvil Repair Cost</b>'
      - ''
      - '<yellow><cost> <aqua>levels amount'
      - '<aqua><b>N.B.</b> <aqua>anvil repair/rename price is always at least <yellow>1'
      - '<aqua><b>N.B.</b> <aqua>this command set base repair cost of the item, final levels cost on anvil is based what you do'
      - '<aqua>More info at <yellow>minecraft.gamepedia.com/Anvil/Mechanics'
    params: '<cost>'
    feedback: '<blue>[<white>ItemEdit<blue>] <green>Repair cost updated'
  skullowner:
    description:
      - '<gold><b>Set skull owner</b>'
      - ''
      - '<aqua>Works only on Player''s skulls'
      - '<yellow>[name] <aqua>name of the owner'
      - ''
      - '<aqua><b>Tip</b>: <aqua>Place and break the skull to update skins'
    params: '[name]'
    feedback: '<blue>[<white>ItemEdit<blue>] <green>Updated Head owner'
    feedback-reset: '<blue>[<white>ItemEdit<blue>] <green>Reset Head owner'
  spawnereggtype:
    description:
      - '<gold><b>Set type of entity spawned by spawner egg</b>'
      - ''
      - '<yellow><type> <aqua>type of the entity'
      - '<aqua>Only some entity type are spawnable by eggs'
    params: '<type>'
    feedback: '<blue>[<white>ItemEdit<blue>] <green>Updated Egg type'
  tooltipstyle:
    description:
      - '<gold><b>Edit item tooltip style</b>'
      - ''
      - '<yellow><style> <aqua>key to set for texture reference'
      - '<aqua>  style is composed by <namespace>:<id>'
      - '<aqua>Example: /ie tooltipstyle <yellow>my_style'
      - '<aqua>Example: /ie tooltipstyle <yellow>minecraft:my_style'
      - '<aqua>where minecraft is the <namespace> and'
      - '<aqua>my_style is the <id>'
      - '<aqua>when set, this item can use custom sprites for'
      - '<aqua>its tooltip background and frame.'
      - '<aqua><namespace>:tooltip/<id>_background'
      - '<aqua>and <namespace>:tooltip/<id>_frame'
    params: '<style/clear>'
    feedback: '<blue>[<white>ItemEdit<blue>] <green>Updated tooltip style'
    feedback-reset: '<blue>[<white>ItemEdit<blue>] <green>Reset tooltip style'
  armortrim:
    description:
      - '<gold><b>Set Armor Trim</b>'
      - ''
      - '<yellow><material> <aqua>the trim material'
      - '<yellow><pattern> <aqua>the trim pattern'
    params: '<material> <pattern>'
    feedback: '<blue>[<white>ItemEdit<blue>] <green>Updated Trim'
    feedback-reset: '<blue>[<white>ItemEdit<blue>] <green>Trim removed'
  tropicalfish:
    description:
      - '<gold><b>Set property of tropical fish bucket</b>'
      - ''
      - '<yellow>pattern <pattern type> <aqua>- type of fish'
      - '<yellow>patterncolor <color> <aqua>- pattern color of fish'
      - '<yellow>bodycolor <color> <aqua>- body color of fish'
    params: '[...]'
    pattern:
      params: '<type>'
      description:
        - '<gold><b>Set tropical fish pattern type</b>'
        - ''
        - '<yellow><type> <aqua>pattern type of the fish'
      feedback: '<blue>[<white>ItemEdit<blue>] <green>Updated Pattern'
    patterncolor:
      params: '<color>'
      description:
        - '<gold><b>Set tropical fish pattern color</b>'
        - ''
