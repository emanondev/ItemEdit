    flag_type: '%prefix% <red>Неправильне значення прапорця! <dark_red>[<gold>навести сюди<dark_red>]'
    book_type: '%prefix% <red>Неправильне значення типу книги! <dark_red>[<gold>навести сюди<dark_red>]'
