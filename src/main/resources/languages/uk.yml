itemedit:
  amount:
    description:
      - '<gradient:#A78BFA:gold><b>Установлена сума</b></gradient>'
      - ''
      - '<gray><yellow><amount> </yellow>кількість для встановлення (до 127)'
      - '<gold><b>Порада</b></gold> <gray>Від''ємні суми віднімаються'
      - '<gray> від поточної суми товару'
    params: '<amount>'
    feedback: '%prefix% <green>Кількість товару встановлено на <yellow>%amount%'
    feedback-decrease: '%prefix% <green>Кількість товару зменшено на <yellow>%amount%'
  attribute:
    description:
      - '<gradient:#A78BFA:gold><b>Редагувати модифікатори атрибутів</b></gradient>'
      - ''
      - '<gray><yellow>Add <attribute> <amount> [operation] [slot] </yellow><dark_gray>»</dark_gray> додати нові модифікатори'
      - '<gray><yellow>Remove <attribute/slot> </yellow><dark_gray>»</dark_gray> видаляє деякі модифікатори'
    params: '<add/remove> [...]'
    add:
      params: '<attribute> <amount> [operation] [slot]'
      description:
        - '<gradient:#A78BFA:gold><b>Додати модифікатор атрибута</b></gradient>'
        - ''
        - '<gray><yellow><attribute> </yellow>тип атрибута'
        - '<gray><yellow><amount> </yellow>сума для встановлення'
        - '<gray><yellow>[operation] </yellow>як додається модифікатор, за замовчуванням суми'
        - '<gray><yellow>[slot] </yellow>застосовує цей модифікатор лише тоді, коли елемент вибрано'
        - '<gray> слот обладнання або будь-який слот обладнання, якщо не вибрано'
      feedback: '%prefix% <green>Додано модифікатор'
    remove:
      params: '<attribute/slot>'
      description:
        - '<gradient:#A78BFA:gold><b>Видалити модифікатори</b></gradient>'
        - ''
        - '<gray><yellow><attribute/slot> </yellow>введіть, щоб видалити, будь-які модифікатори з'
        - '<gray> вибране значення видалено'
      feedback-attribute: '%prefix% <green>Вилучено модифікатори атрибута'
      feedback-equipment: '%prefix% <green>Вилучено модифікатори слота обладнання'
  axolotlvariant:
    description:
      - '<gradient:#A78BFA:gold><b>Редагувати варіант Аксолотля на відрі Аксолотля</b></gradient>'
      - '<white><sprite:items:item/axolotl_bucket>'
      - '<gray><yellow><type> </yellow>вид аксолотля'
    params: '<type>'
    feedback: '%prefix% <green>Змінено варіант Аксолотля на <yellow>%variant%'
  banner:
    description:
      - '<gradient:#A78BFA:gold><b>Редагувати банер</b></gradient>'
    params: '<add/set/remove/color> [...]'
    set:
      params: '<type> <color> <line>'
      description:
        - '<gradient:#A78BFA:gold><b>Замінити шаблон на вибраному рядку</b></gradient>'
      feedback: '%prefix% <green>Набір шаблонів'
    add:
      params: '<type> <color>'
      description:
        - '<gradient:#A78BFA:gold><b>Додати візерунок</b></gradient>'
      feedback: '%prefix% <green>Додано шаблон'
    remove:
      params: '<line>'
      description:
        - '<gradient:#A78BFA:gold><b>Видалити візерунок у вибраному рядку</b></gradient>'
      feedback: '%prefix% <green>Візерунок видалено'
    color:
      params: '<line> <color>'
      description:
        - '<gradient:#A78BFA:gold><b>Змінити колір візерунка на вибраній лінії</b></gradient>'
      feedback: '%prefix% <green>Візерунок змінено'
  bookauthor:
    description:
      - '<gradient:#A78BFA:gold><b>Установити автора</b></gradient>'
      - '<white><sprite:items:item/written_book>'
      - '<gray>Ім’я автора може містити пробіли та бути пофарбованим'
      - '<gray>Працює лише з письмовими книгами'
    params: '<name>'
    feedback: '%prefix% <green>Оновлений автор книги'
    feedback-reset: '%prefix% <green>Скинути автора книги'
  bookenchant:
    description:
      - '<gradient:#A78BFA:gold><b>Установіть чари на книгу</b></gradient>'
      - '<white><sprite:items:item/enchanted_book> <sprite:items:item/book>'
      - '<gray>Різниця між enchant і bookenchant полягає в тому, що'
      - '<gray>книга з аспектом вогню enchant підпалює цілі при попаданні'
      - '<gray>, тоді як книга з bookenchant ні'
      - ''
      - '<gray><yellow><enchant> </yellow>тип зачарування'
      - '<gray><yellow>[level] </yellow>рівень чар, за замовчуванням <yellow>1'
      - ''
      - '<gold><b>Tip</b></gold> <gray>Установіть <yellow>[level] </yellow> на <yellow>0 </yellow>, щоб зняти чари'
    params: '<enchant> [level]'
    feedback-removed: '%prefix% <green>Вилучено зачарування книги <yellow>%enchant%'
    feedback: '%prefix% <green>Застосовано книжкове зачарування <yellow>%enchant% <green>lv <yellow>%lv%'
  booktype:
    description:
      - '<gradient:#A78BFA:gold><b>Установити тип книги</b></gradient>'
      - '<white><sprite:items:item/written_book>'
      - '<gray>Працює лише з письмовими книгами'
    params: '<booktype>'
    feedback: '%prefix% <green>Оновлено генерацію книги до <yellow>%generation%'
    feedback-reset: '%prefix% <green>Скинути створення книги'
  color:
    description:
      - '<gradient:#A78BFA:gold><b>Установити колір</b></gradient>'
      - '<white><sprite:items:item/potion> <sprite:items:item/tipped_arrow_base> <sprite:items:item/firework_star> <sprite:items:item/leather_chestplate>'
      - '<gray>Працює на шкіряній броні та феєрверкових зірках, зіллях і стрілах із ефектами зілля!'
      - '<gray><yellow>[red] [green] [blue] </yellow>– це кількість кожного кольору для поєднання'
      - '<gray>Кожен колір має значення int від 0 до 255'
      - '<gray>Якщо ви заплуталися, погугліть "<yellow>вибір кольорів RGB</yellow>"'
    params: '[red] [green] [blue]'
    feedback: '%prefix% <green>Колір оновлено'
  compass:
    description:
      - '<gradient:#A78BFA:gold><b>Установити цільове розташування за компасом</b></gradient>'
      - '<white><sprite:items:item/compass_00>'
      - '<gray><yellow>Set </yellow><dark_gray>»</dark_gray> установіть своє місцезнаходження як ціль за компасом'
      - '<gray><yellow>Clear </yellow><dark_gray>»</dark_gray> чітка ціль за компасом'
    params: '<set/clear>'
    set:
      feedback: '%prefix% <green>Компас тепер вказує на <yellow>%world% %x% %y% %z%'
    clear:
      feedback: '%prefix% <green>Ціль компаса очищено'
  custommodeldata:
    description:
      - '<gradient:#A78BFA:gold><b>Редагувати власні дані моделі</b></gradient>'
      - ''
      - '<gray>Використовується для пакетів текстур'
      - '<gray><yellow>[value] </yellow>позитивний int цільової моделі даних'
      - '<gray>Примітка: сучасні сервери використовують itemmodel замість custommodeldata'
      - '<gray> для текстур, ця команда для застарілих клієнтів'
    params: '<value>'
    feedback: '%prefix% <green>Дані власної моделі оновлено'
    feedback-reset: '%prefix% <green>Скидання даних власної моделі'
  damage:
    description:
      - '<gradient:#A78BFA:gold><b>Редагувати довговічність</b></gradient>'
      - ''
      - '<gray><yellow><durability> </yellow>пошкодження для застосування'
      - '<gray><gold>N.B.</gold> <yellow>0 </yellow>означає відсутність пошкоджень, повна довговічність'
    params: '<durability>'
    feedback-reset: '%prefix% <green>Стійкість відновлено'
    feedback: '%prefix% <green>Стійкість оновлено'
  equipment:
    description:
      - '<gradient:#A78BFA:gold><b>Встановлює властивість обладнання для предмета</b></gradient>'
      - ''
      - '<gray><gold><b>Порада</b></gold> Використовуйте /itemequip or /iee'
      - '<gray><gold>N.B.</gold> ваші напої не можна їсти'
    params: ''
  enchant:
    description:
      - '<gradient:#A78BFA:gold><b>Установити зачарування</b></gradient>'
      - ''
      - '<gray><yellow><enchant> </yellow>тип зачарування'
      - '<gray><yellow>[level] </yellow>рівень чар, за замовчуванням <yellow>1'
      - ''
      - '<gold><b>Tip</b></gold> <gray>Установіть <yellow>[level] </yellow> на <yellow>0 </yellow>, щоб зняти чари'
    params: '<enchant> [level]'
    feedback-removed: '%prefix% <green>Знято зачарування <yellow>%enchant%'
    feedback: '%prefix% <green>Застосовано зачарування <yellow>%enchant% <green>lv <yellow>%lv%'
  fireresistent:
    description:
      - '<gradient:#A78BFA:gold><b>Установити стійкість предмета до вогню/лави</b></gradient>'
      - ''
      - '<gray><yellow>[true/false] </yellow>встановіть значення, за замовчуванням перемикач'
      - ''
      - '<gray>Вогневостійкий предмет не буде знищено'
      - '<gray> під час падіння у вогонь і буде плавати над лавою'
    params: '[true/false]'
    feedback: '%prefix% <green>Вогнестійкість встановлена на <yellow>%value%'
  fireworkpower:
    description:
      - '<gradient:#A78BFA:gold><b>Установити потужність феєрверку</b></gradient>'
      - '<white><sprite:items:item/firework_rocket>'
      - '<gray><yellow><power> </yellow>сила феєрверку, значення між <yellow>0 </yellow>і <yellow>5'
    params: '<power>'
    feedback: '%prefix% <green>Оновлено потужність феєрверку'
  firework:
    description:
      - '<gradient:#A78BFA:gold><b>Редагувати феєрверк за допомогою GUI</b></gradient>'
      - '<white><sprite:items:item/firework_rocket>'
    params: ''
  food:
    description:
      - '<gradient:#A78BFA:gold><b>Встановлює харчову властивість елемента</b></gradient>'
      - ''
      - '<gray><gold><b>Порада</b></gold> Використовуйте /itemfood or /if'
      - '<gray><gold>N.B.</gold> ваші напої не можна їсти'
    params: ''
  glider:
    description:
      - '<gradient:#A78BFA:gold><b>Установити стан Glider</b></gradient>'
      - ''
      - '<gray>Планер має дозволяти ковзати, як на надкрилах'
      - '<gray><yellow>[true/false] </yellow>встановити значення планера, перемикач за замовчуванням'
    params: '[true/false]'
    feedback: '%prefix% <green>Оновлено ковзання встановлено на <yellow>%value%'
  glow:
    description:
      - '<gradient:#A78BFA:gold><b>Зміна ефекту зачарування</b></gradient>'
      - ''
      - '<gray><yellow>[true/false] </yellow>встановити значення, за умовчанням скинути'
      - ''
      - '<gold><b>Tip</b></gold> <gray><yellow>не вказано значення </yellow>відновити ванільну поведінку'
    params: '[true/false/default]'
    feedback: '%prefix% <green>Свічення встановлено на <yellow>%value%'
    feedback-reset: '%prefix% <green>Скинути значення світіння до значення за замовчуванням'
  goathornsound:
    description:
      - '<gradient:#A78BFA:gold><b>Установити звук козячого рога</b></gradient>'
      - '<white><sprite:items:item/goat_horn>'
      - '<gray><yellow><type> </yellow>тип звуку'
    params: '<type>'
    feedback: '%prefix% <green>Оновлений звук'
  hide:
    description:
      - '<gradient:#A78BFA:gold><b>Приховати або показати компоненти</b></gradient>'
      - ''
      - '<gray><yellow><flag> </yellow>прапорець елемента для редагування'
      - '<gray><yellow>[true/false] </yellow>встановити значення прапорця, за замовчуванням перемикач'
      - ''
      - '<gold><b>Tip</b></gold> <gray>сховати шаблони банерів за допомогою прапорця potion_effects'
      - '<gold><b>Tip</b></gold> <gray>сховайте всі прапорці одночасно за допомогою <yellow>/itemedit hideall'
    params: '<flag> [true/false]'
    feedback: '%prefix% <green>Прапорець тепер <yellow>%value%'
  hidetooltip:
    description:
      - '<gradient:#A78BFA:gold><b>Приховати або показати спливаючі підказки</b></gradient>'
      - ''
      - '<gray><yellow>[true/false] </yellow>встановити значення прапорця, за замовчуванням перемикач'
    params: '[true/false]'
    feedback: '%prefix% <green>Статус прихованої підказки тепер <yellow>%value%'
  hideall:
    description:
