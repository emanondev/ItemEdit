generic:
  help:
    player-only: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <red>Comando solo para jugadores'
    no-item-on-hand: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <red>Necesitas tener un objeto en la mano'
    lack-permission: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <red>No tienes permiso %permission%'
    lack-permission-generic: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <red>No tienes permiso para usar este comando'
    blocked-by-censure: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <red>No puedes usar este texto, contiene palabras bloqueadas'
    blocked-by-type-restriction: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <red>No puedes cambiar el nombre de este elemento'
    blocked-by-type-restriction-lore: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <red>No puedes editar la descripción del objeto en este objeto'
    blocked-by-lore-line-limit: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <red>No puedes agregar más líneas de descripción de objeto en este objeto'
    blocked-by-lore-length-limit: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <red>No puedes establecer líneas de más de %limit% caracteres'
    blocked-by-rename-length-limit: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <red>No puedes establecer nombres con más de %limit% caracteres'

    prefix: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray>'
    header-format: '<gradient:#54acff:#A78BFA><bold>%header%</bold></gradient> <dark_gray>»</dark_gray> <#A78BFA><bold>Ayuda</bold></#A78BFA>'
    header-sub-format: '<gradient:#54acff:#A78BFA><bold>%header%</bold></gradient> <dark_gray>»</dark_gray> <gradient:#A78BFA:#54acff><bold>%sub%</bold></gradient> <dark_gray>»</dark_gray> <#55d6ff><bold>Ayuda</#55d6ff>'
    command-format: '<gray>/%command%</gray> <#bad1ff>%sub%</#bad1ff> <#d7bbff>%params%</#d7bbff>'
    footer-format: '%prev_clickable% <#7E9CFD><b>Ayuda</b> [%page%/%max_page%]</#7E9CFD> %next_clickable%'
    next_text: ' <light_purple><b>><st>> ></st> '
    prev_text: ' <light_purple><b><st>< <</st>< '
    next_void: ' <dark_gray><b>><st>> ></st> '
    prev_void: ' <dark_gray><b><st>< <</st>< '
    next_hover: '<gold><b>Ir a la página %target%'
    prev_hover: '<gold><b>Ir a la página %target%'
  wrong-material:
    axolotl_bucket: '%prefix% <red>El objeto debe ser un cubo de ajolote'
    banner: '%prefix% <red>El objeto debe ser un banner'
    damageable: '%prefix% <red>El objeto debe tener durabilidad como herramientas y armaduras.'
    player_head: '%prefix% <red>El objeto debe ser la cabeza de un jugador.'
    rgb_colorable: '%prefix% <red>El elemento debe ser del tipo que se pueda colorear, como armaduras de cuero, estrellas de fuegos artificiales, pociones o flechas con efectos de pociones.'
    written_book: '%prefix% <red>El objeto debe ser un libro escrito'
    potion_effect_applicable: '%prefix% <red>El objeto debe ser una poción o una flecha con efecto de poción o un estofado sospechoso'
    firework: '%prefix% <red>El objeto debe ser un fuego artificial'
    spawner_egg: '%prefix% <red>El objeto debe ser un huevo de desove'
    tropical_fish_bucket: '%prefix% <red>El objeto debe ser un cubo para peces tropicales.'
    writable_book: '%prefix% <red>El objeto debe ser un libro escrito o un libro y una pluma.'
    compass: '%prefix% <red>El objeto debe ser una brújula'
    music_instrument: '%prefix% <red>El objeto debe ser un cuerno de cabra'
    armor: '%prefix% <red>El objeto debe ser una armadura.'
    enchantment_storage: '%prefix% <red>El objeto debe ser un libro o un libro encantado'
  wrong-alias:
    axolotl_variant: '%prefix% <red>¡Valor de ajolote incorrecto! <dark_red>[<gold>pase el cursor aquí<dark_red>]'
    potion_effect: '%prefix% <red>¡Valor de efecto incorrecto! <dark_red>[<gold>pase el cursor aquí<dark_red>]'
    animations: '%prefix% <red>¡Valor de animación incorrecto! <dark_red>[<gold>pase el cursor aquí<dark_red>]'
    sound: '%prefix% <red>¡Valor de sonido incorrecto! <dark_red>[<gold>pase el cursor aquí<dark_red>]'
    enchant: '%prefix% <red>¡Valor de encantamiento incorrecto! <dark_red>[<gold>pase el cursor aquí<dark_red>]'
    flag_type: '%prefix% <red>¡Valor de indicador incorrecto! <dark_red>[<gold>pase el cursor aquí<dark_red>]'
    book_type: '%prefix% <red>¡Valor de tipo de libro incorrecto! <dark_red>[<gold>pase el cursor aquí<dark_red>]'
    equip_slot: '%prefix% <red>¡Valor de espacio de equipo incorrecto! <dark_red>[<gold>pase el cursor aquí<dark_red>]'
    banner_pattern: '%prefix% <red>¡Valor de patrón incorrecto! <dark_red>[<gold>pase el cursor aquí<dark_red>]'
    color: '%prefix% <red>¡Valor de color incorrecto! <dark_red>[<gold>pase el cursor aquí<dark_red>]'
    mob_type: '%prefix% <red>¡Valor de tipo de huevo incorrecto! <dark_red>[<gold>pase el cursor aquí<dark_red>]'
    trim_material: '%prefix% <red>¡Valor del material de ajuste de armadura incorrecto! <dark_red>[<gold>pase el cursor aquí<dark_red>]'
    tropical_fish_pattern: '%prefix% <red>¡Valor de patrón incorrecto! <dark_red>[<gold>pase el cursor aquí<dark_red>]'
    trim_pattern: '%prefix% <red>¡Valor de patrón de ajuste de armadura incorrecto! <dark_red>[<gold>pase el cursor aquí<dark_red>]'
    boolean: '%prefix% <red>¡Valor booleano incorrecto! <dark_red>[<gold>pase el cursor aquí<dark_red>]'
    attribute: '%prefix% <red>¡Valor de atributo incorrecto! <dark_red>[<gold>pase el cursor aquí<dark_red>]'
    operation: '%prefix% <red>¡Valor de operación incorrecto! <dark_red>[<gold>pase el cursor aquí<dark_red>]'
    itemrarity: '%prefix% <red>¡Valor de rareza incorrecto! <dark_red>[<gold>pase el cursor aquí<dark_red>]'
    entitytype: '%prefix% <red>¡Valor de tipo de entidad incorrecto! <dark_red>[<gold>pase el cursor aquí<dark_red>]'
    entitygroups: '%prefix% <red>¡Valor de grupo de entidad incorrecto! <dark_red>[<gold>pase el cursor aquí<dark_red>]'
    consumable_effect: '%prefix% <red>¡Valor de efecto de consumible incorrecto! <dark_red>[<gold>pase el cursor aquí<dark_red>]'
    goat_horn_sound: '%prefix% <red>¡Valor de sonido de cuerno de cabra incorrecto! <dark_red>[<gold>pase el cursor aquí<dark_red>]'
    error-pre-hover: '<gradient:#A78BFA:gold><b>Alias:</b></gradient>'
    first_color: '<aqua>'
    second_color: '<yellow>'
itemedit:
  amount:
    description:
      - '<gradient:#A78BFA:gold><b>Establecer cantidad</b></gradient>'
      - ''
      - '<gray><yellow><amount> </yellow>cantidad a configurar (hasta 127)'
      - '<gold><b>Consejo</b></gold> <gray>Se restan cantidades negativas'
      - '<gray> del monto actual del objeto'
    params: '<amount>'
    feedback: '%prefix% <green>Cantidad del objeto establecida en <yellow>%amount%'
    feedback-decrease: '%prefix% <green>El importe del objeto disminuyó en <yellow>%amount%'
  attribute:
    description:
      - '<gradient:#A78BFA:gold><b>Editar modificadores de atributos</b></gradient>'
      - ''
      - '<gray><yellow>Add <attribute> <amount> [operation] [slot] </yellow><dark_gray>»</dark_gray> agregar nuevos modificadores'
      - '<gray><yellow>Remove <attribute/slot> </yellow><dark_gray>»</dark_gray> elimina algunos modificadores'
    params: '<add/remove> [...]'
    add:
      params: '<attribute> <amount> [operation] [slot]'
      description:
        - '<gradient:#A78BFA:gold><b>Agregar modificador de atributo</b></gradient>'
        - ''
        - '<gray><yellow><attribute> </yellow>tipo de atributo'
        - '<gray><yellow><amount> </yellow>cantidad a configurar'
        - '<gray><yellow>[operation] </yellow>cómo se agrega el modificador, por defecto sumas'
        - '<gray><yellow>[slot] </yellow>aplica este modificador solo cuando el elemento está seleccionado'
        - '<gray> espacio para equipo o cualquier espacio para equipo si no está seleccionado'
      feedback: '%prefix% <green>Modificador agregado'
    remove:
      params: '<attribute/slot>'
      description:
        - '<gradient:#A78BFA:gold><b>Eliminar modificadores</b></gradient>'
        - ''
        - '<gray><yellow><attribute/slot> </yellow>tipo para eliminar, cualquier modificador con'
        - '<gray> se eliminan los valores seleccionados'
      feedback-attribute: '%prefix% <green>Se eliminaron modificadores de atributo'
      feedback-equipment: '%prefix% <green>Se eliminaron modificadores de la ranura de equipo.'
  axolotlvariant:
    description:
      - '<gradient:#A78BFA:gold><b>Editar variante de Axolotl en cubo de Axolotl</b></gradient>'
      - '<white><sprite:items:item/axolotl_bucket>'
      - '<gray><yellow><type> </yellow>el tipo de ajolote'
    params: '<type>'
    feedback: '%prefix% <green>Se cambió la variante de Axolotl a <yellow>%variant%'
  banner:
    description:
      - '<gradient:#A78BFA:gold><b>Editar banner</b></gradient>'
    params: '<add/set/remove/color> [...]'
    set:
      params: '<type> <color> <line>'
      description:
        - '<gradient:#A78BFA:gold><b>Reemplazar el patrón en la línea seleccionada</b></gradient>'
      feedback: '%prefix% <green>Conjunto de patrones'
    add:
      params: '<type> <color>'
      description:
        - '<gradient:#A78BFA:gold><b>Agregar un patrón</b></gradient>'
      feedback: '%prefix% <green>Patrón agregado'
    remove:
      params: '<line>'
      description:
        - '<gradient:#A78BFA:gold><b>Eliminar patrón en la línea seleccionada</b></gradient>'
      feedback: '%prefix% <green>Patrón eliminado'
    color:
      params: '<line> <color>'
      description:
        - '<gradient:#A78BFA:gold><b>Cambiar color de patrón en la línea seleccionada</b></gradient>'
      feedback: '%prefix% <green>Patrón recoloreado'
  bookauthor:
    description:
      - '<gradient:#A78BFA:gold><b>Establecer autor</b></gradient>'
      - '<white><sprite:items:item/written_book>'
      - '<gray>El nombre del autor puede contener espacios y también estar coloreado'
      - '<gray>Funciona solo en libros escritos'
    params: '<name>'
    feedback: '%prefix% <green>Autor del libro actualizado'
    feedback-reset: '%prefix% <green>Restablecer autor del libro'
  bookenchant:
    description:
      - '<gradient:#A78BFA:gold><b>Establecer encantamientos en el libro</b></gradient>'
      - '<white><sprite:items:item/enchanted_book> <sprite:items:item/book>'
      - '<gray>La diferencia entre enchant y bookenchant es que'
      - '<gray>un libro con enchant aspecto de fuego prende fuego a los objetivos cuando los golpea'
      - '<gray>mientras que un libro con bookenchant no'
      - ''
      - '<gray><yellow><enchant> </yellow>tipo de encantamiento'
      - '<gray><yellow>[level] </yellow>nivel del encantamiento, por defecto <yellow>1'
      - ''
      - '<gold><b>Consejo</b></gold> <gray>Establece <yellow>[level] </yellow> en <yellow>0 </yellow> para eliminar un encantamiento'
    params: '<enchant> [level]'
    feedback-removed: '%prefix% <green>Encantamiento de libro eliminado <yellow>%enchant%'
    feedback: '%prefix% <green>Encantamiento de libro aplicado <yellow>%enchant% <green>lv <yellow>%lv%'
  booktype:
    description:
      - '<gradient:#A78BFA:gold><b>Establecer tipo de libro</b></gradient>'
      - '<white><sprite:items:item/written_book>'
      - '<gray>Funciona solo en libros escritos'
    params: '<booktype>'
    feedback: '%prefix% <green>Se actualizó la generación de libros a <yellow>%generation%'
    feedback-reset: '%prefix% <green>Restablecer generación de libro'
  color:
    description:
      - '<gradient:#A78BFA:gold><b>Establecer color</b></gradient>'
      - '<white><sprite:items:item/potion> <sprite:items:item/tipped_arrow_base> <sprite:items:item/firework_star> <sprite:items:item/leather_chestplate>'
      - '<gray>¡Funciona con armaduras de cuero y estrellas de fuegos artificiales, pociones y flechas con efectos de pociones también!'
      - '<gray><yellow>[red] [green] [blue] </yellow>son la cantidad de cada color a combinar'
      - '<gray>Cada color es un valor int entre 0 y 255'
      - '<gray>Si está confundido, busque en Google "<yellow>Selector de color RGB</yellow>"'
    params: '[red] [green] [blue]'
    feedback: '%prefix% <green>Color actualizado'
  compass:
    description:
      - '<gradient:#A78BFA:gold><b>Establecer ubicación de destino de la brújula</b></gradient>'
      - '<white><sprite:items:item/compass_00>'
      - '<gray><yellow>Set </yellow><dark_gray>»</dark_gray> establece tu ubicación como objetivo de la brújula'
      - '<gray><yellow>Clear </yellow><dark_gray>»</dark_gray> despejar el objetivo de la brújula'
    params: '<set/clear>'
    set:
      feedback: '%prefix% <green>La brújula ahora apunta a <yellow>%world% %x% %y% %z%'
    clear:
      feedback: '%prefix% <green>Objetivo de la brújula borrado'
  custommodeldata:
    description:
      - '<gradient:#A78BFA:gold><b>Editar datos de modelo personalizados</b></gradient>'
      - ''
      - '<gray>Usado para paquetes de texturas'
      - '<gray><yellow>[value] </yellow>int positivo del modelo de datos de destino'
      - '<gray>Nota: los servidores modernos usan itemmodel en lugar de custommodeldata'
      - '<gray> para texturas, este comando es para clientes heredados'
    params: '<value>'
    feedback: '%prefix% <green>Datos del modelo personalizado actualizados'
    feedback-reset: '%prefix% <green>Restablecer datos del modelo personalizado'
  damage:
    description:
      - '<gradient:#A78BFA:gold><b>Editar durabilidad</b></gradient>'
      - ''
      - '<gray><yellow><durability> </yellow>daño a aplicar'
      - '<gray><gold>N.B.</gold> <yellow>0 </yellow>significa que no hay daños, durabilidad total'
    params: '<durability>'
    feedback-reset: '%prefix% <green>Durabilidad restaurada'
    feedback: '%prefix% <green>Durabilidad actualizada'
  equipment:
    description:
      - '<gradient:#A78BFA:gold><b>Establece la propiedad de equipo del objeto</b></gradient>'
      - ''
      - '<gray><gold><b>Consejo</b></gold> Uso /itemequip or /iee'
      - '<gray><gold>N.B.</gold> tus objetos bebibles no se pueden comer'
    params: ''
  enchant:
    description:
      - '<gradient:#A78BFA:gold><b>Establecer encantamientos</b></gradient>'
      - ''
      - '<gray><yellow><enchant> </yellow>tipo de encantamiento'
      - '<gray><yellow>[level] </yellow>nivel del encantamiento, por defecto <yellow>1'
      - ''
      - '<gold><b>Consejo</b></gold> <gray>Establece <yellow>[level] </yellow> en <yellow>0 </yellow> para eliminar un encantamiento'
    params: '<enchant> [level]'
    feedback-removed: '%prefix% <green>Encantamiento eliminado <yellow>%enchant%'
    feedback: '%prefix% <green>Encantamiento aplicado <yellow>%enchant% <green>lv <yellow>%lv%'
  fireresistent:
    description:
      - '<gradient:#A78BFA:gold><b>Establece la resistencia del objeto a fuego/lava</b></gradient>'
      - ''
      - '<gray><yellow>[true/false] </yellow>establece el valor, alternar de forma predeterminada'
      - ''
      - '<gray>Un objeto con resistencia al fuego no será destruido'
      - '<gray> al caer al fuego y flotará sobre lava'
    params: '[true/false]'
    feedback: '%prefix% <green>Resistencia al fuego establecida en <yellow>%value%'
  fireworkpower:
    description:
      - '<gradient:#A78BFA:gold><b>Establecer potencia de fuegos artificiales</b></gradient>'
      - '<white><sprite:items:item/firework_rocket>'
      - '<gray><yellow><power> </yellow>potencia del fuego artificial, un valor entre <yellow>0 </yellow>y <yellow>5'
    params: '<power>'
    feedback: '%prefix% <green>Poder de fuegos artificiales actualizado'
  firework:
    description:
      - '<gradient:#A78BFA:gold><b>Editar fuegos artificiales con una GUI</b></gradient>'
      - '<white><sprite:items:item/firework_rocket>'
    params: ''
  food:
    description:
      - '<gradient:#A78BFA:gold><b>Establece la propiedad alimentaria del objeto</b></gradient>'
      - ''
      - '<gray><gold><b>Consejo</b></gold> Uso /itemfood or /if'
      - '<gray><gold>N.B.</gold> tus objetos bebibles no se pueden comer'
    params: ''
  glider:
    description:
      - '<gradient:#A78BFA:gold><b>Establecer estado del planeador</b></gradient>'
      - ''
      - '<gray>El elemento planeador debería permitir deslizarse como en los élitros'
      - '<gray><yellow>[true/false] </yellow>establecer el valor del planeador, alternar de forma predeterminada'
    params: '[true/false]'
    feedback: '%prefix% <green>Deslizamiento actualizado configurado en <yellow>%value%'
  glow:
    description:
      - '<gradient:#A78BFA:gold><b>Anular efecto de brillo de encantamiento</b></gradient>'
      - ''
      - '<gray><yellow>[true/false] </yellow>establecer el valor, restablecer de forma predeterminada'
      - ''
      - '<gold><b>Consejo</b></gold> <gray><yellow>sin valor especificado </yellow>restaurar el comportamiento estándar'
    params: '[true/false/default]'
    feedback: '%prefix% <green>Brillo configurado en <yellow>%value%'
    feedback-reset: '%prefix% <green>Restablecer el valor de brillo predeterminado'
  goathornsound:
    description:
      - '<gradient:#A78BFA:gold><b>Establecer sonido de cuerno de cabra</b></gradient>'
      - '<white><sprite:items:item/goat_horn>'
      - '<gray><yellow><type> </yellow>el tipo de sonido'
    params: '<type>'
    feedback: '%prefix% <green>Sonido actualizado'
  hide:
    description:
      - '<gradient:#A78BFA:gold><b>Ocultar o mostrar componentes</b></gradient>'
      - ''
      - '<gray><yellow><flag> </yellow>marca de elemento para editar'
      - '<gray><yellow>[true/false] </yellow>establecer el valor de el indicador, alternar de forma predeterminada'
      - ''
      - '<gold><b>Consejo</b></gold> <gray>ocultar patrones de pancartas con el indicador potion_effects'
      - '<gold><b>Consejo</b></gold> <gray>oculta todas los indicadores a la vez con <yellow>/itemedit hideall'
    params: '<flag> [true/false]'
    feedback: '%prefix% <green>El indicador ahora es <yellow>%value%'
  hidetooltip:
    description:
      - '<gradient:#A78BFA:gold><b>Ocultar o mostrar información sobre herramientas</b></gradient>'
      - ''
      - '<gray><yellow>[true/false] </yellow>establecer el valor de el indicador, alternar de forma predeterminada'
    params: '[true/false]'
    feedback: '%prefix% <green>El estado oculto de información sobre herramientas ahora es <yellow>%value%'
  hideall:
    description:
      - '<gradient:#A78BFA:gold><b>Ocultar todos los componentes</b></gradient>'
      - ''
      - '<gray>Ocultos: encantamientos, efectos de pociones, capas de banner, atributos...'
      - ''
      - '<gold><b>Consejo</b></gold> <gray>oculte componentes individuales con <yellow>/itemedit hide <flag> true'
    params: ''
    feedback: '%prefix% <green>Ocultas todas los indicadores'
  itemmodel:
    description:
      - '<gradient:#A78BFA:gold><b>Editar modelo de objeto</b></gradient>'
      - ''
      - '<gray><yellow><namespaced key> </yellow>tecla para configurar la referencia de textura'
      - '<gray>Ejemplo: /ie itemmodel <yellow>iron_sword'
      - '<gray>Ejemplo: /ie itemmodel <yellow>minecraft:iron_sword'
      - ''
      - '<gray><yellow><namespace></yellow>:<yellow><id></yellow> hará referencia al modelo:'
      - '  /assets/<yellow><namespace></yellow>/models/item/<yellow><id>'
    params: '<namespaced key>'
    feedback: '%prefix% <green>Modelo de objeto actualizado'
    feedback-reset: '%prefix% <green>Restablecer modelo de objeto'
  kinetic:
    description:
      - '<gradient:#A78BFA:gold><b>Establece la propiedad cinética del objeto</b></gradient>'
      - '<white><sprite:items:item/iron_spear>'
      - '<gray><gold><b>Consejo</b></gold> Uso /itemkinetic or /iek'
    params: ''
  maxdurability:
    description:
      - '<gradient:#A78BFA:gold><b>Establece la durabilidad máxima del objeto</b></gradient>'
      - ''
      - '<gray><yellow><max durability> </yellow>valor de durabilidad del nuevo objeto,'
      - '<gray> debe ser mayor que 1'
    params: '<max durability>'
    feedback: '%prefix% <green>Se actualizó la durabilidad máxima a <yellow>%value%'
  maxstacksize:
    description:
      - '<gradient:#A78BFA:gold><b>Establece el tamaño máximo de pila del elemento</b></gradient>'
      - ''
      - '<gray><yellow>[1-99] </yellow>establecer el valor de el indicador'
      - ''
      - '<gray><yellow>sin valor </yellow> restaurará el tamaño de pila común que es <yellow>64'
      - '<gray> para la mayoría de los objetos, <yellow>1</yellow> para armaduras y herramientas, y otros'
      - '<gray> valores para algunos objetos'
    params: '[1-99]'
    feedback: '%prefix% <green>Se actualizó el tamaño máximo de pila a <yellow>%value%'
    feedback-reset: '%prefix% <green>Restablecer tamaño máximo de pila'
  pierce:
    description:
      - '<gradient:#A78BFA:gold><b>Establece las propiedades del arma perforadora del objeto</b></gradient>'
      - '<white><sprite:items:item/iron_spear>'
      - '<gold><b>Consejo</b></gold><gray> Uso /itempiercing or /iep'
    params: ''
  potioneffect:
    itemtag-tip: '%prefix% <gray>¿Necesitas agregar efectos de poción a elementos comunes? prueba >ItemTag<'
    itemtag-tip-hover:
      - '<gradient:#A78BFA:gold>Haz clic en mí</gradient>'
    description:
      - '<gradient:#A78BFA:gold><b>Editar efectos de poción</b></gradient>'
      - '<white><sprite:items:item/potion> <sprite:items:item/suspicious_stew> <sprite:items:item/tipped_arrow_base>'
      - '<gray>¡Funciona con cualquier poción, flechas con efectos de poción y estofado sospechoso!'
      - '<gray><yellow>Add <effect> <duration> [level] </yellow><dark_gray>»</dark_gray> añadir efecto'
      - '<gray><yellow>Remove <effect> </yellow><dark_gray>»</dark_gray> elimina el efecto seleccionado'
      - '<gray><yellow>Reset </yellow><dark_gray>»</dark_gray> eliminar todos los efectos'
    params: '<add/remove/reset> [...]'
    add:
      params: '<effect> <duration> [level] [particles] [ambient] [icon]'
      description:
        - '<gradient:#A78BFA:gold><b>Agrega/Anula el efecto seleccionado</b></gradient>'
        - ''
        - '<gray><yellow><effect> </yellow>tipo de efecto'
        - '<gray><yellow><duration> </yellow>duración en segundos'
        - '<gray><yellow>[level] </yellow>Hasta 127, por defecto <yellow>1'
