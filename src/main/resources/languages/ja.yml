    error-pre-hover: '<gradient:#A78BFA:gold><b>別名:</b></gradient>'
    first_color: '<aqua>'
    second_color: '<yellow>'
itemedit:
  amount:
    description:
      - '<gradient:#A78BFA:gold><b>設定金額</b></gradient>'
      - ''
      - '<gray><yellow><amount> </yellow>設定する量（最大127）'
      - "<gold><b>チップ</b></gold> <gray>マイナスの金額は差し引かれます\nアイテム現在の金額から"
      - '<gray>'
    params: '<amount>'
    feedback: '%prefix% <green>アイテム数量が<yellow>%amount%に設定されました'
    feedback-decrease: '%prefix% <green>アイテム量が<yellow>%amount%減少しました'
  attribute:
    description:
      - '<gradient:#A78BFA:gold><b>属性修飾子の編集</b></gradient>'
      - ''
      - '<gray><yellow>Add <attribute> <amount> [operation] [slot] </yellow><dark_gray>»</dark_gray> 新しい修飾子を追加'
      - '<gray><yellow>Remove <attribute/slot> </yellow><dark_gray>»</dark_gray> はいくつかの修飾子を削除します'
    params: '<add/remove> [...]'
    add:
      params: '<attribute> <amount> [operation] [slot]'
      description:
        - '<gradient:#A78BFA:gold><b>属性修飾子を追加</b></gradient>'
        - ''
        - '<gray><yellow><attribute> </yellow>属性タイプ'
        - '<gray><yellow><amount> </yellow>設定する金額'
        - '<gray><yellow>[operation] </yellow>修飾子の追加方法、デフォルトでは合計'
        - '<gray><yellow>[slot] </yellow>項目が選択されている場合にのみこの修飾子を適用します'
        - '<gray> 機器スロット、または選択されていない場合は任意の機器スロット'
      feedback: '%prefix% <green>修飾子を追加しました'
    remove:
      params: '<attribute/slot>'
      description:
        - '<gradient:#A78BFA:gold><b>修飾子の削除</b></gradient>'
        - ''
        - '<gray><yellow><attribute/slot> </yellow> を入力して削除します。修飾子はすべて削除されます'
        - '<gray> 選択した値が削除されます'
      feedback-attribute: '%prefix% <green>属性の修飾子を削除しました'
      feedback-equipment: '%prefix% <green>装備スロットの修飾子を削除'
  axolotlvariant:
    description:
      - '<gradient:#A78BFA:gold><b>ウーパールーパー バケットのウーパールーパー バリアントを編集</b></gradient>'
      - '<white><sprite:items:item/axolotl_bucket>'
      - '<gray><yellow><type> </yellow>ウーパールーパーの種類'
    params: '<type>'
    feedback: '%prefix% <green>ウーパールーパーのバリエーションを <yellow>%variant% に変更しました'
  banner:
    description:
      - '<gradient:#A78BFA:gold><b>バナーを編集</b></gradient>'
    params: '<add/set/remove/color> [...]'
    set:
      params: '<type> <color> <line>'
      description:
        - '<gradient:#A78BFA:gold><b>選択した行のパターンを置き換えます</b></gradient>'
      feedback: '%prefix% <green>パターンセット'
    add:
      params: '<type> <color>'
      description:
        - '<gradient:#A78BFA:gold><b>パターンを追加</b></gradient>'
      feedback: '%prefix% <green>パターン追加'
    remove:
      params: '<line>'
      description:
        - '<gradient:#A78BFA:gold><b>選択した行のパターンを削除</b></gradient>'
      feedback: '%prefix% <green>パターンを削除しました'
    color:
      params: '<line> <color>'
      description:
        - '<gradient:#A78BFA:gold><b>選択した行のパターンの色を変更します</b></gradient>'
      feedback: '%prefix% <green>パターンの色を変更しました'
  bookauthor:
    description:
      - '<gradient:#A78BFA:gold><b>作成者を設定</b></gradient>'
      - '<white><sprite:items:item/written_book>'
      - '<gray>著者名にはスペースが含まれたり、色が付けられたりする場合があります'
      - '<gray>書かれた本のみで動作します'
    params: '<name>'
    feedback: '%prefix% <green>本の著者を更新しました'
    feedback-reset: '%prefix% <green>本の著者をリセット'
  bookenchant:
    description:
      - '<gradient:#A78BFA:gold><b>本にエンチャントを設定します</b></gradient>'
      - '<white><sprite:items:item/enchanted_book> <sprite:items:item/book>'
      - '<gray> enchant と bookenchant の違いは'
      - '<gray>enchant 火のアスペクトを持つ本は、命中するとターゲットに火をつけます'
      - '<gray>一方、bookenchant の本はそうではありません'
      - ''
      - '<gray><yellow><enchant> </yellow>エンチャントタイプ'
      - '<gray><yellow>[level] </yellow>エンチャントのレベル、デフォルトでは <yellow>1'
      - ''
      - '<gold><b>ヒント</b></gold> <gray>エンチャントを削除するには、<yellow>[level] </yellow>を<yellow>0 </yellow>に設定します'
    params: '<enchant> [level]'
    feedback-removed: '%prefix% <green>本のエンチャントを削除しました <yellow>%enchant%'
    feedback: '%prefix% <green>本のエンチャントを適用 <yellow>%enchant% <green>lv <yellow>%lv%'
  booktype:
    description:
      - '<gradient:#A78BFA:gold><b>セットブックタイプ</b></gradient>'
      - '<white><sprite:items:item/written_book>'
      - '<gray>書かれた本のみで動作します'
    params: '<booktype>'
    feedback: '%prefix% <green>本の生成を <yellow>%generation% に更新しました'
    feedback-reset: '%prefix% <green>本の生成をリセット'
  color:
    description:
      - '<gradient:#A78BFA:gold><b>色を設定</b></gradient>'
      - '<white><sprite:items:item/potion> <sprite:items:item/tipped_arrow_base> <sprite:items:item/firework_star> <sprite:items:item/leather_chestplate>'
      - '<gray>革の鎧や花火の星、ポーションやポーション効果のある矢にも使用できます。'
      - '<gray><yellow>[red] [green] [blue] </yellow>は組み合わせる各色の量です'
      - '<gray>各色は 0 ～ 255 の int 値です'
      - '<gray>混乱している場合は、「<yellow>RGB カラーピッカー</yellow>」をグーグルしてください'
    params: '[red] [green] [blue]'
    feedback: '%prefix% <green>色を更新しました'
  compass:
    description:
      - '<gradient:#A78BFA:gold><b>コンパスの目標位置を設定</b></gradient>'
      - '<white><sprite:items:item/compass_00>'
      - '<gray><yellow>Set </yellow><dark_gray>»</dark_gray> 現在地をコンパスの目標として設定します'
      - '<gray><yellow>Clear </yellow><dark_gray>»</dark_gray> コンパスターゲットをクリア'
    params: '<set/clear>'
    set:
      feedback: '%prefix% <green>コンパスは<yellow>%world% %x% %y% %z%を指します'
    clear:
      feedback: '%prefix% <green>コンパスターゲットをクリアしました'
  custommodeldata:
    description:
      - '<gradient:#A78BFA:gold><b>カスタムモデルデータ編集</b></gradient>'
      - ''
      - '<gray>テクスチャ パックに使用されます'
      - '<gray><yellow>[value] </yellow>対象データモデルの正の整数'
      - '<gray>注: 最新のサーバーでは itemmodel の代わりに custommodeldata'
      - '<gray>、このコマンドはレガシー クライアント用です'
    params: '<value>'
    feedback: '%prefix% <green>カスタムモデルデータを更新しました'
    feedback-reset: '%prefix% <green>カスタムモデルデータリセット'
  damage:
    description:
      - '<gradient:#A78BFA:gold><b>耐久性編集</b></gradient>'
      - ''
      - '<gray><yellow><durability> </yellow>ダメージを与える'
      - '<gray><gold>N.B.</gold> <yellow>0 </yellow>は損傷がなく、完全な耐久性を意味します'
    params: '<durability>'
    feedback-reset: '%prefix% <green>耐久性が回復しました'
    feedback: '%prefix% <green>耐久性を更新しました'
  equipment:
    description:
      - '<gradient:#A78BFA:gold><b>アイテムの装備プロパティを設定します</b></gradient>'
      - ''
      - '<gray><gold><b>ヒント</b></gold> /itemequip or /ieeを使用'
      - '<gray><gold>注意</gold> 飲み物は食べられません'
    params: ''
  enchant:
    description:
      - '<gradient:#A78BFA:gold><b>エンチャントを設定</b></gradient>'
      - ''
      - '<gray><yellow><enchant> </yellow>エンチャントタイプ'
      - '<gray><yellow>[level] </yellow>エンチャントのレベル、デフォルトでは <yellow>1'
      - ''
      - '<gold><b>ヒント</b></gold> <gray>エンチャントを削除するには、<yellow>[level] </yellow>を<yellow>0 </yellow>に設定します'
    params: '<enchant> [level]'
    feedback-removed: '%prefix% <green>エンチャントを削除しました <yellow>%enchant%'
    feedback: '%prefix% <green>適用されたエンチャント <yellow>%enchant% <green>lv <yellow>%lv%'
  fireresistent:
    description:
      - '<gradient:#A78BFA:gold><b>火/溶岩に対するアイテムの耐性を設定します</b></gradient>'
      - ''
      - '<gray><yellow>[true/false] </yellow>値を設定します。デフォルトではトグルになります。'
      - ''
      - '<gray>耐火性のあるアイテムは壊れません'
      - '<gray> 火の中に落ちると溶岩の上に浮かびます'
    params: '[true/false]'
    feedback: '%prefix% <green>耐火性を<yellow>%value%に設定'
  fireworkpower:
    description:
      - '<gradient:#A78BFA:gold><b>花火パワーを設定</b></gradient>'
      - '<white><sprite:items:item/firework_rocket>'
      - '<gray><yellow><power> </yellow>花火の威力、<yellow>0 </yellow>と<yellow>5の間の値'
    params: '<power>'
    feedback: '%prefix% <green>花火パワーを更新しました'
  firework:
    description:
      - '<gradient:#A78BFA:gold><b>GUI で花火を編集</b></gradient>'
      - '<white><sprite:items:item/firework_rocket>'
    params: ''
  food:
    description:
      - '<gradient:#A78BFA:gold><b>アイテムの食品プロパティを設定します</b></gradient>'
      - ''
      - '<gray><gold><b>ヒント</b></gold> /itemfood or /ifを使用'
      - '<gray><gold>注意</gold> 飲み物は食べられません'
    params: ''
  glider:
    description:
      - '<gradient:#A78BFA:gold><b>グライダーの状態を設定</b></gradient>'
      - ''
      - '<gray>グライダーアイテムはエリトラのように滑空できるようにする必要があります'
      - '<gray><yellow>[true/false] </yellow>グライダー値を設定します。デフォルトでトグルします。'
    params: '[true/false]'
    feedback: '%prefix% <green>グライディング設定を<yellow>%value%に更新しました'
  glow:
    description:
      - '<gradient:#A78BFA:gold><b>エンチャントのグロー効果を上書き</b></gradient>'
      - ''
      - '<gray><yellow>[true/false] </yellow>値を設定、デフォルトではリセット'
      - ''
      - '<gold><b>ヒント</b></gold> <gray><yellow>値が指定されていません </yellow>バニラの動作を復元します'
    params: '[true/false/default]'
    feedback: '%prefix% <green>グローを <yellow>%value% に設定'
    feedback-reset: '%prefix% <green>グロー値をデフォルトにリセット'
  goathornsound:
    description:
      - '<gradient:#A78BFA:gold><b>ヤギの角の音を設定します</b></gradient>'
      - '<white><sprite:items:item/goat_horn>'
      - '<gray><yellow><type> </yellow>音の種類'
    params: '<type>'
    feedback: '%prefix% <green>サウンドを更新'
  hide:
    description:
      - '<gradient:#A78BFA:gold><b>コンポーネントの表示または非表示</b></gradient>'
      - ''
      - '<gray><yellow><flag> </yellow>編集する項目フラグ'
      - '<gray><yellow>[true/false] </yellow>フラグ値を設定します。デフォルトではトグルします。'
      - ''
      - '<gold><b>ヒント</b></gold> <gray> potion_effects フラグでバナーパターンを隠す'
      - '<gold><b>ヒント</b></gold> <gray> <yellow>/itemedit hideall ですべてのフラグを一度に非表示にします'
    params: '<flag> [true/false]'
    feedback: '%prefix% <green>フラグは<yellow>%value%になりました'
  hidetooltip:
    description:
      - '<gradient:#A78BFA:gold><b>ツールチップの表示または非表示</b></gradient>'
      - ''
      - '<gray><yellow>[true/false] </yellow>フラグ値を設定します。デフォルトではトグルします。'
    params: '[true/false]'
    feedback: '%prefix% <green>ツールヒントの非表示ステータスは <yellow>%value%になりました'
  hideall:
    description:
      - '<gradient:#A78BFA:gold><b>すべてのコンポーネントを非表示</b></gradient>'
      - ''
      - '<gray>非表示: エンチャント、ポーション効果、バナーレイヤー、属性...'
      - ''
      - '<gold><b>ヒント</b></gold> <gray> <yellow>/itemedit hide <flag> true で単一コンポーネントを非表示にする'
    params: ''
    feedback: '%prefix% <green>フラグをすべて非表示にしました'
  itemmodel:
    description:
      - '<gradient:#A78BFA:gold><b>アイテムモデルを編集</b></gradient>'
      - ''
      - '<gray><yellow><namespaced key> </yellow>テクスチャ参照を設定するキー'
      - '<gray>例: /ie itemmodel <yellow>iron_sword'
      - '<gray>例: /ie itemmodel <yellow>minecraft:iron_sword'
      - ''
      - '<gray><yellow><namespace></yellow>:<yellow><id></yellow> はモデルを参照します:'
      - '  /assets/<yellow><namespace></yellow>/models/item/<yellow><id>'
    params: '<namespaced key>'
    feedback: '%prefix% <green>アイテムモデルを更新'
    feedback-reset: '%prefix% <green>項目をリセット モデル'
  kinetic:
    description:
