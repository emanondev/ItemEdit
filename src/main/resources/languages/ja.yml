    banner: '%prefix% <red>アイテムはバナーである必要があります'
    damageable: '%prefix% <red>アイテムには道具や防具と同様の耐久性が必要です'
    player_head: '%prefix% <red>アイテムはプレイヤーヘッドである必要があります'
    rgb_colorable: '%prefix% <red>アイテムは、革の鎧、花火の星、ポーション、またはポーション効果のある矢などの色付け可能なタイプである必要があります'
    written_book: '%prefix% <red>商品は書籍である必要があります'
