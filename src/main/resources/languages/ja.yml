    animations: '%prefix% <red>アニメーション値が間違っています! <dark_red>[<gold>ここにカーソルを合わせてください<dark_red>]'
    sound: '%prefix% <red>音価が間違っています! <dark_red>[<gold>ここにカーソルを合わせてください<dark_red>]'
    enchant: '%prefix% <red>エンチャント値が間違っています! <dark_red>[<gold>ここにカーソルを合わせてください<dark_red>]'
    flag_type: '%prefix% <red>フラグ値が間違っています! <dark_red>[<gold>ここにカーソルを合わせてください<dark_red>]'
    book_type: '%prefix% <red>本の種類の値が間違っています! <dark_red>[<gold>ここにカーソルを合わせてください<dark_red>]'
    equip_slot: '%prefix% <red>装備スロットの値が間違っています! <dark_red>[<gold>ここにカーソルを合わせてください<dark_red>]'
    banner_pattern: '%prefix% <red>パターン値が間違っています! <dark_red>[<gold>ここにカーソルを合わせてください<dark_red>]'
