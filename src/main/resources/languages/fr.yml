    #Holders: %id%
    success: '%prefix% <green>Article <yellow>%id% <green>enregistré'
    #Holders: %limit%
    limit-reached: '%prefix% <red>Vous avez atteint le nombre maximum d''objets pouvant être sauvegardés (%limit%)'
