      - '<gray><yellow>Paste </yellow><dark_gray>»</dark_gray> coller la dernière description de l''objet copié'
      - '<gray><yellow>Replace <replaced> <replacer> </yellow><dark_gray>»</dark_gray> remplace toutes les occurrences'
    params: '<add/set/remove...> [...]'
    set:
      params: '<line> <text>'
      description:
        - '<gradient:#A78BFA:gold><b>Définir ou remplacer le texte sur la ligne sélectionnée</b></gradient>'
    remove:
      params: '<line>'
      description:
        - '<gradient:#A78BFA:gold><b>Supprimer la ligne sélectionnée</b></gradient>'
    insert:
      params: '<line> <text>'
      description:
