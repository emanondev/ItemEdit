      - '<gray><yellow>Reset </yellow><dark_gray>»</dark_gray> supprimer toutes les lignes'
      - '<gray><yellow>Copy </yellow><dark_gray>»</dark_gray> copier la description de l''objet actuel pour la coller plus tard'
