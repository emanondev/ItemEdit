generic:
  help:
    player-only: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <red>Commande réservée aux joueurs'
    no-item-on-hand: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <red>Vous devez tenir un objet en main'
    lack-permission: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <red>Vous n''avez pas l''autorisation %permission%'
    lack-permission-generic: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <red>Vous n''êtes pas autorisé à utiliser cette commande'
    blocked-by-censure: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <red>Vous ne pouvez pas utiliser ce texte, il contient des mots bloqués'
    blocked-by-type-restriction: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <red>Vous ne pouvez pas renommer cet objet'
    blocked-by-type-restriction-lore: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <red>Vous ne pouvez pas modifier la description de l''objet sur cet objet'
    blocked-by-lore-line-limit: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <red>Vous ne pouvez pas ajouter plus de lignes de description d''objet sur cet objet'
    blocked-by-lore-length-limit: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <red>Vous ne pouvez pas définir de lignes plus longues que %limit% caractères'
    blocked-by-rename-length-limit: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <red>Vous ne pouvez pas définir de noms de plus de %limit% caractères'

    prefix: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray>'
    header-format: '<gradient:#54acff:#A78BFA><bold>%header%</bold></gradient> <dark_gray>»</dark_gray> <#A78BFA><bold>Aide</bold></#A78BFA>'
    header-sub-format: '<gradient:#54acff:#A78BFA><bold>%header%</bold></gradient> <dark_gray>»</dark_gray> <gradient:#A78BFA:#54acff><bold>%sub%</bold></gradient> <dark_gray>»</dark_gray> <#55d6ff><bold>Aide</#55d6ff>'
    command-format: '<gray>/%command%</gray> <#bad1ff>%sub%</#bad1ff> <#d7bbff>%params%</#d7bbff>'
    footer-format: '%prev_clickable% <#7E9CFD><b>Aide</b> [%page%/%max_page%]</#7E9CFD> %next_clickable%'
    next_text: ' <light_purple><b>><st>> ></st> '
    prev_text: ' <light_purple><b><st>< <</st>< '
    next_void: ' <dark_gray><b>><st>> ></st> '
    prev_void: ' <dark_gray><b><st>< <</st>< '
    next_hover: '<gold><b>Aller à la page %target%'
    prev_hover: '<gold><b>Aller à la page %target%'
  wrong-material:
    axolotl_bucket: '%prefix% <red>L''objet doit être un seau d''axolotl'
    banner: '%prefix% <red>L''objet doit être une bannière'
    damageable: '%prefix% <red>L''objet doit avoir une durabilité comme les outils et les armures'
    player_head: '%prefix% <red>L''objet doit être la tête d''un joueur'
    rgb_colorable: '%prefix% <red>L''objet doit être de type colorable comme des armures de cuir, des étoiles de feu d''artifice, des potions ou des flèches avec des effets de potion'
    written_book: '%prefix% <red>L''objet doit être un livre écrit'
    potion_effect_applicable: '%prefix% <red>L''objet doit être une potion ou une flèche avec un effet de potion ou une soupe suspecte'
    firework: '%prefix% <red>L''objet doit être un feu d''artifice'
    spawner_egg: '%prefix% <red>L''objet doit être un œuf d''apparition'
    tropical_fish_bucket: '%prefix% <red>L''objet doit être un seau à poissons tropicaux'
    writable_book: '%prefix% <red>L''objet doit être un livre écrit ou un livre et une plume'
    compass: '%prefix% <red>L''objet doit être une boussole'
    music_instrument: '%prefix% <red>L''objet doit être une corne de chèvre'
    armor: '%prefix% <red>L''objet doit être une armure'
    enchantment_storage: '%prefix% <red>L''objet doit être un livre ou un livre enchanté'
  wrong-alias:
    axolotl_variant: '%prefix% <red>Valeur Axolotl incorrecte ! <dark_red>[<gold>survolez ici<dark_red>]'
    potion_effect: '%prefix% <red>Valeur d''effet incorrecte ! <dark_red>[<gold>survolez ici<dark_red>]'
    animations: '%prefix% <red>Valeur d''animation incorrecte ! <dark_red>[<gold>survolez ici<dark_red>]'
    sound: '%prefix% <red>Valeur sonore incorrecte ! <dark_red>[<gold>survolez ici<dark_red>]'
    enchant: '%prefix% <red>Valeur d''enchantement incorrecte ! <dark_red>[<gold>survolez ici<dark_red>]'
    flag_type: '%prefix% <red>Valeur de indicateur incorrecte ! <dark_red>[<gold>survolez ici<dark_red>]'
    book_type: '%prefix% <red>Valeur de type de livre incorrecte ! <dark_red>[<gold>survolez ici<dark_red>]'
    equip_slot: '%prefix% <red>Valeur d''emplacement d''équipement incorrecte ! <dark_red>[<gold>survolez ici<dark_red>]'
    banner_pattern: '%prefix% <red>Valeur de motif incorrecte ! <dark_red>[<gold>survolez ici<dark_red>]'
    color: '%prefix% <red>Valeur de couleur incorrecte ! <dark_red>[<gold>survolez ici<dark_red>]'
    mob_type: '%prefix% <red>Valeur de type d''œuf incorrecte ! <dark_red>[<gold>survolez ici<dark_red>]'
    trim_material: '%prefix% <red>Mauvaise garniture d''armure Valeur matérielle ! <dark_red>[<gold>survolez ici<dark_red>]'
    tropical_fish_pattern: '%prefix% <red>Valeur de motif incorrecte ! <dark_red>[<gold>survolez ici<dark_red>]'
    trim_pattern: '%prefix% <red>Valeur du motif de garniture d''armure incorrecte ! <dark_red>[<gold>survolez ici<dark_red>]'
    boolean: '%prefix% <red>Valeur booléenne incorrecte ! <dark_red>[<gold>survolez ici<dark_red>]'
    attribute: '%prefix% <red>Valeur d''attribut incorrecte ! <dark_red>[<gold>survolez ici<dark_red>]'
    operation: '%prefix% <red>Valeur d''opération incorrecte ! <dark_red>[<gold>survolez ici<dark_red>]'
    itemrarity: '%prefix% <red>Valeur de rareté incorrecte ! <dark_red>[<gold>survolez ici<dark_red>]'
    entitytype: '%prefix% <red>Valeur EntityType incorrecte ! <dark_red>[<gold>survolez ici<dark_red>]'
    entitygroups: '%prefix% <red>Valeur EntityGroup incorrecte ! <dark_red>[<gold>survolez ici<dark_red>]'
    consumable_effect: '%prefix% <red>Valeur d''effet du consommable incorrecte ! <dark_red>[<gold>survolez ici<dark_red>]'
    goat_horn_sound: '%prefix% <red>Valeur sonore incorrecte de la corne de chèvre ! <dark_red>[<gold>survolez ici<dark_red>]'
    error-pre-hover: '<gradient:#A78BFA:gold><b>Alias :</b></gradient>'
    first_color: '<aqua>'
    second_color: '<yellow>'
itemedit:
  amount:
    description:
      - '<gradient:#A78BFA:gold><b>Définir le montant</b></gradient>'
      - ''
      - '<gray><yellow><amount> </yellow>montant à définir (jusqu''à 127)'
      - '<gold><b>Astuce</b></gold> <gray>Les montants négatifs sont soustraits'
      - '<gray> du montant actuel de l''objet'
    params: '<amount>'
    feedback: '%prefix% <green>Montant de l''objet fixé à <yellow>%amount%'
    feedback-decrease: '%prefix% <green>Montant de l''objet diminué de <yellow>%amount%'
  attribute:
    description:
      - '<gradient:#A78BFA:gold><b>Modifier les modificateurs d''attribut</b></gradient>'
      - ''
      - '<gray><yellow>Add <attribute> <amount> [operation] [slot] </yellow><dark_gray>»</dark_gray> ajouter de nouveaux modificateurs'
      - '<gray><yellow>Remove <attribute/slot> </yellow><dark_gray>»</dark_gray> supprime certains modificateurs'
    params: '<add/remove> [...]'
    add:
      params: '<attribute> <amount> [operation] [slot]'
      description:
        - '<gradient:#A78BFA:gold><b>Ajouter un modificateur d''attribut</b></gradient>'
        - ''
        - '<gray><yellow><attribute> </yellow>type d''attribut'
        - '<gray><yellow><amount> </yellow>montant à définir'
        - '<gray><yellow>[operation] </yellow>comment le modificateur est ajouté, par défaut'
        - '<gray><yellow>[slot] </yellow>appliquer ce modificateur uniquement lorsque l''objet est sélectionné'
        - '<gray> emplacement d''équipement ou tout emplacement d''équipement s''il n''est pas sélectionné'
      feedback: '%prefix% <green>Modificateur ajouté'
    remove:
      params: '<attribute/slot>'
      description:
        - '<gradient:#A78BFA:gold><b>Supprimer les modificateurs</b></gradient>'
        - ''
        - '<gray><yellow><attribute/slot> </yellow>type à supprimer, tous les modificateurs avec'
        - '<gray> la valeur sélectionnée est supprimée'
      feedback-attribute: '%prefix% <green>Modificateurs d''attribut supprimés'
      feedback-equipment: '%prefix% <green>Modificateurs supprimés de l''emplacement d''équipement'
  axolotlvariant:
    description:
      - '<gradient:#A78BFA:gold><b>Modifier la variante Axolotl sur le seau Axolotl</b></gradient>'
      - '<white><sprite:items:item/axolotl_bucket>'
      - '<gray><yellow><type> </yellow>le type d''axolotl'
    params: '<type>'
    feedback: '%prefix% <green>Modification de la variante Axolotl en <yellow>%variant%'
  banner:
    description:
      - '<gradient:#A78BFA:gold><b>Modifier la bannière</b></gradient>'
    params: '<add/set/remove/color> [...]'
    set:
      params: '<type> <color> <line>'
      description:
        - '<gradient:#A78BFA:gold><b>Remplacer le motif sur la ligne sélectionnée</b></gradient>'
      feedback: '%prefix% <green>Ensemble de motifs'
    add:
      params: '<type> <color>'
      description:
        - '<gradient:#A78BFA:gold><b>Ajouter un motif</b></gradient>'
      feedback: '%prefix% <green>Motif ajouté'
    remove:
      params: '<line>'
      description:
        - '<gradient:#A78BFA:gold><b>Supprimer le motif sur la ligne sélectionnée</b></gradient>'
      feedback: '%prefix% <green>Motif supprimé'
    color:
      params: '<line> <color>'
      description:
        - '<gradient:#A78BFA:gold><b>Changer la couleur du motif sur la ligne sélectionnée</b></gradient>'
      feedback: '%prefix% <green>Motif recoloré'
  bookauthor:
    description:
      - '<gradient:#A78BFA:gold><b>Définir l''auteur</b></gradient>'
      - '<white><sprite:items:item/written_book>'
      - '<gray>Le nom de l''auteur peut contenir des espaces et être également coloré'
      - '<gray>Fonctionne uniquement sur les livres écrits'
    params: '<name>'
    feedback: '%prefix% <green>Auteur du livre mis à jour'
    feedback-reset: '%prefix% <green>Réinitialiser l''auteur du livre'
  bookenchant:
    description:
      - '<gradient:#A78BFA:gold><b>Définissez les enchantements sur le livre</b></gradient>'
      - '<white><sprite:items:item/enchanted_book> <sprite:items:item/book>'
      - '<gray>La différence entre enchant et bookenchant est que'
      - '<gray>un livre avec l''aspect feu enchant met le feu aux cibles lorsqu''il est touché'
      - '<gray>alors qu''un livre avec bookenchant ne le fait pas'
      - ''
      - '<gray><yellow><enchant> </yellow>type d''enchantement'
      - '<gray><yellow>[level] </yellow>niveau d''enchantement, par défaut <yellow>1'
      - ''
      - '<gold><b>Astuce</b></gold> <gray>Réglez <yellow>[level] </yellow>à <yellow>0 </yellow>pour supprimer un enchantement'
    params: '<enchant> [level]'
    feedback-removed: '%prefix% <green>Enchantement de livre supprimé <yellow>%enchant%'
    feedback: '%prefix% <green>Enchantement de livre appliqué <yellow>%enchant% <green>lv <yellow>%lv%'
  booktype:
    description:
      - '<gradient:#A78BFA:gold><b>Définir le type de livre</b></gradient>'
      - '<white><sprite:items:item/written_book>'
      - '<gray>Fonctionne uniquement sur les livres écrits'
    params: '<booktype>'
    feedback: '%prefix% <green>Génération de livres mise à jour vers <yellow>%generation%'
    feedback-reset: '%prefix% <green>Réinitialiser la génération du livre'
  color:
    description:
      - '<gradient:#A78BFA:gold><b>Définir la couleur</b></gradient>'
      - '<white><sprite:items:item/potion> <sprite:items:item/tipped_arrow_base> <sprite:items:item/firework_star> <sprite:items:item/leather_chestplate>'
      - '<gray>Fonctionne également sur les armures de cuir et les étoiles de feux d''artifice, les potions et les flèches avec effets de potion !'
      - '<gray><yellow>[red] [green] [blue] </yellow>sont la quantité de chaque couleur à combiner'
      - '<gray>Chaque couleur est une valeur entière comprise entre 0 et 255'
      - '<gray>Si vous êtes confus, recherchez Google "<yellow>Sélecteur de couleurs RVB</yellow>"'
    params: '[red] [green] [blue]'
    feedback: '%prefix% <green>Couleur mise à jour'
  compass:
    description:
      - '<gradient:#A78BFA:gold><b>Définir l''emplacement cible de la boussole</b></gradient>'
      - '<white><sprite:items:item/compass_00>'
      - '<gray><yellow>Set </yellow><dark_gray>»</dark_gray> définissez votre emplacement comme cible de la boussole'
      - '<gray><yellow>Clear </yellow><dark_gray>»</dark_gray> cible claire de la boussole'
    params: '<set/clear>'
    set:
      feedback: '%prefix% <green>La boussole pointe désormais vers <yellow>%world% %x% %y% %z%'
    clear:
      feedback: '%prefix% <green>Cible de la boussole effacée'
  custommodeldata:
    description:
      - '<gradient:#A78BFA:gold><b>Modifier les données du modèle personnalisé</b></gradient>'
      - ''
      - '<gray>Utilisé pour les packs de textures'
      - '<gray><yellow>[value] </yellow>entier positif du modèle de données cible'
      - '<gray>Remarque : les serveurs modernes utilisent itemmodel au lieu de custommodeldata'
      - '<gray> pour les textures, cette commande est destinée aux anciens clients'
    params: '<value>'
    feedback: '%prefix% <green>Données du modèle personnalisé mises à jour'
    feedback-reset: '%prefix% <green>Réinitialisation des données du modèle personnalisé'
  damage:
    description:
      - '<gradient:#A78BFA:gold><b>Modifier la durabilité</b></gradient>'
      - ''
      - '<gray><yellow><durability> </yellow>dégât à appliquer'
      - '<gray><gold>N.B.</gold> <yellow>0 </yellow>signifie aucun dommage, durabilité totale'
    params: '<durability>'
    feedback-reset: '%prefix% <green>Durabilité restaurée'
    feedback: '%prefix% <green>Durabilité mise à jour'
  equipment:
    description:
      - '<gradient:#A78BFA:gold><b>Définit la propriété d''équipement de l''objet</b></gradient>'
      - ''
      - '<gray><gold><b>Astuce</b></gold> Utilisez /itemequip or /iee'
      - '<gray><gold>N.B.</gold> vos boissons ne peuvent pas être mangées'
    params: ''
  enchant:
    description:
      - '<gradient:#A78BFA:gold><b>Définir les enchantements</b></gradient>'
      - ''
      - '<gray><yellow><enchant> </yellow>type d''enchantement'
      - '<gray><yellow>[level] </yellow>niveau d''enchantement, par défaut <yellow>1'
      - ''
      - '<gold><b>Astuce</b></gold> <gray>Réglez <yellow>[level] </yellow>à <yellow>0 </yellow>pour supprimer un enchantement'
    params: '<enchant> [level]'
    feedback-removed: '%prefix% <green>Enchantement supprimé <yellow>%enchant%'
    feedback: '%prefix% <green>Enchantement appliqué <yellow>%enchant% <green>lv <yellow>%lv%'
  fireresistent:
    description:
      - '<gradient:#A78BFA:gold><b>Définir la résistance de l''objet au feu/lave</b></gradient>'
      - ''
      - '<gray><yellow>[true/false] </yellow>définir la valeur, basculer par défaut'
      - ''
      - '<gray>Un objet résistant au feu ne sera pas détruit'
      - '<gray> en tombant dans le feu et flottera sur la lave'
    params: '[true/false]'
    feedback: '%prefix% <green>Résistance au feu réglée sur <yellow>%value%'
  fireworkpower:
    description:
      - '<gradient:#A78BFA:gold><b>Régler la puissance du feu d''artifice</b></gradient>'
      - '<white><sprite:items:item/firework_rocket>'
      - '<gray><yellow><power> </yellow>puissance du feu d''artifice, une valeur comprise entre <yellow>0 </yellow>et <yellow>5'
    params: '<power>'
    feedback: '%prefix% <green>Puissance du feu d''artifice mise à jour'
  firework:
    description:
      - '<gradient:#A78BFA:gold><b>Modifier un feu d''artifice avec une interface graphique</b></gradient>'
      - '<white><sprite:items:item/firework_rocket>'
    params: ''
  food:
    description:
      - '<gradient:#A78BFA:gold><b>Définit la propriété alimentaire de l''objet</b></gradient>'
      - ''
      - '<gray><gold><b>Astuce</b></gold> Utilisez /itemfood or /if'
      - '<gray><gold>N.B.</gold> vos boissons ne peuvent pas être mangées'
    params: ''
  glider:
    description:
      - '<gradient:#A78BFA:gold><b>Définir l''état du planeur</b></gradient>'
      - ''
      - '<gray>L''objet Planeur devrait permettre de glisser comme sur les élytres'
      - '<gray><yellow>[true/false] </yellow>définir la valeur du planeur, basculer par défaut'
    params: '[true/false]'
    feedback: '%prefix% <green>Gliding mis à jour réglé sur <yellow>%value%'
  glow:
    description:
      - '<gradient:#A78BFA:gold><b>Annuler l''effet de lueur d''enchantement</b></gradient>'
      - ''
      - '<gray><yellow>[true/false] </yellow>définir la valeur, par défaut réinitialiser'
      - ''
      - '<gold><b>Astuce</b></gold> <gray><yellow>aucune valeur spécifiée </yellow>restaurer le comportement de Vanilla'
    params: '[true/false/default]'
    feedback: '%prefix% <green>Lueur réglée sur <yellow>%value%'
    feedback-reset: '%prefix% <green>Réinitialiser la valeur de lueur par défaut'
  goathornsound:
    description:
      - '<gradient:#A78BFA:gold><b>Définir le son de la corne de chèvre</b></gradient>'
      - '<white><sprite:items:item/goat_horn>'
      - '<gray><yellow><type> </yellow>le type de son'
    params: '<type>'
    feedback: '%prefix% <green>Son mis à jour'
  hide:
    description:
      - '<gradient:#A78BFA:gold><b>Masquer ou afficher les composants</b></gradient>'
      - ''
      - '<gray><yellow><flag> </yellow>indicateur d''objet à modifier'
      - '<gray><yellow>[true/false] </yellow>définir la valeur de l''indicateur, basculer par défaut'
      - ''
      - '<gold><b>Astuce</b></gold> <gray>masquer les motifs de bannière avec l''indicateur potion_effects'
      - '<gold><b>Astuce</b></gold> <gray>masquez tous les indicateurs à la fois avec <yellow>/itemedit hideall'
    params: '<flag> [true/false]'
    feedback: '%prefix% <green>L''indicateur est maintenant <yellow>%value%'
  hidetooltip:
    description:
      - '<gradient:#A78BFA:gold><b>Masquer ou afficher les info-bulles</b></gradient>'
      - ''
      - '<gray><yellow>[true/false] </yellow>définir la valeur de l''indicateur, basculer par défaut'
    params: '[true/false]'
    feedback: '%prefix% <green>Le statut masqué de l''info-bulle est désormais <yellow>%value%'
  hideall:
    description:
      - '<gradient:#A78BFA:gold><b>Masquer tous les composants</b></gradient>'
      - ''
      - '<gray>Hides : enchantements, effets de potion, calques de bannière, attributs...'
      - ''
      - '<gold><b>Astuce</b></gold> <gray>masquer les composants uniques avec <yellow>/itemedit hide <flag> true'
    params: ''
    feedback: '%prefix% <green>Caché tous les indicateurs'
  itemmodel:
    description:
      - '<gradient:#A78BFA:gold><b>Modifier le modèle d''objet</b></gradient>'
      - ''
      - '<gray><yellow><namespaced key> </yellow>touche à définir pour la référence de texture'
      - '<gray>Exemple : /ie itemmodel <yellow>iron_sword'
      - '<gray>Exemple : /ie itemmodel <yellow>minecraft:iron_sword'
      - ''
      - '<gray><yellow><namespace></yellow>:<yellow><id></yellow> fera référence au modèle :'
      - '  /assets/<yellow><namespace></yellow>/models/item/<yellow><id>'
    params: '<namespaced key>'
    feedback: '%prefix% <green>Modèle d''objet mis à jour'
    feedback-reset: '%prefix% <green>Réinitialiser le modèle d''objet'
  kinetic:
    description:
      - '<gradient:#A78BFA:gold><b>Définit la propriété cinétique de l''objet</b></gradient>'
      - '<white><sprite:items:item/iron_spear>'
      - '<gray><gold><b>Astuce</b></gold> Utilisez /itemkinetic or /iek'
    params: ''
  maxdurability:
    description:
      - '<gradient:#A78BFA:gold><b>Définit la durabilité maximale de l''objet</b></gradient>'
      - ''
      - '<gray><yellow><max durability> </yellow>objet nouvelle valeur de durabilité,'
      - '<gray> doit être supérieur à 1'
    params: '<max durability>'
    feedback: '%prefix% <green>Durabilité maximale mise à jour à <yellow>%value%'
  maxstacksize:
    description:
      - '<gradient:#A78BFA:gold><b>Définit la taille maximale de la pile de l''objet</b></gradient>'
      - ''
      - '<gray><yellow>[1-99] </yellow>définir la valeur de l''indicateur'
      - ''
      - '<gray><yellow>aucune valeur </yellow>restaurera la taille de pile commune qui est <yellow>64'
      - '<gray> pour la plupart des objets, <yellow>1</yellow> pour les armures et les outils, et autres'
      - '<gray> valeurs pour quelques objets'
    params: '[1-99]'
    feedback: '%prefix% <green>Taille maximale de la pile mise à jour à <yellow>%value%'
    feedback-reset: '%prefix% <green>Réinitialiser la taille maximale de la pile'
  pierce:
    description:
      - '<gradient:#A78BFA:gold><b>Définir les propriétés de l''arme perforante de l''objet</b></gradient>'
      - '<white><sprite:items:item/iron_spear>'
      - '<gold><b>Astuce</b></gold><gray> Utilisez /itempiercing or /iep'
    params: ''
  potioneffect:
    itemtag-tip: '%prefix% <gray>Vous devez ajouter des effets de potion aux objets communs ? essayez >ItemTag<'
    itemtag-tip-hover:
      - '<gradient:#A78BFA:gold>Clique-moi</gradient>'
    description:
      - '<gradient:#A78BFA:gold><b>Modifier les effets de la potion</b></gradient>'
      - '<white><sprite:items:item/potion> <sprite:items:item/suspicious_stew> <sprite:items:item/tipped_arrow_base>'
      - '<gray>Fonctionne sur n''importe quelle potion, flèches avec effets de potion et soupe suspecte !'
      - '<gray><yellow>Add <effect> <duration> [level] </yellow><dark_gray>»</dark_gray> ajouter un effet'
      - '<gray><yellow>Remove <effect> </yellow><dark_gray>»</dark_gray> supprime l''effet sélectionné'
