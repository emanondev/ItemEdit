        - '<gray> pour les fermer à l''intérieur de <yellow>{ }'
        - ''
        - '<gray>Exemple : <yellow>/ie lore replace New Rusty'
        - '<gray>''<yellow>New sword</yellow>'' -> ''<yellow>Rusty sword</yellow>'''
        - ''
        - '<gray>Exemple 2 : <yellow>/ie lore replace {Heavy} {Very light}'
        - '<gray>''<yellow>Heavy sword</yellow>'' -> ''<yellow>Very light sword</yellow>'''
