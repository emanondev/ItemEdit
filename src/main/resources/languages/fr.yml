  lore:
    description:
      - '<gradient:#A78BFA:gold><b>Modifier la description de l''objet</b></gradient>'
      - ''
      - '<gray><yellow>Add <text> </yellow><dark_gray>»</dark_gray> ajouter du texte sur une nouvelle ligne'
      - '<gray><yellow>Insert <line> <text> </yellow><dark_gray>»</dark_gray> ajouter du texte sur la ligne sélectionnée'
