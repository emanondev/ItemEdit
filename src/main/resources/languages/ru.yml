generic:
  help:
    player-only: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <red>Команда только для игроков.'
    no-item-on-hand: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <red>Вам нужно держать предмет в руке'
    lack-permission: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <red>У вас нет разрешения %permission%'
    lack-permission-generic: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <red>У вас нет разрешения на использование этой команды'
    blocked-by-censure: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <red>Вы не можете использовать этот текст, он содержит заблокированные слова'
    blocked-by-type-restriction: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <red>Вы не можете переименовать этот элемент'
    blocked-by-type-restriction-lore: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <red>Вы не можете редактировать описание этого предмета.'
    blocked-by-lore-line-limit: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <red>Вы не можете добавить больше строк описания этого предмета.'
    blocked-by-lore-length-limit: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <red>Вы не можете устанавливать строки длиннее, чем %limit% символов'
    blocked-by-rename-length-limit: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray> <red>Вы не можете задавать имена длиннее, чем %limit% символов.'

    prefix: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemEdit</bold></gradient><dark_gray>]</dark_gray>'
    header-format: '<gradient:#54acff:#A78BFA><bold>%header%</bold></gradient> <dark_gray>»</dark_gray> <#A78BFA><bold>Помощь</bold></#A78BFA>'
    header-sub-format: '<gradient:#54acff:#A78BFA><bold>%header%</bold></gradient> <dark_gray>»</dark_gray> <gradient:#A78BFA:#54acff><bold>%sub%</bold></gradient> <dark_gray>»</dark_gray> <#55d6ff><bold>Помощь</#55d6ff>'
    command-format: '<gray>/%command%</gray> <#bad1ff>%sub%</#bad1ff> <#d7bbff>%params%</#d7bbff>'
    footer-format: '%prev_clickable% <#7E9CFD><b>Помощь</b> [%page%/%max_page%]</#7E9CFD> %next_clickable%'
    next_text: ' <light_purple><b>><st>> ></st> '
    prev_text: ' <light_purple><b><st>< <</st>< '
    next_void: ' <dark_gray><b>><st>> ></st> '
    prev_void: ' <dark_gray><b><st>< <</st>< '
    next_hover: '<gold><b>Перейти на страницу %target%'
    prev_hover: '<gold><b>Перейти на страницу %target%'
  wrong-material:
    axolotl_bucket: '%prefix% <red>Предмет должен быть ведром аксолотля.'
    banner: '%prefix% <red>Предмет должен быть баннером'
    damageable: '%prefix% <red>Предмет должен иметь такую же прочность, как инструменты и доспехи.'
    player_head: '%prefix% <red>Предмет должен быть головой игрока.'
    rgb_colorable: '%prefix% <red>Предмет должен быть раскрашиваемого типа, например, кожаные доспехи, звезды фейерверков, зелья или стрелы с эффектами зелий.'
    written_book: '%prefix% <red>Предмет должен быть написанной книгой.'
    potion_effect_applicable: '%prefix% <red>Предмет должен быть зельем, стрелой с эффектом зелья или подозрительным рагу.'
    firework: '%prefix% <red>Предмет должен быть фейерверком.'
    spawner_egg: '%prefix% <red>Предмет должен быть яйцом призывания.'
    tropical_fish_bucket: '%prefix% <red>Предметом должно быть ведро с тропической рыбой.'
    writable_book: '%prefix% <red>Предмет должен быть написанной книгой или книгой и пером.'
    compass: '%prefix% <red>Предмет должен быть компасом'
    music_instrument: '%prefix% <red>Предмет должен быть козлиным рогом.'
    armor: '%prefix% <red>Предмет должен быть доспехом.'
    enchantment_storage: '%prefix% <red>Предмет должен быть книгой или зачарованной книгой.'
  wrong-alias:
    axolotl_variant: '%prefix% <red>Неверное значение аксолотля! <dark_red>[<gold>наведите здесь<dark_red>]'
    potion_effect: '%prefix% <red>Неправильное значение эффекта! <dark_red>[<gold>наведите здесь<dark_red>]'
    animations: '%prefix% <red>Неправильное значение анимации! <dark_red>[<gold>наведите здесь<dark_red>]'
    sound: '%prefix% <red>Неправильное значение звука! <dark_red>[<gold>наведите здесь<dark_red>]'
    enchant: '%prefix% <red>Неверное значение зачарования! <dark_red>[<gold>наведите здесь<dark_red>]'
    flag_type: '%prefix% <red>Неправильное значение флага! <dark_red>[<gold>наведите здесь<dark_red>]'
    book_type: '%prefix% <red>Неверное значение типа книги! <dark_red>[<gold>наведите здесь<dark_red>]'
    equip_slot: '%prefix% <red>Неправильное значение слота для оборудования! <dark_red>[<gold>наведите здесь<dark_red>]'
    banner_pattern: '%prefix% <red>Неверное значение шаблона! <dark_red>[<gold>наведите здесь<dark_red>]'
    color: '%prefix% <red>Неверное значение цвета! <dark_red>[<gold>наведите здесь<dark_red>]'
    mob_type: '%prefix% <red>Неверное значение типа яйца! <dark_red>[<gold>наведите здесь<dark_red>]'
    trim_material: '%prefix% <red>Неправильная отделка брони. Ценность материала! <dark_red>[<gold>наведите здесь<dark_red>]'
    tropical_fish_pattern: '%prefix% <red>Неверное значение шаблона! <dark_red>[<gold>наведите здесь<dark_red>]'
    trim_pattern: '%prefix% <red>Неверное значение образца отделки брони! <dark_red>[<gold>наведите здесь<dark_red>]'
    boolean: '%prefix% <red>Неверное логическое значение! <dark_red>[<gold>наведите здесь<dark_red>]'
    attribute: '%prefix% <red>Неверное значение атрибута! <dark_red>[<gold>наведите здесь<dark_red>]'
    operation: '%prefix% <red>Неправильное значение операции! <dark_red>[<gold>наведите здесь<dark_red>]'
    itemrarity: '%prefix% <red>Неверное значение редкости! <dark_red>[<gold>наведите здесь<dark_red>]'
    entitytype: '%prefix% <red>Неверное значение EntityType! <dark_red>[<gold>наведите здесь<dark_red>]'
    entitygroups: '%prefix% <red>Неверное значение EntityGroup! <dark_red>[<gold>наведите здесь<dark_red>]'
    consumable_effect: '%prefix% <red>Неверное значение расходуемого эффекта! <dark_red>[<gold>наведите здесь<dark_red>]'
    goat_horn_sound: '%prefix% <red>Неправильное значение звука козьего рога! <dark_red>[<gold>наведите здесь<dark_red>]'
    error-pre-hover: '<gradient:#A78BFA:gold><b>Псевдонимы:</b></gradient>'
    first_color: '<aqua>'
    second_color: '<yellow>'
itemedit:
  amount:
    description:
      - '<gradient:#A78BFA:gold><b>Установленная сумма</b></gradient>'
      - ''
      - '<gray><yellow><amount> </yellow>сумма для установки (до 127)'
      - '<gold><b>Совет</b></gold> <gray>Отрицательные суммы вычитаются'
      - '<gray> от текущей суммы предмета'
    params: '<amount>'
    feedback: '%prefix% <green>Количество предметов установлено на <yellow>%amount%'
    feedback-decrease: '%prefix% <green>Количество предметов уменьшено на <yellow>%amount%'
  attribute:
    description:
      - '<gradient:#A78BFA:gold><b>Редактировать модификаторы атрибутов</b></gradient>'
      - ''
      - '<gray><yellow>Add <attribute> <amount> [operation] [slot] </yellow><dark_gray>»</dark_gray> добавить новые модификаторы'
      - '<gray><yellow>Remove <attribute/slot> </yellow><dark_gray>»</dark_gray> удаляет некоторые модификаторы'
    params: '<add/remove> [...]'
    add:
      params: '<attribute> <amount> [operation] [slot]'
      description:
        - '<gradient:#A78BFA:gold><b>Добавить модификатор атрибута</b></gradient>'
        - ''
        - '<gray><yellow><attribute> </yellow>тип атрибута'
        - '<gray><yellow><amount> </yellow>сумма для установки'
        - '<gray><yellow>[operation] </yellow>как добавляется модификатор, по умолчанию суммируется'
        - '<gray><yellow>[slot] </yellow>применять этот модификатор только тогда, когда элемент выбран'
        - '<gray> слот оборудования или любой слот оборудования, если не выбран'
      feedback: '%prefix% <green>Добавлен модификатор.'
    remove:
      params: '<attribute/slot>'
      description:
        - '<gradient:#A78BFA:gold><b>Удалить модификаторы</b></gradient>'
        - ''
        - '<gray><yellow><attribute/slot> </yellow>тип для удаления, любые модификаторы с'
        - '<gray> выбранное значение удаляется'
      feedback-attribute: '%prefix% <green>Удалены модификаторы атрибута.'
      feedback-equipment: '%prefix% <green>Удалены модификаторы слота снаряжения.'
  axolotlvariant:
    description:
      - '<gradient:#A78BFA:gold><b>Редактировать вариант аксолотля в ведре аксолотля</b></gradient>'
      - '<white><sprite:items:item/axolotl_bucket>'
      - '<gray><yellow><type> </yellow>вид аксолотля'
    params: '<type>'
    feedback: '%prefix% <green>Изменен вариант Аксолотля на <yellow>%variant%.'
  banner:
    description:
      - '<gradient:#A78BFA:gold><b>Редактировать баннер</b></gradient>'
    params: '<add/set/remove/color> [...]'
    set:
      params: '<type> <color> <line>'
      description:
        - '<gradient:#A78BFA:gold><b>Заменить шаблон в выбранной строке</b></gradient>'
      feedback: '%prefix% <green>Набор узоров'
    add:
      params: '<type> <color>'
      description:
        - '<gradient:#A78BFA:gold><b>Добавить узор</b></gradient>'
      feedback: '%prefix% <green>Шаблон добавлен.'
    remove:
      params: '<line>'
      description:
        - '<gradient:#A78BFA:gold><b>Удалить шаблон в выбранной строке</b></gradient>'
      feedback: '%prefix% <green>Шаблон удален.'
    color:
      params: '<line> <color>'
      description:
        - '<gradient:#A78BFA:gold><b>Изменить цвет узора в выбранной строке</b></gradient>'
      feedback: '%prefix% <green>Узор перекрашен.'
  bookauthor:
    description:
      - '<gradient:#A78BFA:gold><b>Установить автора</b></gradient>'
      - '<white><sprite:items:item/written_book>'
      - '<gray>Имя автора может содержать пробелы и быть цветным.'
      - '<gray>Работает только с написанными книгами.'
    params: '<name>'
    feedback: '%prefix% <green>Обновлён автор книги'
    feedback-reset: '%prefix% <green>Сбросить автора книги'
  bookenchant:
    description:
      - '<gradient:#A78BFA:gold><b>Установить чары на книге</b></gradient>'
      - '<white><sprite:items:item/enchanted_book> <sprite:items:item/book>'
      - '<gray>Разница между enchant и bookenchant заключается в том, что'
      - '<gray>книга с enchant огненным аспектом поджигает цели при попадании в нее'
      - '<gray>, а книга с bookenchant нет'
      - ''
      - '<gray><yellow><enchant> </yellow>тип чар'
      - '<gray><yellow>[level] </yellow>уровень зачарования, по умолчанию <yellow>1'
      - ''
      - '<gold><b>Совет</b></gold> <gray>Установите <yellow>[level] </yellow>на <yellow>0 </yellow>, чтобы снять чары'
    params: '<enchant> [level]'
    feedback-removed: '%prefix% <green>Удалены книжные чары <yellow>%enchant%'
    feedback: '%prefix% <green>Прикладное зачарование книг <yellow>%enchant% <green>lv <yellow>%lv%'
  booktype:
    description:
      - '<gradient:#A78BFA:gold><b>Установить тип книги</b></gradient>'
      - '<white><sprite:items:item/written_book>'
      - '<gray>Работает только с написанными книгами.'
    params: '<booktype>'
    feedback: '%prefix% <green>Обновлено поколение книг до <yellow>%generation%.'
    feedback-reset: '%prefix% <green>Сбросить генерацию книги'
  color:
    description:
      - '<gradient:#A78BFA:gold><b>Установить цвет</b></gradient>'
      - '<white><sprite:items:item/potion> <sprite:items:item/tipped_arrow_base> <sprite:items:item/firework_star> <sprite:items:item/leather_chestplate>'
      - '<gray> Работает с кожаными доспехами и звездами фейерверков, зельями и стрелами с эффектами зелий!'
      - '<gray><yellow>[red] [green] [blue] </yellow> - количество каждого цвета, которое нужно объединить.'
      - '<gray>Каждый цвет представляет собой целое число от 0 до 255.'
      - '<gray>Если вы запутались, введите в Google «<yellow>Палитра цветов RGB</yellow>»'
    params: '[red] [green] [blue]'
    feedback: '%prefix% <green>Цвет обновлен.'
  compass:
    description:
      - '<gradient:#A78BFA:gold><b>Установить местоположение цели компаса</b></gradient>'
      - '<white><sprite:items:item/compass_00>'
      - '<gray><yellow>Set </yellow><dark_gray>»</dark_gray> установить ваше местоположение в качестве цели компаса'
      - '<gray><yellow>Clear </yellow><dark_gray>»</dark_gray> очистить цель по компасу'
    params: '<set/clear>'
    set:
      feedback: '%prefix% <green>Компас теперь указывает на <yellow>%world% %x% %y% %z%'
    clear:
      feedback: '%prefix% <green>Цель компаса удалена.'
  custommodeldata:
    description:
      - '<gradient:#A78BFA:gold><b>Редактировать данные пользовательской модели</b></gradient>'
      - ''
      - '<gray>Используется для пакетов текстур.'
      - '<gray><yellow>[value] </yellow>положительное целое число целевой модели данных'
      - '<gray>Примечание: на современных серверах используется itemmodel вместо custommodeldata.'
      - '<gray> для текстур, эта команда предназначена для устаревших клиентов.'
    params: '<value>'
    feedback: '%prefix% <green>Данные пользовательской модели обновлены.'
    feedback-reset: '%prefix% <green>Сброс данных пользовательской модели'
  damage:
    description:
      - '<gradient:#A78BFA:gold><b>Изменить долговечность</b></gradient>'
      - ''
      - '<gray><yellow><durability> </yellow>наносимый урон'
      - '<gray><gold>N.B.</gold> <yellow>0 </yellow> означает отсутствие повреждений, полная долговечность'
    params: '<durability>'
    feedback-reset: '%prefix% <green>Прочность восстановлена.'
    feedback: '%prefix% <green>Прочность обновлена.'
  equipment:
    description:
      - '<gradient:#A78BFA:gold><b>Задает свойство «Оборудование» предмета</b></gradient>'
      - ''
      - '<gray><gold><b>Совет</b></gold> Используйте /itemequip or /iee'
      - '<gray><gold>Примечание</gold> ваши напитки нельзя есть'
    params: ''
  enchant:
    description:
      - '<gradient:#A78BFA:gold><b>Установить чары</b></gradient>'
      - ''
      - '<gray><yellow><enchant> </yellow>тип чар'
      - '<gray><yellow>[level] </yellow>уровень зачарования, по умолчанию <yellow>1'
      - ''
      - '<gold><b>Совет</b></gold> <gray>Установите <yellow>[level] </yellow>на <yellow>0 </yellow>, чтобы снять чары'
    params: '<enchant> [level]'
    feedback-removed: '%prefix% <green>Удалены чары <yellow>%enchant%'
    feedback: '%prefix% <green>Прикладное зачарование <yellow>%enchant% <green>lv <yellow>%lv%'
  fireresistent:
    description:
      - '<gradient:#A78BFA:gold><b>Установить сопротивление предмета огню/лаве</b></gradient>'
      - ''
      - '<gray><yellow>[true/false] </yellow>установите значение, переключение по умолчанию'
      - ''
      - '<gray>Предмет с сопротивлением огню не будет уничтожен.'
      - '<gray> при падении в огонь и парит над лавой.'
    params: '[true/false]'
    feedback: '%prefix% <green>Сопротивление огню установлено на <yellow>%value%.'
  fireworkpower:
    description:
      - '<gradient:#A78BFA:gold><b>Установить мощность фейерверка</b></gradient>'
      - '<white><sprite:items:item/firework_rocket>'
      - '<gray><yellow><power> </yellow>мощность фейерверка, значение между <yellow>0 </yellow>и <yellow>5'
    params: '<power>'
    feedback: '%prefix% <green>Обновленная мощность фейерверка.'
  firework:
    description:
      - '<gradient:#A78BFA:gold><b>Редактировать фейерверк с помощью графического интерфейса</b></gradient>'
      - '<white><sprite:items:item/firework_rocket>'
    params: ''
  food:
    description:
      - '<gradient:#A78BFA:gold><b>Задает свойство еды предмета</b></gradient>'
      - ''
      - '<gray><gold><b>Совет</b></gold> Используйте /itemfood or /if'
      - '<gray><gold>Примечание</gold> ваши напитки нельзя есть'
    params: ''
  glider:
    description:
      - '<gradient:#A78BFA:gold><b>Установить состояние планера</b></gradient>'
      - ''
      - '<gray>Планер должен позволять планировать, как на надкрыльях.'
      - '<gray><yellow>[true/false] </yellow>установить значение планера, переключатель по умолчанию'
    params: '[true/false]'
    feedback: '%prefix% <green>Обновлено значение скольжения до <yellow>%value%.'
  glow:
    description:
      - '<gradient:#A78BFA:gold><b>Переопределить эффект свечения чар</b></gradient>'
      - ''
      - '<gray><yellow>[true/false] </yellow>установите значение, по умолчанию сброс'
      - ''
      - '<gold><b>Совет</b></gold> <gray><yellow>значение не указано </yellow>восстановить ванильное поведение'
    params: '[true/false/default]'
    feedback: '%prefix% <green>Свечение установлено на <yellow>%value%'
    feedback-reset: '%prefix% <green>Сбросить значение свечения по умолчанию.'
  goathornsound:
    description:
      - '<gradient:#A78BFA:gold><b>Установить звук рога козла</b></gradient>'
      - '<white><sprite:items:item/goat_horn>'
      - '<gray><yellow><type> </yellow>тип звука'
    params: '<type>'
    feedback: '%prefix% <green>Обновленный звук'
  hide:
    description:
      - '<gradient:#A78BFA:gold><b>Скрыть или показать компоненты</b></gradient>'
      - ''
      - '<gray><yellow><flag> </yellow>флаг элемента для редактирования'
      - '<gray><yellow>[true/false] </yellow>установить значение флага, переключение по умолчанию'
      - ''
      - '<gold><b>Совет</b></gold> <gray>скрыть шаблоны баннеров с помощью флажка potion_effects'
      - '<gold><b>Совет</b></gold> <gray>скройте все флаги одновременно с помощью <yellow>/itemedit hideall'
    params: '<flag> [true/false]'
    feedback: '%prefix% <green>Флаг теперь <yellow>%value%'
  hidetooltip:
    description:
      - '<gradient:#A78BFA:gold><b>Скрыть или показать подсказки</b></gradient>'
      - ''
      - '<gray><yellow>[true/false] </yellow>установить значение флага, переключение по умолчанию'
    params: '[true/false]'
    feedback: '%prefix% <green> Статус скрытой подсказки теперь равен <yellow>%value%.'
  hideall:
    description:
      - '<gradient:#A78BFA:gold><b>Скрыть все компоненты</b></gradient>'
      - ''
      - '<gray>Скрывает: чары, эффекты зелий, слои баннеров, атрибуты...'
      - ''
      - '<gold><b>Совет</b></gold> <gray>скрыть отдельные компоненты с помощью <yellow>/itemedit hide <flag> true'
    params: ''
    feedback: '%prefix% <green>Спрятаны все флаги'
  itemmodel:
    description:
      - '<gradient:#A78BFA:gold><b>Редактировать модель предмета</b></gradient>'
      - ''
      - '<gray><yellow><namespaced key> </yellow>клавиша для установки ссылки на текстуру'
      - '<gray>Пример: /ie itemmodel <yellow>iron_sword'
      - '<gray>Пример: /ie itemmodel <yellow>minecraft:iron_sword'
      - ''
      - '<gray><yellow><namespace></yellow>:<yellow><id></yellow> будет ссылаться на модель:'
      - '  /assets/<yellow><namespace></yellow>/models/item/<yellow><id>'
    params: '<namespaced key>'
