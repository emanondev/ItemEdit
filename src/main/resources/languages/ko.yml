itemedit:
  amount:
    description:
      - '<gradient:#A78BFA:gold><b>설정금액</b></gradient>'
      - ''
      - '<gray><yellow><amount> </yellow>설정량 (최대 127)'
      - '<gold><b>팁</b></gold> <gray>마이너스 금액은 차감됩니다.'
      - '<gray> 아이템 현재 금액에서'
    params: '<amount>'
    feedback: '%prefix% <green>아이템 금액이 <yellow>%amount%로 설정됨'
    feedback-decrease: '%prefix% <green>아이템 수량이 <yellow>%amount% 감소했습니다.'
  attribute:
    description:
      - '<gradient:#A78BFA:gold><b>속성 수정자 편집</b></gradient>'
      - ''
      - '<gray><yellow>Add <attribute> <amount> [operation] [slot] </yellow><dark_gray>»</dark_gray> 새 수식어 추가'
      - '<gray><yellow>Remove <attribute/slot> </yellow><dark_gray>»</dark_gray> 일부 수정자를 제거합니다.'
    params: '<add/remove> [...]'
    add:
      params: '<attribute> <amount> [operation] [slot]'
      description:
        - '<gradient:#A78BFA:gold><b>속성 수정자 추가</b></gradient>'
        - ''
        - '<gray><yellow><attribute> </yellow>속성 유형'
        - '<gray><yellow><amount> </yellow>설정할 금액'
        - '<gray><yellow>[operation] </yellow>수정자가 추가되는 방식, 기본적으로 합계'
        - '<gray><yellow>[slot] </yellow>아이템이 선택된 경우에만 이 수정자를 적용합니다.'
        - '<gray> 장비 슬롯 또는 선택하지 않은 경우 모든 장비 슬롯'
      feedback: '%prefix% <green>수정자 추가됨'
    remove:
      params: '<attribute/slot>'
      description:
        - '<gradient:#A78BFA:gold><b>수정자 제거</b></gradient>'
        - ''
        - '<gray><yellow><attribute/slot> </yellow> 제거하려면 유형을 입력하세요.'
        - '<gray> 선택한 값이 제거됩니다.'
      feedback-attribute: '%prefix% <green>속성 수식어 제거됨'
      feedback-equipment: '%prefix% <green>장비 슬롯 수정자를 제거했습니다.'
  axolotlvariant:
    description:
      - '<gradient:#A78BFA:gold><b>Axolotl 버킷의 Axolotl 변형 편집</b></gradient>'
      - '<white><sprite:items:item/axolotl_bucket>'
      - '<gray><yellow><type> </yellow>아홀로틀의 종류'
    params: '<type>'
    feedback: '%prefix% <green>Axolotl 변형을 <yellow>%variant%로 변경했습니다.'
  banner:
    description:
      - '<gradient:#A78BFA:gold><b>배너 수정</b></gradient>'
    params: '<add/set/remove/color> [...]'
    set:
      params: '<type> <color> <line>'
      description:
        - '<gradient:#A78BFA:gold><b>선택한 줄의 패턴 바꾸기</b></gradient>'
      feedback: '%prefix% <green>패턴 세트'
    add:
      params: '<type> <color>'
      description:
        - '<gradient:#A78BFA:gold><b>패턴 추가</b></gradient>'
      feedback: '%prefix% <green> 패턴 추가됨'
    remove:
      params: '<line>'
      description:
        - '<gradient:#A78BFA:gold><b>선택한 줄의 패턴 제거</b></gradient>'
      feedback: '%prefix% <green> 패턴이 삭제됨'
    color:
      params: '<line> <color>'
      description:
        - '<gradient:#A78BFA:gold><b>선택한 라인의 패턴 색상 변경</b></gradient>'
      feedback: '%prefix% <green> 패턴이 다시 칠해짐'
  bookauthor:
    description:
      - '<gradient:#A78BFA:gold><b>작성자 설정</b></gradient>'
      - '<white><sprite:items:item/written_book>'
      - '<gray>저자 이름에는 공백이 포함될 수 있으며 색상도 표시될 수 있습니다.'
      - '<gray>기록된 책에서만 작동합니다.'
    params: '<name>'
    feedback: '%prefix% <green>업데이트된 책 저자'
    feedback-reset: '%prefix% <green>책 저자 재설정'
  bookenchant:
    description:
      - '<gradient:#A78BFA:gold><b>책에 마법 부여</b></gradient>'
      - '<white><sprite:items:item/enchanted_book> <sprite:items:item/book>'
      - '<gray> enchant과 bookenchant의 차이점은 다음과 같습니다.'
      - '<gray>불 속성이 enchant인 책은 적중 시 대상에 불을 붙입니다.'
      - '<gray> 반면 bookenchant이 포함된 책은 그렇지 않습니다.'
      - ''
      - '<gray><yellow><enchant> </yellow>마법 유형'
      - '<gray><yellow>[level] </yellow>인챈트 레벨, 기본적으로 <yellow>1'
      - ''
      - '<gold><b>팁</b></gold> <gray>마법을 제거하려면 <yellow>[level] </yellow>를 <yellow>0 </yellow>로 설정하세요'
    params: '<enchant> [level]'
    feedback-removed: '%prefix% <green>책 마법 부여 제거 <yellow>%enchant%'
    feedback: '%prefix% <green>도서 마법 적용 <yellow>%enchant% <green>lv <yellow>%lv%'
  booktype:
    description:
      - '<gradient:#A78BFA:gold><b>책 유형 설정</b></gradient>'
      - '<white><sprite:items:item/written_book>'
      - '<gray>기록된 책에서만 작동합니다.'
    params: '<booktype>'
    feedback: '%prefix% <green>도서 생성을 <yellow>%generation%로 업데이트했습니다.'
    feedback-reset: '%prefix% <green>도서 생성 재설정'
  color:
    description:
      - '<gradient:#A78BFA:gold><b>색상 설정</b></gradient>'
      - '<white><sprite:items:item/potion> <sprite:items:item/tipped_arrow_base> <sprite:items:item/firework_star> <sprite:items:item/leather_chestplate>'
      - '<gray>가죽 갑옷과 폭죽 별, 물약 효과가 있는 물약과 화살에도 작동합니다!'
      - '<gray><yellow>[red] [green] [blue] </yellow>는 각 색상을 합치는 양입니다.'
      - '<gray>각 색상은 0에서 255 사이의 int 값입니다.'
      - '<gray>헷갈리신다면 구글 "<yellow>RGB 색상 선택기</yellow>"'
    params: '[red] [green] [blue]'
    feedback: '%prefix% <green>색상 업데이트됨'
  compass:
    description:
      - '<gradient:#A78BFA:gold><b>나침반 목표 위치 설정</b></gradient>'
      - '<white><sprite:items:item/compass_00>'
      - '<gray><yellow>Set </yellow><dark_gray>»</dark_gray> 위치를 나침반 목표로 설정'
      - '<gray><yellow>Clear </yellow><dark_gray>»</dark_gray> 나침반 타겟 지우기'
    params: '<set/clear>'
    set:
      feedback: '%prefix% <green>나침반은 이제 <yellow>%world% %x% %y% %z%를 가리킵니다.'
    clear:
      feedback: '%prefix% <green>나침반 목표가 삭제되었습니다.'
  custommodeldata:
    description:
      - '<gradient:#A78BFA:gold><b>맞춤 모델 데이터 편집</b></gradient>'
      - ''
      - '<gray>텍스처 팩에 사용됨'
      - '<gray><yellow>[value] </yellow>대상 데이터 모델의 양수 정수'
      - '<gray>참고: 최신 서버에서는 itemmodel 대신에 custommodeldata'
      - '<gray> 텍스처의 경우 이 명령은 레거시 클라이언트용입니다.'
    params: '<value>'
    feedback: '%prefix% <green>맞춤 모델 데이터가 업데이트되었습니다.'
    feedback-reset: '%prefix% <green>맞춤 모델 데이터 재설정'
  damage:
    description:
      - '<gradient:#A78BFA:gold><b>내구도 편집</b></gradient>'
      - ''
      - '<gray><yellow><durability> </yellow> 피해 적용'
      - '<gray><gold>N.B.</gold> <yellow>0 </yellow>는 손상이 없고 완전한 내구성을 의미합니다.'
    params: '<durability>'
    feedback-reset: '%prefix% <green>내구도 회복'
    feedback: '%prefix% <green>내구도 업데이트'
  equipment:
    description:
      - '<gradient:#A78BFA:gold><b>아이템의 장비 속성을 설정</b></gradient>'
      - ''
      - '<gray><gold><b>팁</b></gold> /itemequip or /iee 사용'
      - '<gray><gold>N.B.</gold> 마실 수 있는 품목은 먹을 수 없습니다.'
    params: ''
  enchant:
    description:
      - '<gradient:#A78BFA:gold><b>인챈트 설정</b></gradient>'
      - ''
      - '<gray><yellow><enchant> </yellow>마법 유형'
      - '<gray><yellow>[level] </yellow>인챈트 레벨, 기본적으로 <yellow>1'
      - ''
      - '<gold><b>팁</b></gold> <gray>마법을 제거하려면 <yellow>[level] </yellow>를 <yellow>0 </yellow>로 설정하세요'
    params: '<enchant> [level]'
    feedback-removed: '%prefix% <green>마법 제거됨 <yellow>%enchant%'
    feedback: '%prefix% <green>인챈트 적용 <yellow>%enchant% <green>lv <yellow>%lv%'
  fireresistent:
    description:
      - '<gradient:#A78BFA:gold><b>불/용암에 대한 아이템 저항 설정</b></gradient>'
      - ''
      - '<gray><yellow>[true/false] </yellow> 값 설정, 기본적으로 토글'
      - ''
      - '<gray>내화성이 있는 아이템은 파괴되지 않습니다.'
      - '<gray> 불 속에 떨어지면 용암 위로 떠오릅니다.'
    params: '[true/false]'
    feedback: '%prefix% <green>화염 저항이 <yellow>%value%로 설정되었습니다.'
  fireworkpower:
    description:
      - '<gradient:#A78BFA:gold><b>폭죽 세기 설정</b></gradient>'
      - '<white><sprite:items:item/firework_rocket>'
      - '<gray><yellow><power> </yellow>폭죽의 위력, <yellow>0 </yellow>~<yellow>5 사이의 값'
    params: '<power>'
    feedback: '%prefix% <green>폭죽 성능 업데이트'
  firework:
    description:
      - '<gradient:#A78BFA:gold><b>GUI로 불꽃 편집</b></gradient>'
      - '<white><sprite:items:item/firework_rocket>'
    params: ''
  food:
    description:
      - '<gradient:#A78BFA:gold><b>아이템의 식품 속성을 설정</b></gradient>'
      - ''
      - '<gray><gold><b>팁</b></gold> /itemfood or /if 사용'
      - '<gray><gold>N.B.</gold> 마실 수 있는 품목은 먹을 수 없습니다.'
    params: ''
  glider:
    description:
      - '<gradient:#A78BFA:gold><b>글라이더 상태 설정</b></gradient>'
      - ''
