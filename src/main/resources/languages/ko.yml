    enchant: '%prefix% <red>인챈트 값이 잘못되었습니다! <dark_red>[<gold>여기에 마우스를 올리세요<dark_red>]'
    flag_type: '%prefix% <red>플래그 값이 잘못되었습니다! <dark_red>[<gold>여기에 마우스를 올리세요<dark_red>]'
